<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Biology Flashcard Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dfffe8,#d9f0ff,#f3e8ff);display:flex;align-items:center;justify-content:center;padding:24px;color:#163020}
.app{width:100%;max-width:920px;background:rgba(255,255,255,.92);border-radius:28px;box-shadow:0 24px 60px rgba(24,68,52,.18);overflow:hidden;border:1px solid rgba(255,255,255,.8)}
.header{background:linear-gradient(135deg,#18a058,#2eb7a0);color:white;padding:28px;text-align:center}
.header h1{font-size:clamp(2rem,5vw,3.25rem);letter-spacing:.5px;margin-bottom:8px}
.header p{font-size:1rem;opacity:.95}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;background:#f7fffb}
.stat{background:white;border-radius:18px;padding:16px;text-align:center;box-shadow:0 8px 20px rgba(24,68,52,.08);border:1px solid #e0f4e9}
.stat span{display:block;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:#58806b;font-weight:700;margin-bottom:6px}
.stat strong{font-size:1.55rem;color:#126b3b}
.progress-wrap{padding:0 24px 20px;background:#f7fffb}
.progress-track{height:14px;background:#d8eee2;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:10%;background:linear-gradient(90deg,#18a058,#7bdc72);border-radius:999px;transition:width .35s ease}
.stage{padding:26px}
.card-shell{perspective:1200px;min-height:390px}
.card{position:relative;width:100%;min-height:390px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 20px 40px rgba(24,68,52,.14)}
.front{background:linear-gradient(145deg,#ffffff,#eefbf3)}
.back{background:linear-gradient(145deg,#163020,#1f8a5b);color:white;transform:rotateY(180deg);align-items:center;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:#e5f8ec;color:#126b3b;border-radius:999px;padding:9px 14px;font-size:.83rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.question{font-size:clamp(1.35rem,3vw,2rem);line-height:1.35;color:#163020;margin:20px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.option{border:2px solid #d7eadf;background:white;border-radius:16px;padding:15px;text-align:left;font-size:1rem;font-weight:700;color:#214c35;cursor:pointer;transition:.22s ease}
.option:hover{transform:translateY(-2px);border-color:#18a058;box-shadow:0 8px 18px rgba(24,160,88,.14)}
.option.correct{background:#dff8e8;border-color:#18a058;color:#0d6b35}
.option.wrong{background:#ffe4e4;border-color:#de3b3b;color:#982323}
.option.disabled{pointer-events:none}
.answer-label{font-size:.9rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;opacity:.8;margin-bottom:12px}
.answer-text{font-size:clamp(2rem,6vw,4rem);font-weight:900;margin-bottom:18px}
.answer-detail{font-size:1.08rem;line-height:1.55;max-width:640px;opacity:.94}
.controls{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:14px 22px;font-size:1rem;font-weight:800;cursor:pointer;transition:.22s ease;color:white;background:#18a058;box-shadow:0 10px 18px rgba(24,160,88,.18)}
.btn:hover{transform:translateY(-2px);background:#13864a}
.btn.secondary{background:#edf7f1;color:#126b3b;box-shadow:none}
.btn.secondary:hover{background:#dcefe5}
.btn.dark{background:#163020}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.result{display:none;text-align:center;padding:30px;border-radius:28px;background:linear-gradient(145deg,#ffffff,#edf9f2);box-shadow:0 18px 35px rgba(24,68,52,.12);border:1px solid #e0f4e9}
.result.show{display:block}
.result h2{font-size:clamp(2rem,5vw,3rem);color:#126b3b;margin-bottom:12px}
.result-score{font-size:4rem;font-weight:900;color:#163020;margin:16px 0}
.result p{font-size:1.1rem;color:#456654;line-height:1.5}
.footer-note{text-align:center;color:#58806b;font-size:.9rem;padding:0 24px 24px}
@media(max-width:720px){
.stats{grid-template-columns:1fr}
.options{grid-template-columns:1fr}
.stage{padding:18px}
.face{padding:22px}
.card-shell,.card{min-height:520px}
.controls{flex-direction:column}
.btn{width:100%}
}
</style>
</head>
<body>
<main class="app">
<section class="header">
<h1>Biology Flashcard Game</h1>
<p>Flip, answer, review, and track biology quiz progress.</p>
</section>

<section class="stats">
<div class="stat"><span>Card</span><strong id="cardNumber">1/10</strong></div>
<div class="stat"><span>Score</span><strong id="score">0</strong></div>
<div class="stat"><span>Answered</span><strong id="answered">0</strong></div>
</section>

<section class="progress-wrap">
<div class="progress-track">
<div class="progress-bar" id="progressBar"></div>
</div>
</section>

<section class="stage">
<div id="gameArea">
<div class="card-shell">
<div class="card" id="card">
<div class="face front">
<div>
<div class="badge">Question</div>
<h2 class="question" id="questionText"></h2>
</div>
<div class="options" id="options"></div>
</div>
<div class="face back">
<div>
<div class="answer-label">Correct Answer</div>
<div class="answer-text" id="answerText"></div>
<p class="answer-detail" id="answerDetail"></p>
</div>
</div>
</div>
</div>

<div class="controls">
<button class="btn secondary" id="prevBtn">Previous</button>
<button class="btn dark" id="flipBtn">Flip Card</button>
<button class="btn" id="nextBtn">Next</button>
<button class="btn secondary" id="restartBtn">Restart</button>
</div>
</div>

<div class="result" id="result">
<h2>Study Round Complete</h2>
<div class="result-score" id="finalScore">0/10</div>
<p id="finalMessage"></p>
<div class="controls" style="justify-content:center">
<button class="btn" id="playAgainBtn">Play Again</button>
</div>
</div>
</section>

<p class="footer-note">Select an answer or flip a card to reveal the correct response.</p>
</main>

<script>
const questions=[
{q:"What is the basic structural and functional unit of life?",o:["A. Tissue","B. Organ","C. Cell","D. Atom"],a:"C. Cell",detail:"The cell is the smallest unit that carries out all basic life processes."},
{q:"Which organelle is known as the \"powerhouse of the cell\"?",o:["A. Nucleus","B. Ribosome","C. Mitochondrion","D. Golgi apparatus"],a:"C. Mitochondrion",detail:"The mitochondrion produces energy for the cell through cellular respiration."},
{q:"Which process do plants use to make their own food?",o:["A. Respiration","B. Digestion","C. Photosynthesis","D. Transpiration"],a:"C. Photosynthesis",detail:"Photosynthesis uses light energy, carbon dioxide, and water to produce glucose."},
{q:"What is the main function of red blood cells?",o:["A. Fight infections","B. Carry oxygen","C. Produce hormones","D. Clot blood"],a:"B. Carry oxygen",detail:"Red blood cells contain hemoglobin, which transports oxygen around the body."},
{q:"Which blood vessel carries blood away from the heart?",o:["A. Vein","B. Capillary","C. Artery","D. Venule"],a:"C. Artery",detail:"Arteries carry blood away from the heart to body tissues and organs."},
{q:"Which part of the human body filters blood and produces urine?",o:["A. Liver","B. Kidney","C. Heart","D. Lungs"],a:"B. Kidney",detail:"The kidneys filter waste from blood and form urine."},
{q:"What is the scientific name for the process of cell division that produces two identical daughter cells?",o:["A. Meiosis","B. Fertilization","C. Mitosis","D. Mutation"],a:"C. Mitosis",detail:"Mitosis creates two genetically identical daughter cells from one parent cell."},
{q:"Which gas do humans inhale for respiration?",o:["A. Carbon dioxide","B. Nitrogen","C. Oxygen","D. Hydrogen"],a:"C. Oxygen",detail:"Oxygen is inhaled and used by cells during respiration to release energy."},
{q:"Which of the following is a vertebrate?",o:["A. Earthworm","B. Snail","C. Fish","D. Butterfly"],a:"C. Fish",detail:"A fish is a vertebrate because it has a backbone."},
{q:"Which kingdom does the mushroom belong to?",o:["A. Plantae","B. Animalia","C. Protista","D. Fungi"],a:"D. Fungi",detail:"Mushrooms belong to kingdom Fungi, not kingdom Plantae."}
];

let current=0;
let score=0;
let answeredCount=0;
let answered=Array(questions.length).fill(null);

const card=document.getElementById("card");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("options");
const answerText=document.getElementById("answerText");
const answerDetail=document.getElementById("answerDetail");
const cardNumber=document.getElementById("cardNumber");
const scoreEl=document.getElementById("score");
const answeredEl=document.getElementById("answered");
const progressBar=document.getElementById("progressBar");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const flipBtn=document.getElementById("flipBtn");
const restartBtn=document.getElementById("restartBtn");
const gameArea=document.getElementById("gameArea");
const result=document.getElementById("result");
const finalScore=document.getElementById("finalScore");
const finalMessage=document.getElementById("finalMessage");
const playAgainBtn=document.getElementById("playAgainBtn");

function renderCard(){
const item=questions[current];
card.classList.remove("flipped");
questionText.textContent=item.q;
answerText.textContent=item.a;
answerDetail.textContent=item.detail;
cardNumber.textContent=`${current+1}/${questions.length}`;
progressBar.style.width=`${((current+1)/questions.length)*100}%`;
prevBtn.disabled=current===0;
nextBtn.textContent=current===questions.length-1?"Finish":"Next";
optionsBox.innerHTML="";
item.o.forEach(option=>{
const btn=document.createElement("button");
btn.className="option";
btn.textContent=option;
btn.addEventListener("click",e=>{
e.stopPropagation();
selectAnswer(option,btn);
});
if(answered[current]){
btn.classList.add("disabled");
if(option===item.a)btn.classList.add("correct");
if(option===answered[current]&&option!==item.a)btn.classList.add("wrong");
}
optionsBox.appendChild(btn);
});
updateStats();
}

function selectAnswer(choice){
if(answered[current])return;
answered[current]=choice;
answeredCount++;
if(choice===questions[current].a)score++;
card.classList.add("flipped");
renderOptionsState();
updateStats();
}

function renderOptionsState(){
[...optionsBox.children].forEach(btn=>{
btn.classList.add("disabled");
if(btn.textContent===questions[current].a)btn.classList.add("correct");
if(btn.textContent===answered[current]&&btn.textContent!==questions[current].a)btn.classList.add("wrong");
});
}

function updateStats(){
scoreEl.textContent=score;
answeredEl.textContent=answeredCount;
}

function showResults(){
gameArea.style.display="none";
result.classList.add("show");
finalScore.textContent=`${score}/${questions.length}`;
let message="Strong study effort. Review the flipped cards to strengthen recall.";
if(score===10)message="Excellent biology mastery. Every answer was correct.";
else if(score>=7)message="Great progress. A short review can help secure the remaining concepts.";
else if(score>=4)message="Good start. Repeating the flashcards can build stronger recall.";
else message="More review recommended. Focus on the correct answers and key definitions.";
finalMessage.textContent=message;
}

function restart(){
current=0;
score=0;
answeredCount=0;
answered=Array(questions.length).fill(null);
gameArea.style.display="block";
result.classList.remove("show");
renderCard();
}

card.addEventListener("click",()=>card.classList.toggle("flipped"));
flipBtn.addEventListener("click",()=>card.classList.toggle("flipped"));
prevBtn.addEventListener("click",()=>{if(current>0){current--;renderCard();}});
nextBtn.addEventListener("click",()=>{
if(current<questions.length-1){current++;renderCard();}
else showResults();
});
restartBtn.addEventListener("click",restart);
playAgainBtn.addEventListener("click",restart);

renderCard();
</script>

</body>
</html>
