<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #0b5ed7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .logout {
            background: #dc3545;
            float: right;
            margin-top: -45px;
        }

        .topic-help {
            margin-top: 6px;
            color: #6c757d;
            font-size: 13px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        /* =========================
           MANAGEMENT SECTION
        ========================= */

        .management-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .management-header h2 {
            margin: 0;
        }

        .refresh-button {
            background: #198754;
            margin-top: 0;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 15px;
            margin-top: 20px;
        }

        .filters label {
            margin-top: 0;
        }

        .question-count {
            margin-top: 20px;
            font-weight: bold;
            color: #0b5ed7;
        }

        .questions-list {
            margin-top: 20px;
        }

        .question-item {
            border: 1px solid #dce2ea;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            background: #fafcff;
        }

        .question-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .question-number {
            font-weight: bold;
            color: #0b5ed7;
        }

        .question-text {
            font-size: 17px;
            font-weight: bold;
            line-height: 1.5;
            margin: 10px 0;
        }

        .question-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }

        .badge {
            background: #e8f1ff;
            color: #0b5ed7;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .options-list {
            margin-top: 15px;
            line-height: 1.8;
        }

        .correct-option {
            color: #198754;
            font-weight: bold;
        }

        .explanation-box {
            background: #eef6ff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .question-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .question-actions button {
            margin-top: 0;
            padding: 10px 15px;
            font-size: 14px;
        }

        .edit-button {
            background: #ffc107;
            color: #172033;
        }

        .delete-button {
            background: #dc3545;
        }

        .cancel-button {
            background: #6c757d;
        }

        .save-edit-button {
            background: #198754;
        }

        .loading-text {
            text-align: center;
            padding: 30px;
            color: #6c757d;
        }

        .empty-text {
            text-align: center;
            padding: 30px;
            color: #6c757d;
        }

        .edit-form {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dce2ea;
        }

        @media (max-width: 800px) {

            .filters {
                grid-template-columns: 1fr;
            }

            .question-top {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        🏥 OGCONS Study Hub
    </h1>

    <p>
        Admin Dashboard
    </p>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>



<div class="container">


    <!-- ==================================================
         ADD QUESTION
    ================================================== -->

    <div class="card">

        <h2>
            ➕ Add New Question
        </h2>


        <!-- COURSE -->

        <label>
            Course
        </label>

        <select id="course">

            <option value="Microbiology">
                Microbiology
            </option>

            <option value="Anatomy & Physiology">
                Anatomy & Physiology
            </option>

            <option value="Pharmacology">
                Pharmacology
            </option>

            <option value="Medical-Surgical Nursing">
                Medical-Surgical Nursing
            </option>

            <option value="Nutrition">
                Nutrition
            </option>

            <option value="Psychology">
                Psychology
            </option>

            <option value="Nursing Practice">
                Nursing Practice
            </option>

            <option value="Chemistry">
                Chemistry
            </option>

        </select>



        <!-- TOPIC -->

        <label>
            Topic

        <select id="topic">
        </select>


        <div class="topic-help">

        </div>



        <!-- QUESTION -->

        <label>
            Question
        </label>

        <textarea

        </textarea>



        <!-- OPTION A -->

        <label>
            Option A
        </label>

        <input
            id="option_a"

            placeholder="Enter option A">



        <!-- OPTION B -->

        <label>
            Option B
        </label>

        <input
            id="option_b"
            type="text"
            placeholder="Enter option B">



        <!-- OPTION C -->

        <label>
            Option C
        </label>

        <input
            id="option_c"
            type="text"
            placeholder="Enter option C">



        <!-- OPTION D -->

        <label>
            Option D
        </label>

        <input
            id="option_d"
            type="text"

        <!-- CORRECT ANSWER -->

        <label>
            Correct Answer
        </label>

        <select id="correct_answer">

            <option value="A">
                A
            </option>

            <option value="B">
                B
            </option>

            <option value="C">
                C
            </option>

            <option value="D">
                D
            </option>

        </select>



        <!-- EXPLANATION -->

        <label>
            Explanation
        </label>

        <textarea
            id="explanation"
            placeholder="Enter explanation for the answer">
        </textarea>



        <!-- ADD BUTTON -->

        <button
            id="addQuestionButton"
            onclick="addQuestion()">

            ➕ Add Question

        </button>


        <div id="message"></div>

    </div>



    <!-- ==================================================
         QUESTION MANAGEMENT
    ================================================== -->

    <div class="card">

        <div class="management-header">

            <h2>
                📚 Manage Questions
            </h2>

            <button
                class="refresh-button"
                onclick="loadQuestions()">

                🔄 Refresh

            </button>

        </div>



        <!-- FILTERS -->

        <div class="filters">


            <div>

                <label>
                    Filter by Course
                </label>

                <select
                    id="filterCourse"
                    onchange="updateFilterTopics(); loadQuestions();">

                    <option value="">
                        All Courses
                    </option>

                    <option value="Microbiology">
                        Microbiology
                    </option>

                    <option value="Anatomy & Physiology">
                        Anatomy & Physiology
                    </option>

                    <option value="Pharmacology">
                        Pharmacology
                    </option>

                    <option value="Medical-Surgical Nursing">
                        Medical-Surgical Nursing
                    </option>

                    <option value="Nutrition">
                        Nutrition
                    </option>

                    <option value="Psychology">
                        Psychology
                    </option>

                    <option value="Nursing Practice">
                        Nursing Practice
                    </option>

                    <option value="Chemistry">
                        Chemistry
                    </option>

                </select>

            </div>



            <div>

                <label>
                    Filter by Topic
                </label>

                <select
                    id="filterTopic"
                    onchange="loadQuestions()">

                    <option value="">
                        All Topics
                    </option>

                </select>

            </div>



            <div>

                <label>
                    Search
                </label>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search questions..."
                    oninput="filterQuestions()">

            </div>


        </div>



        <div
            class="question-count"
            id="questionCount">

            Loading questions...

        </div>



        <div
            class="questions-list"
            id="questionsList">

            <div class="loading-text">

                Loading questions...

            </div>

        </div>

    </div>


</div>



<!-- ==================================================
     SUPABASE
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ======================================================
// SUPABASE CONNECTION
// ======================================================

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// ======================================================
// COURSE TOPICS
// ======================================================

const courseTopics = {


    // ==================================================
    // MICROBIOLOGY
    // ==================================================

    "Microbiology": [

        "Introduction to Microbiology",

        "Bacteria",

        "Viruses",

        "Fungi",

        "Parasites",

        "Immunology",

        "Sterilization & Disinfection",

        "Healthcare-Associated Infections"

    ],



    // ==================================================
    // ANATOMY & PHYSIOLOGY
    // ==================================================

    "Anatomy & Physiology": [

        "Anatomy and organisation of the body",

        "Physiological chemistry and processes",

        "Cells and tissues",

        "The blood",

        "The cardiovascular system",

        "The lymphatic system",

        "The nervous system",

        "The special senses",

        "The endocrine system",

        "The respiratory system",

        "Introduction to nutrition",

        "The digestive system",

        "The urinary system",

        "The skin",

        "Defence and immunity",

        "The musculoskeletal system",

        "Genetics and inheritance",

        "The reproductive systems"

    ],



    // ==================================================
    // OTHER COURSES
    // ==================================================

    "Pharmacology": [

        "General Pharmacology"

    ],


    "Medical-Surgical Nursing": [

        "General Medical-Surgical Nursing"

    ],


    "Nutrition": [

        "Introduction to Nutrition"

    ],


    "Psychology": [

        "Introduction to Psychology"

    ],


    "Nursing Practice": [

        "Introduction to Nursing Practice"

    ],


    "Chemistry": [

        "Introduction to Chemistry"

    ]

};



// ======================================================
// LOAD ADD-QUESTION TOPICS
// ======================================================

function loadTopics() {


    const course =
        document.getElementById("course").value;


    const topicSelect =
        document.getElementById("topic");


    topicSelect.innerHTML = "";


    const topics =
        courseTopics[course] || [];


    if (topics.length === 0) {

        const option =
            document.createElement("option");

        option.value = "";

        option.textContent =
            "No topics available";

        topicSelect.appendChild(option);

        return;

    }


    topics.forEach(function(topic) {

        const option =
            document.createElement("option");

        option.value =
            topic;

        option.textContent =
            topic;

        topicSelect.appendChild(option);

    });

}



// ======================================================
// UPDATE FILTER TOPICS
// ======================================================

function updateFilterTopics() {


    const course =
        document.getElementById("filterCourse").value;


    const topicSelect =
        document.getElementById("filterTopic");


    topicSelect.innerHTML = "";


    const allOption =
        document.createElement("option");

    allOption.value = "";

    allOption.textContent =
        "All Topics";

    topicSelect.appendChild(allOption);


    if (!course) {

        return;

    }


    const topics =
        courseTopics[course] || [];


    topics.forEach(function(topic) {

        const option =
            document.createElement("option");

        option.value =
            topic;

        option.textContent =
            topic;

        topicSelect.appendChild(option);

    });

}



// ======================================================
// COURSE CHANGE
// ======================================================

document
    .getElementById("course")
    .addEventListener(
        "change",
        loadTopics
    );



// ======================================================
// CHECK ADMIN ACCESS
// ======================================================

async function checkAdminAccess() {


    const {
        data: { user },
        error: userError
    } =
        await supabaseClient
            .auth
            .getUser();


    if (userError || !user) {

        window.location.href =
            "index.html";

        return false;

    }


    const {
        data: admin,
        error: adminError
    } =
        await supabaseClient
            .from("admins")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();


    if (adminError) {

        console.error(
            "Admin check error:",
            adminError.message
        );

        document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:60px 20px;
                font-family:Arial;
            ">

                <h2>
                    ⚠️ Unable to verify admin access
                </h2>

                <p>
                    ${escapeHTML(adminError.message)}
                </p>

            </div>

        `;

        return false;

    }


    if (!admin) {

        document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:60px 20px;
                font-family:Arial;
            ">

                <h2>
                    🚫 Access Denied
                </h2>

                <p>
                    You do not have permission
                    to access the Admin Dashboard.
                </p>

                <br>

                <a href="dashboard.html">
                    ← Return to Dashboard
                </a>

            </div>

        `;

        return false;

    }


    console.log(
        "✅ Admin access granted."
    );


    return true;

}



// ======================================================
// ADD QUESTION
// ======================================================

async function addQuestion() {


    const message =
        document.getElementById("message");


    const button =
        document.getElementById(
            "addQuestionButton"
        );


    const {
        data: { user },
        error: userError
    } =
        await supabaseClient
            .auth
            .getUser();


    if (userError || !user) {

        message.textContent =
            "❌ You must be logged in before adding questions.";

        message.style.color =
            "#dc3545";

        return;

    }


    const course =
        document
            .getElementById("course")
            .value;


    const topic =
        document
            .getElementById("topic")
            .value;


    const question =
        document
            .getElementById("question")
            .value
            .trim();


    const option_a =
        document
            .getElementById("option_a")
            .value
            .trim();


    const option_b =
        document
            .getElementById("option_b")
            .value
            .trim();


    const option_c =
        document
            .getElementById("option_c")
            .value
            .trim();


    const option_d =
        document
            .getElementById("option_d")
            .value
            .trim();


    const correct_answer =
        document
            .getElementById("correct_answer")
            .value;


    const explanation =
        document
            .getElementById("explanation")
            .value
            .trim();



    if (
        !question ||
        !option_a ||
        !option_b ||
        !option_c ||
        !option_d
    ) {

        message.textContent =
            "⚠️ Please fill in all the question fields.";

        message.style.color =
            "#dc3545";

        return;

    }



    button.disabled = true;

    button.textContent =
        "Saving question...";



    const {
        error
    } =
        await supabaseClient
            .from("questions")
            .insert([

                {

                    course: course,

                    topic: topic,

                    question: question,

                    option_a: option_a,

                    option_b: option_b,

                    option_c: option_c,

                    option_d: option_d,

                    correct_answer:
                        correct_answer,

                    explanation:
                        explanation

                }

            ]);



    if (error) {

        console.error(
            "Question insert error:",
            error
        );


        message.textContent =
            "❌ Error: " +
            error.message;


        message.style.color =
            "#dc3545";


        button.disabled = false;


        button.textContent =
            "➕ Add Question";


        return;

    }



    message.textContent =
        "✅ Question added successfully!";


    message.style.color =
        "#198754";



    document
        .getElementById("question")
        .value = "";


    document
        .getElementById("option_a")
        .value = "";


    document
        .getElementById("option_b")
        .value = "";


    document
        .getElementById("option_c")
        .value = "";


    document
        .getElementById("option_d")
        .value = "";


    document
        .getElementById("explanation")
        .value = "";



    button.disabled = false;


    button.textContent =
        "➕ Add Question";



    loadQuestions();

}



// ======================================================
// LOAD QUESTIONS
// ======================================================

let allQuestions = [];


async function loadQuestions() {


    const list =
        document.getElementById(
            "questionsList"
        );


    const count =
        document.getElementById(
            "questionCount"
        );


    list.innerHTML = `

        <div class="loading-text">
            Loading questions...
        </div>

    `;


    const filterCourse =
        document.getElementById(
            "filterCourse"
        ).value;


    const filterTopic =
        document.getElementById(
            "filterTopic"
        ).value;



    let query =
        supabaseClient
            .from("questions")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (filterCourse) {

        query =
            query.eq(
                "course",
                filterCourse
            );

    }


    if (filterTopic) {

        query =
            query.eq(
                "topic",
                filterTopic
            );

    }



    const {
        data,
        error
    } =
        await query;



    if (error) {

        console.error(
            "Unable to load questions:",
            error.message
        );


        list.innerHTML = `

            <div class="empty-text">

                ❌ Unable to load questions.

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;


        count.textContent =
            "Unable to load questions.";

        return;

    }



    allQuestions =
        data || [];


    displayQuestions(
        allQuestions
    );

}



// ======================================================
// FILTER / SEARCH QUESTIONS
// ======================================================

function filterQuestions() {


    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    if (!search) {

        displayQuestions(
            allQuestions
        );

        return;

    }


    const filtered =
        allQuestions.filter(
            function(q) {

                return (

                    String(
                        q.question || ""
                    )
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(
                        q.course || ""
                    )
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(
                        q.topic || ""
                    )
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(
                        q.option_a || ""
                    )
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(
                        q.option_b || ""
                    )
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(
                        q.option_c || ""
                    )
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(
                        q.option_d || ""
                    )
                        .toLowerCase()
                        .includes(search)

                );

            }
        );


    displayQuestions(
        filtered
    );

}



// ======================================================
// DISPLAY QUESTIONS
// ======================================================

function displayQuestions(
    questions
) {


    const list =
        document.getElementById(
            "questionsList"
        );


    const count =
        document.getElementById(
            "questionCount"
        );


    count.textContent =
        questions.length +
        " question" +
        (
            questions.length === 1
                ? ""
                : "s"
        ) +
        " found";



    if (questions.length === 0) {

        list.innerHTML = `

            <div class="empty-text">

                📭 No questions found.

            </div>

        `;

        return;

    }



    list.innerHTML = "";


    questions.forEach(
        function(q, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "question-item";


            item.id =
                "question-" +
                q.id;



            item.innerHTML = `

                <div class="question-top">

                    <div>

                        <div class="question-number">

                            Question ${index + 1}

                        </div>

                        <div class="question-meta">

                            <span class="badge">

                                ${escapeHTML(q.course)}

                            </span>

                            <span class="badge">

                                ${escapeHTML(q.topic)}

                            </span>

                        </div>

                    </div>

                </div>


                <div class="question-text">

                    ${escapeHTML(q.question)}

                </div>


                <div class="options-list">

                    <div class="${
                        q.correct_answer === "A"
                            ? "correct-option"
                            : ""
                    }">

                        A. ${escapeHTML(q.option_a)}

                        ${
                            q.correct_answer === "A"
                                ? " ✅"
                                : ""
                        }

                    </div>


                    <div class="${
                        q.correct_answer === "B"
                            ? "correct-option"
                            : ""
                    }">

                        B. ${escapeHTML(q.option_b)}

                        ${
                            q.correct_answer === "B"
                                ? " ✅"
                                : ""
                        }

                    </div>


                    <div class="${
                        q.correct_answer === "C"
                            ? "correct-option"
                            : ""
                    }">

                        C. ${escapeHTML(q.option_c)}

                        ${
                            q.correct_answer === "C"
                                ? " ✅"
                                : ""
                        }

                    </div>


                    <div class="${
                        q.correct_answer === "D"
                            ? "correct-option"
                            : ""
                    }">

                        D. ${escapeHTML(q.option_d)}

                        ${
                            q.correct_answer === "D"
                                ? " ✅"
                                : ""
                        }

                    </div>

                </div>


                <div class="explanation-box">

                    <strong>
                        Explanation:
                    </strong>

                    ${escapeHTML(
                        q.explanation ||
                        "No explanation provided."
                    )}

                </div>


                <div class="question-actions">

                    <button
                        class="edit-button"
                        onclick="editQuestion('${q.id}')">

                        ✏️ Edit

                    </button>


                    <button
                        class="delete-button"
                        onclick="deleteQuestion('${q.id}')">

                        🗑️ Delete

                    </button>

                </div>

            `;


            list.appendChild(item);

        }
    );

}



// ======================================================
// EDIT QUESTION
// ======================================================

function editQuestion(id) {


    const q =
        allQuestions.find(
            function(question) {

                return String(
                    question.id
                ) === String(id);

            }
        );


    if (!q) {

        alert(
            "Question not found."
        );

        return;

    }


    const item =
        document.getElementById(
            "question-" + id
        );


    if (!item) {

        return;

    }



    item.innerHTML = `

        <div class="edit-form">

            <h3>
                ✏️ Edit Question
            </h3>


            <label>
                Course
            </label>

            <select id="edit_course_${id}">

                ${createCourseOptions(
                    q.course
                )}

            </select>


            <label>
                Topic
            </label>

            <select id="edit_topic_${id}">

            </select>


            <label>
                Question
            </label>

            <textarea
                id="edit_question_${id}">${escapeHTML(
                    q.question
                )}</textarea>


            <label>
                Option A
            </label>

            <input
                id="edit_option_a_${id}"
                value="${escapeAttribute(
                    q.option_a
                )}">


            <label>
                Option B
            </label>

            <input
                id="edit_option_b_${id}"
                value="${escapeAttribute(
                    q.option_b
                )}">


            <label>
                Option C
            </label>

            <input
                id="edit_option_c_${id}"
                value="${escapeAttribute(
                    q.option_c
                )}">


            <label>
                Option D
            </label>

            <input
                id="edit_option_d_${id}"
                value="${escapeAttribute(
                    q.option_d
                )}">


            <label>
                Correct Answer
            </label>

            <select id="edit_correct_${id}">

                <option value="A"
                    ${q.correct_answer === "A" ? "selected" : ""}>
                    A
                </option>

                <option value="B"
                    ${q.correct_answer === "B" ? "selected" : ""}>
                    B
                </option>

                <option value="C"
                    ${q.correct_answer === "C" ? "selected" : ""}>
                    C
                </option>

                <option value="D"
                    ${q.correct_answer === "D" ? "selected" : ""}>
                    D
                </option>

            </select>


            <label>
                Explanation
            </label>

            <textarea
                id="edit_explanation_${id}">${escapeHTML(
                    q.explanation || ""
                )}</textarea>


            <div class="question-actions">

                <button
                    class="save-edit-button"
                    onclick="saveEditedQuestion('${id}')">

                    💾 Save Changes

                </button>


                <button
                    class="cancel-button"
                    onclick="loadQuestions()">

                    Cancel

                </button>

            </div>

        </div>

    `;



    const editCourse =
        document.getElementById(
            "edit_course_" + id
        );


    editCourse.addEventListener(
        "change",
        function() {

            loadEditTopics(
                id,
                editCourse.value
            );

        }
    );


    loadEditTopics(
        id,
        q.course,
        q.topic
    );

}



// ======================================================
// CREATE COURSE OPTIONS
// ======================================================

function createCourseOptions(
    selectedCourse
) {


    const courses =
        Object.keys(
            courseTopics
        );


    return courses.map(
        function(course) {

            return `

                <option
                    value="${escapeAttribute(course)}"
                    ${
                        course === selectedCourse
                            ? "selected"
                            : ""
                    }>

                    ${escapeHTML(course)}

                </option>

            `;

        }
    ).join("");

}



// ======================================================
// LOAD EDIT TOPICS
// ======================================================

function loadEditTopics(
    id,
    course,
    selectedTopic = ""
) {


    const topicSelect =
        document.getElementById(
            "edit_topic_" + id
        );


    if (!topicSelect) {

        return;

    }


    topicSelect.innerHTML = "";


    const topics =
        courseTopics[course] || [];


    topics.forEach(
        function(topic) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                topic;


            option.textContent =
                topic;


            if (
                topic === selectedTopic
            ) {

                option.selected =
                    true;

            }


            topicSelect.appendChild(
                option
            );

        }
    );

}



// ======================================================
// SAVE EDITED QUESTION
// ======================================================

async function saveEditedQuestion(
    id
) {


    const course =
        document.getElementById(
            "edit_course_" + id
        ).value;


    const topic =
        document.getElementById(
            "edit_topic_" + id
        ).value;


    const question =
        document.getElementById(
            "edit_question_" + id
        ).value.trim();


    const option_a =
        document.getElementById(
            "edit_option_a_" + id
        ).value.trim();


    const option_b =
        document.getElementById(
            "edit_option_b_" + id
        ).value.trim();


    const option_c =
        document.getElementById(
            "edit_option_c_" + id
        ).value.trim();


    const option_d =
        document.getElementById(
            "edit_option_d_" + id
        ).value.trim();


    const correct_answer =
        document.getElementById(
            "edit_correct_" + id
        ).value;


    const explanation =
        document.getElementById(
            "edit_explanation_" + id
        ).value.trim();



    if (
        !question ||
        !option_a ||
        !option_b ||
        !option_c ||
        !option_d
    ) {

        alert(
            "Please fill in all question fields."
        );

        return;

    }



    const {
        error
    } =
        await supabaseClient
            .from("questions")
            .update({

                course: course,

                topic: topic,

                question: question,

                option_a: option_a,

                option_b: option_b,

                option_c: option_c,

                option_d: option_d,

                correct_answer:
                    correct_answer,

                explanation:
                    explanation

            })
            .eq(
                "id",
                id
            );



    if (error) {

        console.error(
            "Update error:",
            error
        );


        alert(
            "❌ Unable to update question:\n" +
            error.message
        );


        return;

    }



    alert(
        "✅ Question updated successfully!"
    );


    loadQuestions();

}



// ======================================================
// DELETE QUESTION
// ======================================================

async function deleteQuestion(
    id
) {


    const q =
        allQuestions.find(
            function(question) {

                return String(
                    question.id
                ) === String(id);

            }
        );


    if (!q) {

        return;

    }


    const confirmed =
        confirm(

            "Are you sure you want to delete this question?\n\n" +

            q.question

        );


    if (!confirmed) {

        return;

    }



    const {
        error
    } =
        await supabaseClient
            .from("questions")
            .delete()
            .eq(
                "id",
                id
            );



    if (error) {

        console.error(
            "Delete error:",
            error
        );


        alert(
            "❌ Unable to delete question:\n" +
            error.message
        );


        return;

    }



    alert(
        "✅ Question deleted successfully!"
    );


    loadQuestions();

}



// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



// ======================================================
// ESCAPE ATTRIBUTE
// ======================================================

function escapeAttribute(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}
