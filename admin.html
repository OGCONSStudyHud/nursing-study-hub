<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        OGCONS Study Hub - Admin Dashboard
    </title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #e8fff2,
                    #e8f4ff,
                    #f5eaff
                );

            color: #172033;
        }

        header {

            background:
                linear-gradient(
                    135deg,
                    #18a058,
                    #2eb7a0
                );

            color: white;

            padding: 25px 20px;
        }

        .header-content {

            max-width: 1100px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .logo {

            font-size: 23px;

            font-weight: bold;
        }

        .logout {

            border: none;

            background: white;

            color: #18a058;

            padding: 10px 18px;

            border-radius: 20px;

            font-weight: bold;

            cursor: pointer;
        }

        .container {

            max-width: 1100px;

            margin: auto;

            padding: 30px 20px;
        }

        .page-title {

            text-align: center;

            margin-bottom: 25px;
        }

        .page-title h1 {

            color: #18a058;

            margin-bottom: 8px;
        }

        .page-title p {

            color: #667085;
        }

        .card {

            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }

        .card h2 {

            color: #18a058;

            margin-bottom: 20px;
        }

        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        select,
        textarea,
        input {

            width: 100%;

            padding: 13px;

            border: 2px solid #dce4df;

            border-radius: 10px;

            font-size: 15px;

            margin-bottom: 18px;

            outline: none;
        }

        select:focus,
        textarea:focus,
        input:focus {

            border-color: #18a058;
        }

        textarea {

            min-height: 120px;

            resize: vertical;
        }

        .options-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .option-box {

            background: #f8fbf9;

            padding: 15px;

            border-radius: 12px;

            border: 1px solid #e0e8e3;
        }

        .option-box input {

            margin-bottom: 0;
        }

        .correct-box {

            background: #eefaf3;

            padding: 18px;

            border-radius: 12px;

            margin-top: 5px;

            margin-bottom: 20px;
        }

        .save-button {

            width: 100%;

            border: none;

            background: #18a058;

            color: white;

            padding: 15px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .save-button:hover {

            background: #117d45;
        }

        .message {

            display: none;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-weight: bold;
        }

        .success {

            background: #d1e7dd;

            color: #0f5132;
        }

        .error {

            background: #f8d7da;

            color: #842029;
        }

        .topic-info {

            background: #eef8ff;

            border-left: 4px solid #0b5ed7;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            line-height: 1.5;
        }

        .questions-card {

            display: none;
        }

        .question-item {

            border: 1px solid #dce4df;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 15px;

            background: #fafcfb;
        }

        .question-item h3 {

            color: #18a058;

            margin-bottom: 8px;

            font-size: 16px;
        }

        .question-item p {

            line-height: 1.5;

            margin-bottom: 8px;
        }

        .badge {

            display: inline-block;

            background: #e7fff0;

            color: #117d45;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        footer {

            text-align: center;

            padding: 30px;

            color: #718077;

            font-size: 14px;
        }

        @media (max-width: 700px) {

            .header-content {

                flex-direction: column;

                text-align: center;
            }

            .options-grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="logo">

            🩺 OGCONS Study Hub — Admin

        </div>

        <button
            class="logout"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>



<div class="container">


    <div class="page-title">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Add and manage quiz questions for students.
        </p>

    </div>



    <div
        id="message"
        class="message">
    </div>



    <!-- ==========================================
         ADD QUESTION
    =========================================== -->

    <div class="card">

        <h2>
            ➕ Add New Question
        </h2>


        <!-- COURSE -->

        <label for="course">

            Select Course

        </label>


        <select
            id="course"
            onchange="courseChanged()">

            <option value="">

                -- Select Course --

            </option>

            <option value="Foundations of Nursing">

                Foundations of Nursing

            </option>

            <option value="Pharmacology">

                Pharmacology

            </option>

            <option value="Primary Health Care">

                Primary Health Care (PHC)

            </option>

        </select>



        <!-- TOPIC -->

        <label for="topic">

            Select Topic

        </label>


        <select
            id="topic"
            disabled>

            <option value="">

                -- Select Course First --

            </option>

        </select>



        <div
            id="topicInfo"
            class="topic-info"
            style="display:none;">

        </div>



        <!-- QUESTION -->

        <label for="question">

            Question

        </label>


        <textarea
            id="question"
            placeholder="Enter the question here...">
        </textarea>



        <!-- OPTIONS -->

        <div class="options-grid">


            <div class="option-box">

                <label for="optionA">

                    Option A

                </label>

                <input
                    type="text"
                    id="optionA"
                    placeholder="Enter option A">

            </div>



            <div class="option-box">

                <label for="optionB">

                    Option B

                </label>

                <input
                    type="text"
                    id="optionB"
                    placeholder="Enter option B">

            </div>



            <div class="option-box">

                <label for="optionC">

                    Option C

                </label>

                <input
                    type="text"
                    id="optionC"
                    placeholder="Enter option C">

            </div>



            <div class="option-box">

                <label for="optionD">

                    Option D

                </label>

                <input
                    type="text"
                    id="optionD"
                    placeholder="Enter option D">

            </div>


        </div>



        <!-- CORRECT ANSWER -->

        <div class="correct-box">

            <label for="correctAnswer">

                Correct Answer

            </label>


            <select
                id="correctAnswer">

                <option value="">

                    -- Select Correct Answer --

                </option>

                <option value="A">
                    A
                </option>

                <option value="B">
                    B
                </option>

                <option value="C">
                    C
                </option>

                <option value="D">
                    D
                </option>

            </select>

        </div>



        <!-- EXPLANATION -->

        <label for="explanation">

            Explanation

        </label>


        <textarea
            id="explanation"
            placeholder="Explain why the correct answer is correct...">
        </textarea>



        <button
            class="save-button"
            onclick="addQuestion()">

            💾 Save Question

        </button>


    </div>



    <!-- ==========================================
         QUESTIONS
    =========================================== -->

    <div
        class="card questions-card"
        id="questionsCard">

        <h2>
            📚 Questions in Selected Topic
        </h2>

        <div id="questionList">

        </div>

    </div>


</div>



<footer>

    OGCONS Study Hub © 2026

</footer>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );



// =====================================================
// PHC TOPICS
// =====================================================

const phcTopics = [

    "Introduction to Primary Health Care",

    "The Community",

    "Cadre of health workers in PHC",

    "Community Mobilization",

    "Community Diagnosis",

    "Health Education",

    "Components of Primary Health Care",

    "Immunization against major communicable diseases",

    "Prevention and control of locally endemic and epidemic diseases",

    "Promotion of mental health",

    "Maternal and Child Health Services",

    "Provision of essential drugs and supplies",

    "Oral Hygiene and Eye Care",

    "Adolescence and their problems",

    "Referral system in PHC",

    "Care of the Aged in the Community",

    "Management of Occupational Health",

    "Management in Primary Health Care"

];



// =====================================================
// OTHER COURSE TOPICS
// =====================================================

// Keep these here so you can add or change them later.

const foundationsTopics = [

    "Introduction to Nursing",

    "Nursing as a Profession",

    "History of Nursing",

    "Basic Nursing Concepts",

    "Nursing Process",

    "Admission and Discharge",

    "Vital Signs",

    "Bed Making",

    "Personal Hygiene",

    "Patient Comfort",

    "Safety in Nursing",

    "Infection Prevention and Control",

    "Communication in Nursing",

    "Health Assessment",

    "Documentation and Reporting"

];


const pharmacologyTopics = [

    "Introduction to Pharmacology",

    "Drug Names",

    "Drug Sources",

    "Drug Forms",

    "Routes of Drug Administration",

    "Drug Absorption",

    "Drug Distribution",

    "Drug Metabolism",

    "Drug Excretion",

    "Factors Affecting Drug Action",

    "Adverse Drug Reactions",

    "Drug Interactions",

    "Medication Safety"

];



// =====================================================
// CHECK ADMIN LOGIN
// =====================================================

async function checkAdmin() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient
            .auth
            .getUser();


    if (error || !user) {

        window.location.href =
            "login.html";

        return false;

    }


    return true;

}



// =====================================================
// COURSE CHANGED
// =====================================================

function courseChanged() {


    const course =
        document.getElementById(
            "course"
        ).value;


    const topicSelect =
        document.getElementById(
            "topic"
        );


    const topicInfo =
        document.getElementById(
            "topicInfo"
        );


    topicSelect.innerHTML = `

        <option value="">

            -- Select Topic --

        </option>

    `;


    topicSelect.disabled =
        true;


    topicInfo.style.display =
        "none";



    let topics = [];



    // =================================================
    // FOUNDATIONS OF NURSING
    // =================================================

    if (
        course ===
        "Foundations of Nursing"
    ) {

        topics =
            foundationsTopics;

    }



    // =================================================
    // PHARMACOLOGY
    // =================================================

    else if (
        course ===
        "Pharmacology"
    ) {

        topics =
            pharmacologyTopics;

    }



    // =================================================
    // PRIMARY HEALTH CARE
    // =================================================

    else if (
        course ===
        "Primary Health Care"
    ) {

        topics =
            phcTopics;

    }



    // =================================================
    // CREATE TOPIC OPTIONS
    // =================================================

    topics.forEach(
        function(topic) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                topic;


            option.textContent =
                topic;


            topicSelect.appendChild(
                option
            );

        }
    );


    if (topics.length > 0) {

        topicSelect.disabled =
            false;

    }



    topicSelect.onchange =
        function() {

            showTopicInfo();

            loadTopicQuestions();

        };

}



// =====================================================
// SHOW TOPIC INFO
// =====================================================

function showTopicInfo() {


    const course =
        document.getElementById(
            "course"
        ).value;


    const topic =
        document.getElementById(
            "topic"
        ).value;


    const topicInfo =
        document.getElementById(
            "topicInfo"
        );


    if (!topic) {

        topicInfo.style.display =
            "none";

        return;

    }


    topicInfo.innerHTML = `

        <strong>
            Course:
        </strong>

        ${escapeHTML(course)}

        <br>

        <strong>
            Topic:
        </strong>

        ${escapeHTML(topic)}

        <br><br>

        Questions added here will appear
        in the student quiz for this topic.

    `;


    topicInfo.style.display =
        "block";

}



// =====================================================
// ADD QUESTION
// =====================================================

async function addQuestion() {


    const course =
        document.getElementById(
            "course"
        ).value.trim();


    const topic =
        document.getElementById(
            "topic"
        ).value.trim();


    const question =
        document.getElementById(
            "question"
        ).value.trim();


    const optionA =
        document.getElementById(
            "optionA"
        ).value.trim();


    const optionB =
        document.getElementById(
            "optionB"
        ).value.trim();


    const optionC =
        document.getElementById(
            "optionC"
        ).value.trim();


    const optionD =
        document.getElementById(
            "optionD"
        ).value.trim();


    const correctAnswer =
        document.getElementById(
            "correctAnswer"
        ).value;


    const explanation =
        document.getElementById(
            "explanation"
        ).value.trim();



    // =================================================
    // VALIDATION
    // =================================================

    if (!course) {

        showMessage(
            "Please select a course.",
            "error"
        );

        return;

    }


    if (!topic) {

        showMessage(
            "Please select a topic.",
            "error"
        );

        return;

    }


    if (!question) {

        showMessage(
            "Please enter the question.",
            "error"
        );

        return;

    }


    if (
        !optionA ||
        !optionB ||
        !optionC ||
        !optionD
    ) {

        showMessage(
            "Please enter all four options.",
            "error"
        );

        return;

    }


    if (!correctAnswer) {

        showMessage(
            "Please select the correct answer.",
            "error"
        );

        return;

    }



    // =================================================
    // SAVE TO SUPABASE
    // =================================================

    const {
        data,
        error
    } =
        await supabaseClient

            .from("questions")

            .insert({

                course:
                    course,

                topic:
                    topic,

                question:
                    question,

                option_a:
                    optionA,

                option_b:
                    optionB,

                option_c:
                    optionC,

                option_d:
                    optionD,

                correct_answer:
                    correctAnswer,

                explanation:
                    explanation

            })

            .select();



    // =================================================
    // ERROR
    // =================================================

    if (error) {

        console.error(
            "Add question error:",
            error
        );


        showMessage(

            "❌ Unable to save question.<br><br>" +

            escapeHTML(
                error.message
            ),

            "error"

        );

        return;

    }



    // =================================================
    // SUCCESS
    // =================================================

    showMessage(

        "✅ Question added successfully! " +
        "It will now appear in the student quiz.",

        "success"

    );



    // =================================================
    // CLEAR FORM
    // =================================================

    document
        .getElementById("question")
        .value = "";


    document
        .getElementById("optionA")
        .value = "";


    document
        .getElementById("optionB")
        .value = "";


    document
        .getElementById("optionC")
        .value = "";


    document
        .getElementById("optionD")
        .value = "";


    document
        .getElementById("correctAnswer")
        .value = "";


    document
        .getElementById("explanation")
        .value = "";



    // =================================================
    // REFRESH QUESTIONS
    // =================================================

    loadTopicQuestions();

}



// =====================================================
// LOAD QUESTIONS FOR SELECTED TOPIC
// =====================================================

async function loadTopicQuestions() {


    const course =
        document.getElementById(
            "course"
        ).value;


    const topic =
        document.getElementById(
            "topic"
        ).value;


    const questionsCard =
        document.getElementById(
            "questionsCard"
        );


    const questionList =
        document.getElementById(
            "questionList"
        );


    if (!course || !topic) {

        questionsCard.style.display =
            "none";

        return;

    }



    const {
        data,
        error
    } =
        await supabaseClient

            .from("questions")

            .select("*")

            .eq(
                "course",
                course
            )

            .ilike(
                "topic",
                topic
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );



    if (error) {

        console.error(
            error
        );

        return;

    }


    questionsCard.style.display =
        "block";


    questionList.innerHTML =
        "";



    if (
        !data ||
        data.length === 0
    ) {

        questionList.innerHTML = `

            <p style="color:#667085;">

                No questions have been added
                to this topic yet.

            </p>

        `;

        return;

    }



    data.forEach(
        function(q, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "question-item";


            item.innerHTML = `

                <span class="badge">

                    Question ${index + 1}

                </span>

                <h3>

                    ${escapeHTML(
                        q.question
                    )}

                </h3>

                <p>

                    <strong>A:</strong>
                    ${escapeHTML(
                        q.option_a
                    )}

                </p>

                <p>

                    <strong>B:</strong>
                    ${escapeHTML(
                        q.option_b
                    )}

                </p>

                <p>

                    <strong>C:</strong>
                    ${escapeHTML(
                        q.option_c
                    )}

                </p>

                <p>

                    <strong>D:</strong>
                    ${escapeHTML(
                        q.option_d
                    )}

                </p>

                <p>

                    <strong>
                        Correct Answer:
                    </strong>

                    ${escapeHTML(
                        q.correct_answer
                    )}

                </p>

                <p>

                    <strong>
                        Explanation:
                    </strong>

                    ${escapeHTML(
                        q.explanation ||
                        "No explanation provided."
                    )}

                </p>

            `;


            questionList.appendChild(
                item
            );

        }
    );

}



// =====================================================
// SHOW MESSAGE
// =====================================================

function showMessage(
    text,
    type
) {


    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        text;


    message.className =
        "message " +
        type;


    message.style.display =
        "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });


    setTimeout(
        function() {

            message.style.display =
                "none";

        },

        5000

    );

}



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// =====================================================
// LOGOUT
// =====================================================

async function logout() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "login.html";

}



// =====================================================
// START
// =====================================================

checkAdmin();

</script>


</body>

</html>
