<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #0b5ed7;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .logout {
            background: #dc3545;
            float: right;
            margin-top: -45px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .topic-help {
            margin-top: 6px;
            color: #6c757d;
            font-size: 13px;
        }

        /* ==============================
           FILTER AREA
        ============================== */

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 12px;
            margin-top: 20px;
        }

        .filters button {
            margin-top: 0;
        }

        /* ==============================
           QUESTION LIST
        ============================== */

        .question-list {
            margin-top: 25px;
        }

        .question-item {
            border: 1px solid #dce2ea;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            background: #fafcff;
        }

        .question-item h3 {
            margin-top: 0;
            line-height: 1.5;
        }

        .question-meta {
            font-size: 13px;
            color: #667085;
            margin-bottom: 12px;
        }

        .question-options {
            margin: 15px 0;
            line-height: 1.8;
        }

        .correct-answer {
            background: #d1e7dd;
            color: #0f5132;
            padding: 8px 12px;
            border-radius: 7px;
            display: inline-block;
            font-weight: bold;
        }

        .explanation {
            background: #eef6ff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .actions button {
            margin-top: 10px;
        }

        .edit-button {
            background: #198754;
        }

        .delete-button {
            background: #dc3545;
        }

        .refresh-button {
            background: #6c757d;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #667085;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        /* ==============================
           EDIT MODAL
        ============================== */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            overflow-y: auto;
            padding: 30px 15px;
        }

        .modal-content {
            background: white;
            max-width: 800px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close {
            background: #dc3545;
            margin: 0;
            padding: 8px 13px;
        }

        .save-edit {
            background: #198754;
        }

        @media (max-width: 750px) {

            .filters {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .logout {
                float: none;
                margin-top: 15px;
            }

        }

    </style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// ==========================================
// STORE QUESTIONS
// ==========================================

let allQuestions = [];



// ==========================================
// CHECK ADMIN
// ==========================================

async function checkAdminAccess() {

    const {
        data: { user },
        error
    } =
        await supabaseClient
            .auth
            .getUser();


    if (error || !user) {

        window.location.href =
            "index.html";

        return false;

    }


    const {
        data: admin,
        error: adminError
    } =
        await supabaseClient
            .from("admins")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();


    if (adminError) {

        document.body.innerHTML = `
            <div style="
                text-align:center;
                padding:60px;
                font-family:Arial;
            ">

                <h2>
                    ⚠️ Unable to verify admin access
                </h2>

                <p>
                    ${adminError.message}
                </p>

            </div>
        `;

        return false;

    }


    if (!admin) {

        document.body.innerHTML = `
            <div style="
                text-align:center;
                padding:60px;
                font-family:Arial;
            ">

                <h2>🚫 Access Denied</h2>

                <p>
                    You do not have permission
                    to access the Admin Dashboard.
                </p>

                <br>

                <a href="dashboard.html">
                    ← Return to Dashboard
                </a>

            </div>
        `;

        return false;

    }


    return true;

}



// ==========================================
// ADD QUESTION
// ==========================================

async function addQuestion() {

    const message =
        document.getElementById("message");

    const button =
        document.getElementById(
            "addQuestionButton"
        );


    const {
        data: { user },
        error: userError
    } =
        await supabaseClient
            .auth
            .getUser();


    if (userError || !user) {

        message.textContent =
            "❌ You must be logged in.";

        message.style.color =
            "#dc3545";

        return;

    }


    const course =
        document.getElementById("course").value;

    const topic =
        document.getElementById("topic").value;

    const question =
        document.getElementById("question")
            .value.trim();

    const option_a =
        document.getElementById("option_a")
            .value.trim();

    const option_b =
        document.getElementById("option_b")
            .value.trim();

    const option_c =
        document.getElementById("option_c")
            .value.trim();

    const option_d =
        document.getElementById("option_d")
            .value.trim();

    const correct_answer =
        document.getElementById(
            "correct_answer"
        ).value;

    const explanation =
        document.getElementById(
            "explanation"
        ).value.trim();


    if (
        !question ||
        !option_a ||
        !option_b ||
        !option_c ||
        !option_d
    ) {

        message.textContent =
            "⚠️ Please fill in all question fields.";

        message.style.color =
            "#dc3545";

        return;

    }


    button.disabled = true;

    button.textContent =
        "Saving question...";


    const { error } =
        await supabaseClient
            .from("questions")
            .insert([{

                course,
                topic,
                question,
                option_a,
                option_b,
                option_c,
                option_d,
                correct_answer,
                explanation

            }]);


    if (error) {

        console.error(error);

        message.textContent =
            "❌ Error: " +
            error.message;

        message.style.color =
            "#dc3545";

        button.disabled = false;

        button.textContent =
            "➕ Add Question";

        return;

    }


    message.textContent =
        "✅ Question added successfully!";

    message.style.color =
        "#198754";


    document.getElementById("question").value = "";

    document.getElementById("option_a").value = "";

    document.getElementById("option_b").value = "";

    document.getElementById("option_c").value = "";

    document.getElementById("option_d").value = "";

    document.getElementById("explanation").value = "";


    button.disabled = false;

    button.textContent =
        "➕ Add Question";


    // Reload question list

    await loadQuestions();

}



// ==========================================
// LOAD QUESTIONS
// ==========================================

async function loadQuestions() {

    const list =
        document.getElementById(
            "questionList"
        );


    list.innerHTML = `
        <div class="loading">
            Loading questions...
        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("questions")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        list.innerHTML = `
            <div class="empty">
                ❌ Unable to load questions.
                <br><br>
                ${error.message}
            </div>
        `;

        return;

    }


    allQuestions =
        data || [];


    displayQuestions();

}



// ==========================================
// DISPLAY QUESTIONS
// ==========================================

function displayQuestions() {

    const list =
        document.getElementById(
            "questionList"
        );


    const course =
        document.getElementById(
            "filterCourse"
        ).value;


    const topic =
        document.getElementById(
            "filterTopic"
        ).value;


    const search =
        document.getElementById(
            "searchInput"
        ).value
            .toLowerCase()
            .trim();


    let filtered =
        allQuestions.filter(
            function(q) {

                const matchesCourse =
                    !course ||
                    q.course === course;

                const matchesTopic =
                    !topic ||
                    q.topic === topic;

                const matchesSearch =
                    !search ||
                    (q.question || "")
                        .toLowerCase()
                        .includes(search);

                return (
                    matchesCourse &&
                    matchesTopic &&
                    matchesSearch
                );

            }
        );


    if (filtered.length === 0) {

        list.innerHTML = `
            <div class="empty">
                📭 No questions found.
            </div>
        `;

        return;

    }


    list.innerHTML =
        filtered.map(
            function(q) {

                return `

                    <div class="question-item">

                        <div class="question-meta">

                            📚 ${escapeHTML(q.course)}

                            &nbsp; • &nbsp;

                            📖 ${escapeHTML(q.topic)}

                        </div>


                        <h3>
                            ${escapeHTML(q.question)}
                        </h3>


                        <div class="question-options">

                            <div>
                                <strong>A.</strong>
                                ${escapeHTML(q.option_a)}
                            </div>

                            <div>
                                <strong>B.</strong>
                                ${escapeHTML(q.option_b)}
                            </div>

                            <div>
                                <strong>C.</strong>
                                ${escapeHTML(q.option_c)}
                            </div>

                            <div>
                                <strong>D.</strong>
                                ${escapeHTML(q.option_d)}
                            </div>

                        </div>


                        <div class="correct-answer">

                            ✅ Correct Answer:
                            ${escapeHTML(q.correct_answer)}

                        </div>


                        <div class="explanation">

                            <strong>
                                Explanation:
                            </strong>

                            ${escapeHTML(
                                q.explanation ||
                                "No explanation provided."
                            )}

                        </div>


                        <div class="actions">

                            <button
                                class="edit-button"
                                onclick="openEdit('${q.id}')">

                                ✏️ Edit

                            </button>


                            <button
                                class="delete-button"
                                onclick="deleteQuestion('${q.id}')">

                                🗑️ Delete

                            </button>

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



// ==========================================
// OPEN EDIT
// ==========================================

function openEdit(id) {

    const q =
        allQuestions.find(
            function(item) {

                return String(item.id) ===
                    String(id);

            }
        );


    if (!q) {

        alert("Question not found.");

        return;

    }


    document.getElementById("editId").value =
        q.id;

    document.getElementById("editCourse").value =
        q.course;

    document.getElementById("editTopic").value =
        q.topic;

    document.getElementById("editQuestion").value =
        q.question;

    document.getElementById("editOptionA").value =
        q.option_a;

    document.getElementById("editOptionB").value =
        q.option_b;

    document.getElementById("editOptionC").value =
        q.option_c;

    document.getElementById("editOptionD").value =
        q.option_d;

    document.getElementById(
        "editCorrectAnswer"
    ).value =
        q.correct_answer;

    document.getElementById(
        "editExplanation"
    ).value =
        q.explanation || "";


    document.getElementById(
        "editModal"
    ).style.display =
        "block";

}



// ==========================================
// CLOSE EDIT
// ==========================================

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).style.display =
        "none";

}



// ==========================================
// SAVE EDIT
// ==========================================

async function saveEdit() {

    const id =
        document.getElementById(
            "editId"
        ).value;


    const course =
        document.getElementById(
            "editCourse"
        ).value;


    const topic =
        document.getElementById(
            "editTopic"
        ).value;


    const question =
        document.getElementById(
            "editQuestion"
        ).value.trim();


    const option_a =
        document.getElementById(
            "editOptionA"
        ).value.trim();


    const option_b =
        document.getElementById(
            "editOptionB"
        ).value.trim();


    const option_c =
        document.getElementById(
            "editOptionC"
        ).value.trim();


    const option_d =
        document.getElementById(
            "editOptionD"
        ).value.trim();


    const correct_answer =
        document.getElementById(
            "editCorrectAnswer"
        ).value;


    const explanation =
        document.getElementById(
            "editExplanation"
        ).value.trim();


    if (
        !question ||
        !option_a ||
        !option_b ||
        !option_c ||
        !option_d
    ) {

        alert(
            "Please fill in all question fields."
        );

        return;

    }


    const { error } =
        await supabaseClient
            .from("questions")
            .update({

                course,
                topic,
                question,
                option_a,
                option_b,
                option_c,
                option_d,
                correct_answer,
                explanation

            })
            .eq("id", id);


    if (error) {

        alert(
            "❌ Unable to update question:\n" +
            error.message
        );

        console.error(error);

        return;

    }


    alert(
        "✅ Question updated successfully!"
    );


    closeEditModal();


    await loadQuestions();

}



// ==========================================
// DELETE QUESTION
// ==========================================

async function deleteQuestion(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this question?"
        );


    if (!confirmed) {

        return;

    }


    const { error } =
        await supabaseClient
            .from("questions")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "❌ Unable to delete question:\n" +
            error.message
        );

        console.error(error);

        return;

    }


    alert(
        "✅ Question deleted successfully!"
    );


    await loadQuestions();

}



// ==========================================
// LOGOUT
// ==========================================

async function logout() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}



// ==========================================
// START ADMIN DASHBOARD
// ==========================================

async function startAdminDashboard() {

    const allowed =
        await checkAdminAccess();


    if (!allowed) {

        return;

    }


    await loadQuestions();

}


startAdminDashboard();



// ==========================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// ==========================================

window.onclick =
    function(event) {

        const modal =
            document.getElementById(
                "editModal"
            );


        if (event.target === modal) {

            closeEditModal();

        }

    };

</script>
