<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Admin</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f7fb;

            color: #172033;
        }


        header {
            background: #0b5ed7;

            color: white;

            padding: 20px;

            position: relative;
        }


        header h1 {
            margin: 0;

            font-size: 24px;
        }


        header p {
            margin: 6px 0 0;
        }


        .container {
            max-width: 900px;

            margin: 30px auto;

            padding: 20px;
        }


        .card {
            background: white;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);
        }


        label {
            display: block;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 6px;
        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccd3df;

            border-radius: 8px;

            font-size: 15px;
        }


        textarea {

            min-height: 100px;

            resize: vertical;
        }


        button {

            margin-top: 20px;

            padding: 13px 22px;

            border: none;

            border-radius: 8px;

            background: #0b5ed7;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            opacity: 0.9;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #message {

            margin-top: 15px;

            font-weight: bold;
        }


        .logout {

            background: #dc3545;

            position: absolute;

            right: 20px;

            top: 20px;

            margin: 0;
        }


        .topic-help {

            margin-top: 6px;

            color: #6c757d;

            font-size: 13px;
        }


        .course-info {

            background: #eef6ff;

            padding: 12px;

            border-radius: 8px;

            margin-top: 15px;

            color: #0b5ed7;

            font-size: 14px;
        }


        @media (max-width: 600px) {

            .container {

                padding: 12px;
            }


            .card {

                padding: 20px;
            }


            .logout {

                position: static;

                float: right;

                margin-top: -45px;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        🏥 OGCONS Study Hub
    </h1>

    <p>
        Admin Dashboard
    </p>


    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>



<div class="container">


    <div class="card">


        <h2>
            ➕ Add New Question
        </h2>


        <!-- =====================================
             COURSE
        ====================================== -->

        <label>
            Course
        </label>


        <select
            id="course"
            onchange="updateTopics()">


            <option value="Microbiology">
                Microbiology
            </option>


            <option value="Anatomy & Physiology">
                Anatomy & Physiology
            </option>


            <option value="Pharmacology">
                Pharmacology
            </option>


            <option value="Medical-Surgical Nursing">
                Medical-Surgical Nursing
            </option>


            <option value="Nutrition">
                Nutrition
            </option>


            <option value="Psychology">
                Psychology
            </option>


            <option value="Nursing Practice">
                Nursing Practice
            </option>


            <option value="Chemistry">
                Chemistry
            </option>


        </select>



        <!-- =====================================
             TOPIC
        ====================================== -->

        <label>
            Topic
        </label>


        <select id="topic">
        </select>


        <div class="topic-help">

            Select the topic where this question belongs.

        </div>



        <div
            id="courseInfo"
            class="course-info">

        </div>



        <!-- =====================================
             QUESTION
        ====================================== -->

        <label>
            Question
        </label>


        <textarea
            id="question"
            placeholder="Enter your question">
        </textarea>



        <!-- =====================================
             OPTION A
        ====================================== -->

        <label>
            Option A
        </label>


        <input
            id="option_a"
            type="text"
            placeholder="Enter option A">



        <!-- =====================================
             OPTION B
        ====================================== -->

        <label>
            Option B
        </label>


        <input
            id="option_b"
            type="text"
            placeholder="Enter option B">



        <!-- =====================================
             OPTION C
        ====================================== -->

        <label>
            Option C
        </label>


        <input
            id="option_c"
            type="text"
            placeholder="Enter option C">



        <!-- =====================================
             OPTION D
        ====================================== -->

        <label>
            Option D
        </label>


        <input
            id="option_d"
            type="text"
            placeholder="Enter option D">



        <!-- =====================================
             CORRECT ANSWER
        ====================================== -->

        <label>
            Correct Answer
        </label>


        <select id="correct_answer">

            <option value="A">
                A
            </option>

            <option value="B">
                B
            </option>

            <option value="C">
                C
            </option>

            <option value="D">
                D
            </option>

        </select>



        <!-- =====================================
             EXPLANATION
        ====================================== -->

        <label>
            Explanation
        </label>


        <textarea
            id="explanation"
            placeholder="Enter explanation for the answer">
        </textarea>



        <!-- =====================================
             ADD QUESTION
        ====================================== -->

        <button
            id="addQuestionButton"
            onclick="addQuestion()">

            ➕ Add Question

        </button>


        <div id="message"></div>


    </div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


// =====================================================
// SUPABASE CONNECTION
// =====================================================

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );



// =====================================================
// COURSE TOPICS
// =====================================================

const courseTopics = {


    // =================================================

    "Microbiology": [

        "Sterilization & Disinfection",

    ],



    // =================================================
    // ANATOMY & PHYSIOLOGY
    // =================================================

    "Anatomy & Physiology": [

        "Introduction to Anatomy & Physiology",

        "Anatomical Terminology",

        "Cells and Tissues",

        "Skeletal System",

        "Muscular System",

        "Nervous System",

        "Endocrine System",

        "Cardiovascular System",

        "Respiratory System",

        "Digestive System",

        "Urinary System",

        "Reproductive System",

        "Integumentary System",

        "Lymphatic System",

        "Special Senses"

    ],



    // =================================================
    // PHARMACOLOGY
    // =================================================

    "Pharmacology": [

        "Drug Administration",

        "Pharmacokinetics",

        "Pharmacodynamics",

        "Antibiotics",

        "Antihypertensive Drugs",

        "Antidiabetic Drugs",

        "Cardiovascular Drugs",

        "Respiratory Drugs",

    ],



    // =================================================
    // MEDICAL-SURGICAL NURSING
    // =================================================

    "Medical-Surgical Nursing": [

        "Pain Management",

        "Fluid and Electrolyte Balance",

        "Respiratory Disorders",

        "Cardiovascular Disorders",

        "Gastrointestinal Disorders",

        "Endocrine Disorders",

        "Musculoskeletal Disorders",

        "Preoperative Nursing Care",

    ],



    // =================================================
    // NUTRITION
    // =================================================

    "Nutrition": [

        "Introduction to Nutrition",

        "Carbohydrates",

        "Fats and Lipids",

        "Vitamins",

        "Minerals",

        "Balanced Diet",

    ],



    // =================================================

    // =================================================

    "Psychology": [

    ],



    // =================================================
    // NURSING PRACTICE
    // =================================================

    "Nursing Practice": [

        "Introduction to Nursing Practice",

        "Vital Signs",

        "Hand Hygiene",

        "Patient Assessment",

        "Medication Administration",

        "Patient Safety",

        "Infection Prevention",

        "Wound Dressing",

        "Catheterization",

        "Documentation",

        "Communication",

        "Health Education"

    ],



    // =================================================
    // CHEMISTRY
    // =================================================

    "Chemistry": [

        "Introduction to Chemistry",

        "Atomic Structure",

    ]

};



// =====================================================
// UPDATE TOPICS WHEN COURSE CHANGES
// =====================================================

function updateTopics() {


    const course =
        document.getElementById("course").value;


    const topicSelect =
        document.getElementById("topic");


    const courseInfo =
        document.getElementById("courseInfo");


    // Remove existing topics

    topicSelect.innerHTML = "";


    // Get topics for selected course

    const topics =
        courseTopics[course] || [];


    // Add topics

    topics.forEach(function(topic) {


        const option =
            document.createElement("option");


        option.value =
            topic;


        option.textContent =
            topic;


        topicSelect.appendChild(option);

    });


    // Course information

    courseInfo.textContent =

        course +
        " selected • " +
        topics.length +
        " topics available";


}



// =====================================================
// CHECK ADMIN ACCESS
// =====================================================

async function checkAdminAccess() {


    const {

        data: { user },

        error: userError

    } =
        await supabaseClient
            .auth
            .getUser();


    // Not logged in

    if (userError || !user) {


        window.location.href =
            "index.html";


        return false;

    }


    // Check admin table

    const {

        data: admin,

        error: adminError

    } =
        await supabaseClient

            .from("admins")

            .select("user_id")

            .eq("user_id", user.id)

            .maybeSingle();


    // Database error

    if (adminError) {


        console.error(
            "Admin check error:",
            adminError.message
        );


        document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:60px 20px;
                font-family:Arial;
            ">

                <h2>
                    ⚠️ Unable to verify admin access
                </h2>

                <p>
                    Please try again later.
                </p>

            </div>

        `;


        return false;

    }


    // Not admin

    if (!admin) {


        document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:60px 20px;
                font-family:Arial;
            ">

                <h2>
                    🚫 Access Denied
                </h2>

                <p>
                    You do not have permission
                    to access the Admin Dashboard.
                </p>

                <br>

                <a href="dashboard.html">

                    ← Return to Dashboard

                </a>

            </div>

        `;


        return false;

    }


    console.log(
        "✅ Admin access granted."
    );


    return true;

}



// =====================================================
// ADD QUESTION
// =====================================================

async function addQuestion() {


    const message =
        document.getElementById("message");


    const button =
        document.getElementById(
            "addQuestionButton"
        );


    // Get logged in user

    const {

        data: { user },

        error: userError

    } =
        await supabaseClient
            .auth
            .getUser();


    if (userError || !user) {


        message.textContent =
            "❌ You must be logged in before adding questions.";


        message.style.color =
            "#dc3545";


        return;

    }


    // Get values

    const course =
        document
            .getElementById("course")
            .value;


    const topic =
        document
            .getElementById("topic")
            .value;


    const question =
        document
            .getElementById("question")
            .value
            .trim();


    const option_a =
        document
            .getElementById("option_a")
            .value
            .trim();


    const option_b =
        document
            .getElementById("option_b")
            .value
            .trim();


    const option_c =
        document
            .getElementById("option_c")
            .value
            .trim();


    const option_d =
        document
            .getElementById("option_d")
            .value
            .trim();


    const correct_answer =
        document
            .getElementById("correct_answer")
            .value;


    const explanation =
        document
            .getElementById("explanation")
            .value
            .trim();



    // Validation

    if (

        !question ||

        !option_a ||

        !option_b ||

        !option_c ||

        !option_d

    ) {


        message.textContent =
            "⚠️ Please fill in all the question fields.";


        message.style.color =
            "#dc3545";


        return;

    }



    // Disable button

    button.disabled =
        true;


    button.textContent =
        "Saving question...";



    // Insert into Supabase

    const {

        error

    } =
        await supabaseClient

            .from("questions")

            .insert([

                {

                    course:
                        course,

                    topic:
                        topic,

                    question:
                        question,

                    option_a:
                        option_a,

                    option_b:
                        option_b,

                    option_c:
                        option_c,

                    option_d:
                        option_d,

                    correct_answer:
                        correct_answer,

                    explanation:
                        explanation

                }

            ]);



    // Handle error

    if (error) {


        console.error(
            "Question insert error:",
            error
        );


        message.textContent =
            "❌ Error: " +
            error.message;


        message.style.color =
            "#dc3545";


        button.disabled =
            false;


        button.textContent =
            "➕ Add Question";


        return;

    }



    // Success

    message.textContent =
        "✅ Question added successfully!";


    message.style.color =
        "#198754";



    // Clear question fields

    document
        .getElementById("question")
        .value = "";


    document
        .getElementById("option_a")
        .value = "";


    document
        .getElementById("option_b")
        .value = "";


    document
        .getElementById("option_c")
        .value = "";


    document
        .getElementById("option_d")
        .value = "";


    document
        .getElementById("explanation")
        .value = "";



    // Restore button

    button.disabled =
        false;


    button.textContent =
        "➕ Add Question";

}



// =====================================================
// LOGOUT
// =====================================================

async function logout() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}



// =====================================================
// START ADMIN DASHBOARD
// =====================================================

async function startAdminDashboard() {


    const allowed =
        await checkAdminAccess();


    if (!allowed) {

        return;

    }


    // Load topics immediately

    updateTopics();

}


startAdminDashboard();


</script>


</body>

</html>
