<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #0b5ed7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .logout {
            background: #dc3545;
            float: right;
            margin-top: -45px;
        }

        .topic-help {
            margin-top: 6px;
            color: #6c757d;
            font-size: 13px;
        }

    </style>

</head>


<body>


<header>

    <h1>
        🏥 OGCONS Study Hub
    </h1>

    <p>
        Admin Dashboard
    </p>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>



<div class="container">

    <div class="card">

        <h2>
            ➕ Add New Question
        </h2>


        <!-- =====================================
             COURSE
        ====================================== -->

        <label>
            Course
        </label>

        <select id="course">

            <option value="Microbiology">
                Microbiology
            </option>

            <option value="Anatomy & Physiology">
                Anatomy & Physiology
            </option>

            <option value="Pharmacology">
                Pharmacology
            </option>

            <option value="Medical-Surgical Nursing">
                Medical-Surgical Nursing
            </option>

            <option value="Nutrition">
                Nutrition
            </option>

            <option value="Psychology">
                Psychology
            </option>

            <option value="Nursing Practice">
                Nursing Practice
            </option>

            <option value="Chemistry">
                Chemistry
            </option>

        </select>



        <!-- =====================================
             TOPIC
        ====================================== -->

        <label>
            Topic
        </label>

        <select id="topic">
        </select>


        <div class="topic-help">

            Select the topic where this question belongs.

        </div>



        <!-- =====================================
             QUESTION
        ====================================== -->

        <label>
            Question
        </label>

        <textarea
            id="question"
            placeholder="Enter your question">
        </textarea>



        <!-- =====================================
             OPTION A
        ====================================== -->

        <label>
            Option A
        </label>

        <input
            id="option_a"
            type="text"
            placeholder="Enter option A">



        <!-- =====================================
             OPTION B
        ====================================== -->

        <label>
            Option B
        </label>

        <input
            id="option_b"
            type="text"
            placeholder="Enter option B">



        <!-- =====================================
             OPTION C
        ====================================== -->

        <label>
            Option C
        </label>

        <input
            id="option_c"
            type="text"
            placeholder="Enter option C">



        <!-- =====================================
             OPTION D
        ====================================== -->

        <label>
            Option D
        </label>

        <input
            id="option_d"
            type="text"
            placeholder="Enter option D">



        <!-- =====================================
             CORRECT ANSWER
        ====================================== -->

        <label>
            Correct Answer
        </label>

        <select id="correct_answer">

            <option value="A">
                A
            </option>

            <option value="B">
                B
            </option>

            <option value="C">
                C
            </option>

            <option value="D">
                D
            </option>

        </select>



        <!-- =====================================
             EXPLANATION
        ====================================== -->

        <label>
            Explanation
        </label>

        <textarea
            id="explanation"
            placeholder="Enter explanation for the answer">
        </textarea>



        <!-- =====================================
             ADD QUESTION
        ====================================== -->

        <button
            id="addQuestionButton"
            onclick="addQuestion()">

            ➕ Add Question

        </button>


        <div id="message"></div>

    </div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


// ======================================================
// SUPABASE CONNECTION
// ======================================================

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// ======================================================
// COURSE TOPICS
// ======================================================

const courseTopics = {

    // ==================================================
    // MICROBIOLOGY
    // ==================================================

    "Microbiology": [

        "Introduction to Microbiology",

        "Bacteria",

        "Viruses",

        "Fungi",

        "Protozoa",

        "Helminths",

        "Immunology",

        "Infection and Disease",

        "Sterilization and Disinfection",

        "Epidemiology"

    ],



    // ==================================================
    // ANATOMY & PHYSIOLOGY
    // ==================================================

    "Anatomy & Physiology": [

        "Anatomy and organisation of the body",

        "Physiological chemistry and processes",

        "Cells and tissues",

        "The blood",

        "The cardiovascular system",

        "The lymphatic system",

        "The nervous system",

        "The special senses",

        "The endocrine system",

        "The respiratory system",

        "Introduction to nutrition",

        "The digestive system",

        "The urinary system",

        "The skin",

        "Defence and immunity",

        "The musculoskeletal system",

        "Genetics and inheritance",

        "The reproductive systems"

    ],



    // ==================================================
    // OTHER COURSES
    // ==================================================

    "Pharmacology": [

        "General Pharmacology"

    ],


    "Medical-Surgical Nursing": [

        "General Medical-Surgical Nursing"

    ],


    "Nutrition": [

        "Introduction to Nutrition"

    ],


    "Psychology": [

        "Introduction to Psychology"

    ],


    "Nursing Practice": [

        "Introduction to Nursing Practice"

    ],


    "Chemistry": [

        "Introduction to Chemistry"

    ]

};



// ======================================================
// LOAD TOPICS
// ======================================================

function loadTopics() {

    const course =
        document.getElementById("course").value;


    const topicSelect =
        document.getElementById("topic");


    // Clear current topics

    topicSelect.innerHTML = "";



    // Get topics for selected course

    const topics =
        courseTopics[course] || [];



    // If no topics

    if (topics.length === 0) {

        const option =
            document.createElement("option");

        option.value = "";

        option.textContent =
            "No topics available";

        topicSelect.appendChild(option);

        return;

    }



    // Add topics

    topics.forEach(function(topic) {

        const option =
            document.createElement("option");

        option.value =
            topic;

        option.textContent =
            topic;

        topicSelect.appendChild(option);

    });

}



// ======================================================
// COURSE CHANGE
// ======================================================

document
    .getElementById("course")
    .addEventListener(
        "change",
        loadTopics
    );



// ======================================================
// CHECK ADMIN ACCESS
// ======================================================

async function checkAdminAccess() {


    const {
        data: { user },
        error: userError
    } =
        await supabaseClient
            .auth
            .getUser();



    // Not logged in

    if (userError || !user) {

        window.location.href =
            "index.html";

        return false;

    }



    // Check admins table

    const {
        data: admin,
        error: adminError
    } =
        await supabaseClient

            .from("admins")

            .select("user_id")

            .eq(
                "user_id",
                user.id
            )

            .maybeSingle();



    // Database error

    if (adminError) {

        console.error(
            "Admin check error:",
            adminError.message
        );


        document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:60px 20px;
                font-family:Arial;
            ">

                <h2>
                    ⚠️ Unable to verify admin access
                </h2>

                <p>
                    Please try again later.
                </p>

            </div>

        `;


        return false;

    }



    // Not admin

    if (!admin) {

        document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:60px 20px;
                font-family:Arial;
            ">

                <h2>
                    🚫 Access Denied
                </h2>

                <p>
                    You do not have permission
                    to access the Admin Dashboard.
                </p>

                <br>

                <a href="dashboard.html">

                    ← Return to Dashboard

                </a>

            </div>

        `;


        return false;

    }



    console.log(
        "✅ Admin access granted."
    );


    return true;

}



// ======================================================
// ADD QUESTION
// ======================================================

async function addQuestion() {


    const message =
        document.getElementById(
            "message"
        );


    const button =
        document.getElementById(
            "addQuestionButton"
        );



    // ==========================================
    // CHECK LOGIN
    // ==========================================

    const {
        data: { user },
        error: userError
    } =
        await supabaseClient
            .auth
            .getUser();



    if (userError || !user) {

        message.textContent =
            "❌ You must be logged in before adding questions.";

        message.style.color =
            "#dc3545";

        return;

    }



    // ==========================================
    // GET VALUES
    // ==========================================

    const course =
        document
            .getElementById("course")
            .value;


    const topic =
        document
            .getElementById("topic")
            .value;


    const question =
        document
            .getElementById("question")
            .value
            .trim();


    const option_a =
        document
            .getElementById("option_a")
            .value
            .trim();


    const option_b =
        document
            .getElementById("option_b")
            .value
            .trim();


    const option_c =
        document
            .getElementById("option_c")
            .value
            .trim();


    const option_d =
        document
            .getElementById("option_d")
            .value
            .trim();


    const correct_answer =
        document
            .getElementById("correct_answer")
            .value;


    const explanation =
        document
            .getElementById("explanation")
            .value
            .trim();



    // ==========================================
    // VALIDATION
    // ==========================================

    if (
        !question ||
        !option_a ||
        !option_b ||
        !option_c ||
        !option_d
    ) {

        message.textContent =
            "⚠️ Please fill in all the question fields.";

        message.style.color =
            "#dc3545";

        return;

    }



    // ==========================================
    // PREVENT DOUBLE CLICK
    // ==========================================

    button.disabled = true;

    button.textContent =
        "Saving question...";



    // ==========================================
    // INSERT INTO SUPABASE
    // ==========================================

    const {
        error
    } =
        await supabaseClient

            .from("questions")

            .insert([

                {

                    course: course,

                    topic: topic,

                    question: question,

                    option_a: option_a,

                    option_b: option_b,

                    option_c: option_c,

                    option_d: option_d,

                    correct_answer:
                        correct_answer,

                    explanation:
                        explanation

                }

            ]);



    // ==========================================
    // HANDLE ERROR
    // ==========================================

    if (error) {

        console.error(
            "Question insert error:",
            error
        );


        message.textContent =
            "❌ Error: " +
            error.message;


        message.style.color =
            "#dc3545";


        button.disabled =
            false;


        button.textContent =
            "➕ Add Question";


        return;

    }



    // ==========================================
    // SUCCESS
    // ==========================================

    message.textContent =
        "✅ Question added successfully!";


    message.style.color =
        "#198754";



    // ==========================================
    // CLEAR FORM
    // ==========================================

    document
        .getElementById("question")
        .value = "";


    document
        .getElementById("option_a")
        .value = "";


    document
        .getElementById("option_b")
        .value = "";


    document
        .getElementById("option_c")
        .value = "";


    document
        .getElementById("option_d")
        .value = "";


    document
        .getElementById("explanation")
        .value = "";



    // ==========================================
    // RESTORE BUTTON
    // ==========================================

    button.disabled =
        false;


    button.textContent =
        "➕ Add Question";

}



// ======================================================
// LOGOUT
// ======================================================

async function logout() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}



// ======================================================
// START ADMIN DASHBOARD
// ======================================================

// Load topics immediately

loadTopics();


// Check admin access

checkAdminAccess();


</script>


</body>

</html>
