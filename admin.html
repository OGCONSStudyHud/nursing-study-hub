<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>OGCONS Study Hub - Admin Dashboard</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    min-height: 100vh;

            135deg,

header {

}

.header-content {

    max-width: 1200px;

    display: flex;

    align-items: center;
}

.logo {

    font-weight: bold;
}

}

    margin: auto;

}

.page-title {

    padding: 25px;

    box-shadow:

}

}

}

.form-group label {

}

.question-card {

.question-top {

}

.question-number {

}

.course-badge {

    background: #e8f4ff;

    color: #0b5ed7;

    padding: 6px 10px;

    font-size: 13px;

    font-weight: bold;
}

.topic-badge {

    display: inline-block;

    background: #fff4e5;

    font-size: 13px;

.question-text {

.options {

}

.option {

.explanation-box {

.question-actions {

    gap: 10px;

}

.edit-btn {

}

.delete-btn {

    background: #dc3545;

    color: white;
}

#status {

    display: none;

    padding: 15px;

    border-radius: 10px;

    margin-bottom: 20px;

    font-weight: bold;

    line-height: 1.5;
}

.success {

}

.error {

    background: #f8d7da;

    color: #842029;
}

#loading {

    text-align: center;

    padding: 30px;

}

.empty {

    background: white;

    padding: 35px;

    border-radius: 18px;

    text-align: center;

    color: #68756d;
}

footer {

    text-align: center;

    padding: 35px;

    color: #68756d;
}

@media(max-width:700px) {

    .header-content {

        flex-direction: column;

        gap: 15px;

        text-align: center;
    }

    .options-grid {

        grid-template-columns: 1fr;
    }

    .form-card {

        padding: 20px;
    }

    .question-card {

        padding: 20px;
    }

    .question-top {

        flex-direction: column;
    }

    .questions-header {

        flex-direction: column;

        align-items: flex-start;

        gap: 10px;
    }

}

</style>

</head>

<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
window.supabase.createClient(

let allQuestions = [];

let editingId = null;

// =====================================================
// UPDATE TOPICS
// =====================================================

function updateTopics(selectedTopic = "") {


    const course =
        document.getElementById("course").value;


    const topicSelect =
        document.getElementById("topic");


    topicSelect.innerHTML = `

        <option value="">
            Select Topic
        </option>

    `;


    if (!course) {

        return;

    }


    const topics =
        courseTopics[course] || [];


    topics.forEach(function(topic) {


        const option =
            document.createElement("option");


        option.value =
            topic;


        option.textContent =
            topic;


        if (topic === selectedTopic) {

            option.selected =
                true;

        }


        topicSelect.appendChild(
            option
        );

    });

}



// =====================================================
// CHECK LOGIN
// =====================================================

async function checkLogin() {


    const {

        data: {
            user
        },

        error

    } =
        await supabaseClient
            .auth
            .getUser();


    if (
        error ||
        !user
    ) {

        window.location.href =
            "index.html";

        return false;

    }


    return true;

}



// =====================================================
// LOAD QUESTIONS
// =====================================================

async function loadQuestions() {


    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.display =
        "block";


    const {

        data,

        error

    } =
        await supabaseClient

            .from("questions")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {


        console.error(error);


        showStatus(

            "Unable to load questions: " +
            error.message,

            "error"

        );


        loading.style.display =
            "none";


        return;

    }


    allQuestions =
        data || [];


    loading.style.display =
        "none";


    displayQuestions(
        allQuestions
    );

}



// =====================================================
// DISPLAY QUESTIONS
// =====================================================

function displayQuestions(
    questions
) {


    const container =
        document.getElementById(
            "questionsList"
        );


    container.innerHTML =
        "";


    document
        .getElementById(
            "questionCount"
        )
        .textContent =

            questions.length +

            (
                questions.length === 1

                    ? " Question"

                    : " Questions"
            );


    if (
        questions.length === 0
    ) {


        container.innerHTML = `

            <div class="empty">

                <h2>
                    📭 No Questions Found
                </h2>

                <p style="margin-top:10px;">

                    There are currently no
                    questions.

                </p>

            </div>

        `;


        return;

    }



    questions.forEach(
        function(q, index) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "question-card";


            const correct =
                String(
                    q.correct_answer || ""
                )
                .trim()
                .toUpperCase();



            card.innerHTML = `

                <div class="question-top">

                    <div class="question-number">

                        Question ${index + 1}

                    </div>


                    <div class="course-badge">

                        ${escapeHTML(
                            q.course || ""
                        )}

                    </div>

                </div>


                <div class="topic-badge">

                    ${escapeHTML(
                        q.topic ||
                        "No Topic"
                    )}

                </div>


                <div class="question-text">

                    ${escapeHTML(
                        q.question || ""
                    )}

                </div>


                <div class="options">


                    <div class="option ${
                        correct === "A"
                            ? "correct-option"
                            : ""
                    }">

                        <strong>A.</strong>

                        ${escapeHTML(
                            q.option_a || ""
                        )}

                    </div>



                    <div class="option ${
                        correct === "B"
                            ? "correct-option"
                            : ""
                    }">

                        <strong>B.</strong>

                        ${escapeHTML(
                            q.option_b || ""
                        )}

                    </div>



                    <div class="option ${
                        correct === "C"
                            ? "correct-option"
                            : ""
                    }">

                        <strong>C.</strong>

                        ${escapeHTML(
                            q.option_c || ""
                        )}

                    </div>



                    <div class="option ${
                        correct === "D"
                            ? "correct-option"
                            : ""
                    }">

                        <strong>D.</strong>

                        ${escapeHTML(
                            q.option_d || ""
                        )}

                    </div>


                </div>



                <div class="explanation-box">

                    <strong>
                        💡 Explanation:
                    </strong>

                    <br><br>

                    ${escapeHTML(
                        q.explanation ||
                        "No explanation provided."
                    )}

                </div>



                <div class="question-actions">


                    <button
                        class="edit-btn"
                        onclick="editQuestion('${q.id}')">

                        ✏️ Edit

                    </button>



                    <button
                        class="delete-btn"
                        onclick="deleteQuestion('${q.id}')">

                        🗑️ Delete

                    </button>


                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}



// =====================================================
// SEARCH
// =====================================================

function filterQuestions() {


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    if (!search) {

        displayQuestions(
            allQuestions
        );

        return;

    }


    const filtered =
        allQuestions.filter(
            function(q) {


                return (

                    String(
                        q.question || ""
                    )
                    .toLowerCase()
                    .includes(search)


                    ||


                    String(
                        q.course || ""
                    )
                    .toLowerCase()
                    .includes(search)


                    ||


                    String(
                        q.topic || ""
                    )
                    .toLowerCase()
                    .includes(search)


                    ||


                    String(
                        q.option_a || ""
                    )
                    .toLowerCase()
                    .includes(search)


                    ||


                    String(
                        q.option_b || ""
                    )
                    .toLowerCase()
                    .includes(search)


                    ||


                    String(
                        q.option_c || ""
                    )
                    .toLowerCase()
                    .includes(search)


                    ||


                    String(
                        q.option_d || ""
                    )
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    displayQuestions(
        filtered
    );

}



// =====================================================
// SAVE QUESTION
// =====================================================

async function saveQuestion() {


    const course =
        document
            .getElementById("course")
            .value;


    const topic =
        document
            .getElementById("topic")
            .value;


    const question =
        document
            .getElementById("question")
            .value
            .trim();


    const option_a =
        document
            .getElementById("option_a")
            .value
            .trim();


    const option_b =
        document
            .getElementById("option_b")
            .value
            .trim();


    const option_c =
        document
            .getElementById("option_c")
            .value
            .trim();


    const option_d =
        document
            .getElementById("option_d")
            .value
            .trim();


    const correct_answer =
        document
            .getElementById(
                "correct_answer"
            )
            .value;


    const explanation =
        document
            .getElementById("explanation")
            .value
            .trim();



    if (

        !course ||

        !topic ||

        !question ||

        !option_a ||

        !option_b ||

        !option_c ||

        !option_d ||

        !correct_answer

    ) {


        showStatus(

            "Please complete all required fields.",

            "error"

        );


        return;

    }



    const questionData = {

        course:
            course,

        topic:
            topic,

        question:
            question,

        option_a:
            option_a,

        option_b:
            option_b,

        option_c:
            option_c,

        option_d:
            option_d,

        correct_answer:
            correct_answer,

        explanation:
            explanation

    };



    // =================================================
    // EDIT EXISTING QUESTION
    // =================================================

    if (editingId) {


        const {

            error

        } =
            await supabaseClient

                .from("questions")

                .update(
                    questionData
                )

                .eq(
                    "id",
                    editingId
                );


        if (error) {


            showStatus(

                "Unable to update question: " +
                error.message,

                "error"

            );


            return;

        }


        showStatus(

            "✅ Question updated successfully.",

            "success"

        );


        editingId =
            null;


        resetEditMode();


        clearForm();


        await loadQuestions();


        return;

    }



    // =================================================
    // ADD NEW QUESTION
    // =================================================

    const {

        error

    } =
        await supabaseClient

            .from("questions")

            .insert([
                questionData
            ]);



    if (error) {


        console.error(error);


        showStatus(

            "Unable to add question: " +
            error.message,

            "error"

        );


        return;

    }



    showStatus(

        "✅ Question added successfully.",

        "success"

    );


    clearForm();


    await loadQuestions();

}

// =====================================================
// DELETE QUESTION
// =====================================================

async function deleteQuestion(id) {


    const question =
        allQuestions.find(
            q =>
                String(q.id) ===
                String(id)
        );


    if (!question) {

        return;

    }


    const confirmed =
        confirm(

            "Are you sure you want to delete this question?\n\n" +

            question.question

        );


    if (!confirmed) {

        return;

    }



    const {

        error

    } =
        await supabaseClient

            .from("questions")

            .delete()

            .eq(
                "id",
                id
            );



    if (error) {


        showStatus(

            "Unable to delete question: " +
            error.message,

            "error"

        );


        return;

    }



    showStatus(

        "✅ Question deleted successfully.",

        "success"

    );


    await loadQuestions();

}



// =====================================================
// STATUS MESSAGE
// =====================================================

function showStatus(
    message,
    type
) {


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        type;


    status.style.display =
        "block";


    setTimeout(
        function() {

            status.style.display =
                "none";

        },
        4000
    );

}



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {


    if (

        value === null ||

        value === undefined

    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
