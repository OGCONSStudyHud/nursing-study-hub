<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        OGCONS Study Hub - Foundations of Nursing Quiz
    </title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #e8fff2,
                    #e8f4ff,
                    #f5eaff
                );

            color: #172033;

        }

        header {

            background:
                linear-gradient(
                    135deg,
                    #18a058,
                    #2eb7a0
                );

            color: white;

            padding: 22px 20px;

        }

        .header-content {

            max-width: 900px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }

        .logo {

            font-size: 22px;

            font-weight: bold;

        }

        .back-button {

            background: white;

            color: #18a058;

            border: none;

            padding: 10px 16px;

            border-radius: 20px;

            font-weight: bold;

            cursor: pointer;

        }

        .container {

            max-width: 900px;

            margin: auto;

            padding: 30px 20px;

        }

        .quiz-header {

            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

            margin-bottom: 25px;

        }

        .quiz-header h1 {

            margin-bottom: 8px;

        }

        .quiz-topic {

            color: #18a058;

            font-weight: bold;

            margin-top: 8px;

        }

        .quiz-header p {

            color: #68756d;

            line-height: 1.5;

        }

        .progress-container {

            margin-top: 20px;

        }

        .progress-info {

            display: flex;

            justify-content: space-between;

            font-weight: bold;

            margin-bottom: 8px;

        }

        .progress-bar {

            width: 100%;

            height: 10px;

            background: #e1e7e4;

            border-radius: 10px;

            overflow: hidden;

        }

        .progress {

            height: 100%;

            width: 0%;

            background: #18a058;

            transition: width 0.3s;

        }

        .question-card {

            background: white;

            padding: 28px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

            margin-bottom: 20px;

        }

        .question-number {

            color: #18a058;

            font-weight: bold;

            margin-bottom: 12px;

        }

        .question {

            font-size: 20px;

            font-weight: bold;

            line-height: 1.5;

            margin-bottom: 25px;

        }

        .options {

            display: grid;

            gap: 12px;

        }

        .option {

            width: 100%;

            padding: 16px;

            border: 2px solid #dce4df;

            border-radius: 12px;

            background: white;

            text-align: left;

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;

        }

        .option:hover {

            border-color: #18a058;

            background: #f2fff7;

        }

        .option.selected {

            border-color: #18a058;

            background: #e7fff0;

        }

        .option-letter {

            font-weight: bold;

            color: #18a058;

            margin-right: 8px;

        }

        .navigation {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-top: 20px;

        }

        .nav-button {

            border: none;

            padding: 13px 22px;

            border-radius: 25px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }

        .previous {

            background: #6c757d;

            color: white;

        }

        .next {

            background: #18a058;

            color: white;

        }

        .submit {

            background: #0b5ed7;

            color: white;

        }

        .nav-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }

        .result {

            display: none;

            background: white;

            padding: 35px 25px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.1);

            text-align: center;

        }

        .result-icon {

            font-size: 65px;

            margin-bottom: 15px;

        }

        .result h2 {

            margin-bottom: 10px;

        }

        .score {

            font-size: 50px;

            font-weight: bold;

            color: #18a058;

            margin: 15px 0;

        }

        .result-message {

            color: #66736c;

            margin-bottom: 25px;

            line-height: 1.5;

        }

        .result-buttons {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

        }

        .result-buttons button {

            border: none;

            padding: 13px 20px;

            border-radius: 25px;

            font-weight: bold;

            cursor: pointer;

        }

        .retry {

            background: #18a058;

            color: white;

        }

        .home {

            background: #6c757d;

            color: white;

        }

        .loading {

            text-align: center;

            padding: 60px 20px;

            font-size: 18px;

        }

        .error {

            background: white;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            color: #dc3545;

        }

        @media (max-width: 600px) {

            .header-content {

                flex-direction: column;

            }

            .question-card {

                padding: 20px;

            }

            .question {

                font-size: 18px;

            }

            .navigation {

                flex-direction: column;

            }

            .nav-button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="logo">

            🩺 OGCONS Study Hub

        </div>

        <button
            class="back-button"
            onclick="goBack()">

            ← Back to Topics

        </button>

    </div>

</header>


<div
    id="loading"
    class="loading">

    Loading Foundations of Nursing quiz...

</div>


<div
    id="quizContainer"
    class="container"
    style="display:none;">


    <div class="quiz-header">

        <h1>

            Foundations of Nursing

        </h1>

        <p>

            Test your knowledge of this topic.

        </p>

        <div
            class="quiz-topic"
            id="quizTopic">

            Loading topic...

        </div>


        <div class="progress-container">

            <div class="progress-info">

                <span id="questionProgress">

                    Question 1 of 1

                </span>

                <span id="answeredCount">

                    0 answered

                </span>

            </div>


            <div class="progress-bar">

                <div
                    class="progress"
                    id="progress">

                </div>

            </div>

        </div>

    </div>


    <div id="questionArea">

        <div class="question-card">

            <div
                class="question-number"
                id="questionNumber">

                Question 1

            </div>


            <div
                class="question"
                id="questionText">

                Loading question...

            </div>


            <div
                class="options"
                id="optionsContainer">

            </div>


            <div class="navigation">

                <button
                    class="nav-button previous"
                    id="previousButton"
                    onclick="previousQuestion()">

                    ← Previous

                </button>


                <button
                    class="nav-button next"
                    id="nextButton"
                    onclick="nextQuestion()">

                    Next →

                </button>


                <button
                    class="nav-button submit"
                    id="submitButton"
                    onclick="submitQuiz()"
                    style="display:none;">

                    Submit Quiz ✓

                </button>

            </div>

        </div>

    </div>


    <div
        class="result"
        id="result">

        <div class="result-icon">

            🏆

        </div>

        <h2>

            Quiz Completed!

        </h2>

        <p>

            Your score

        </p>

        <div
            class="score"
            id="finalScore">

            0%

        </div>


        <p
            class="result-message"
            id="resultMessage">

        </p>


        <div class="result-buttons">

            <button
                class="retry"
                onclick="retryQuiz()">

                🔄 Retake Quiz

            </button>


            <button
                class="home"
                onclick="goBack()">

                📚 Back to Topics

            </button>

        </div>

    </div>


</div>


<script>


// ======================================================
// SUPABASE
// ======================================================

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );



// ======================================================
// GET TOPIC
// ======================================================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const topic =
    urlParams.get("topic");



// ======================================================
// VARIABLES
// ======================================================

let questions = [];

let currentQuestion = 0;

let selectedAnswers = {};

let user = null;



// ======================================================
// LOAD USER
// ======================================================

async function loadUser() {

    const {

        data: {
            user: currentUser
        },

        error

    } =
        await supabaseClient
            .auth
            .getUser();


    if (
        error ||
        !currentUser
    ) {

        window.location.href =
            "index.html";

        return false;

    }


    user =
        currentUser;


    return true;

}



// ======================================================
// LOAD QUESTIONS
// ======================================================

async function loadQuestions() {

    if (!topic) {

        showError(`

            <h2>
                ⚠️ No Topic Selected
            </h2>

            <p style="margin-top:10px;">

                Please return to Foundations
                of Nursing and select a topic.

            </p>

        `);

        return false;

    }


    document
        .getElementById("quizTopic")
        .textContent =
        topic;


    /*
       IMPORTANT:

       Both values must match the
       Admin Dashboard exactly.

       Course:
       Foundations of Nursing

       Topic:
       The selected topic
    */


    const {

        data,

        error

    } =
        await supabaseClient

            .from("questions")

            .select("*")

            .eq(
                "course",
                "Foundations of Nursing"
            )

            .eq(
                "topic",
                topic
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Question loading error:",
            error
        );


        showError(

            "Unable to load the quiz questions.<br><br>" +

            escapeHTML(
                error.message
            )

        );


        return false;

    }


    questions =
        data || [];


    if (
        questions.length === 0
    ) {

        showError(`

            <h2>
                📭 No Questions Yet
            </h2>

            <p style="margin-top:10px;">

                There are currently no questions
                for:

            </p>

            <p
                style="
                    margin-top:10px;
                    font-weight:bold;
                ">

                ${escapeHTML(topic)}

            </p>

            <p style="margin-top:10px;">

                Please add questions from the
                Admin Dashboard.

            </p>

        `);

        return false;

    }


    return true;

}



// ======================================================
// DISPLAY QUESTION
// ======================================================

function displayQuestion() {

    const q =
        questions[
            currentQuestion
        ];


    if (!q) {

        return;

    }


    document
        .getElementById("questionNumber")
        .textContent =

        "Question " +
        (
            currentQuestion + 1
        );


    document
        .getElementById("questionProgress")
        .textContent =

        "Question " +
        (
            currentQuestion + 1
        ) +
        " of " +
        questions.length;


    document
        .getElementById("questionText")
        .textContent =
        q.question;


    const optionsContainer =
        document.getElementById(
            "optionsContainer"
        );


    optionsContainer.innerHTML = "";


    const options = [

        {
            letter: "A",
            text: q.option_a
        },

        {
            letter: "B",
            text: q.option_b
        },

        {
            letter: "C",
            text: q.option_c
        },

        {
            letter: "D",
            text: q.option_d
        }

    ];


    options.forEach(
        function(option) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            if (

                selectedAnswers[
                    currentQuestion
                ] ===
                option.letter

            ) {

                button.classList.add(
                    "selected"
                );

            }


            button.innerHTML = `

                <span class="option-letter">

                    ${option.letter}.

                </span>

                ${escapeHTML(
                    option.text
                )}

            `;


            button.onclick =
                function() {

                    selectAnswer(
                        option.letter
                    );

                };


            optionsContainer.appendChild(
                button
            );

        }
    );


    document
        .getElementById("previousButton")
        .disabled =
        currentQuestion === 0;


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    if (

        currentQuestion ===
        questions.length - 1

    ) {

        nextButton.style.display =
            "none";

        submitButton.style.display =
            "block";

    }

    else {

        nextButton.style.display =
            "block";

        submitButton.style.display =
            "none";

    }


    updateProgress();

}



// ======================================================
// SELECT ANSWER
// ======================================================

function selectAnswer(answer) {

    selectedAnswers[
        currentQuestion
    ] =
        answer;


    displayQuestion();

}



// ======================================================
// NEXT
// ======================================================

function nextQuestion() {

    if (

        currentQuestion <
        questions.length - 1

    ) {

        currentQuestion++;

        displayQuestion();

    }

}



// ======================================================
// PREVIOUS
// ======================================================

function previousQuestion() {

    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        displayQuestion();

    }

}



// ======================================================
// UPDATE PROGRESS
// ======================================================

function updateProgress() {

    const answered =
        Object.keys(
            selectedAnswers
        ).length;


    document
        .getElementById("answeredCount")
        .textContent =

        answered +
        " answered";


    const percentage =

        (
            (
                currentQuestion + 1
            )
            /
            questions.length
        ) * 100;


    document
        .getElementById("progress")
        .style.width =

        percentage + "%";

}



// ======================================================
// SUBMIT QUIZ
// ======================================================

async function submitQuiz() {

    const answered =
        Object.keys(
            selectedAnswers
        ).length;


    if (
        answered <
        questions.length
    ) {

        const remaining =

            questions.length -
            answered;


        const confirmSubmit =
            confirm(

                "You have " +
                remaining +
                " unanswered question(s).\n\n" +
                "Are you sure you want to submit?"

            );


        if (!confirmSubmit) {

            return;

        }

    }


    let score = 0;


    questions.forEach(
        function(q, index) {

            const selected =
                selectedAnswers[
                    index
                ];


            if (

                selected &&
                selected ===
                q.correct_answer

            ) {

                score++;

            }

        }
    );


    const percentage =

        Math.round(

            (
                score /
                questions.length
            ) * 100

        );


    await saveQuizResult(
        score,
        percentage
    );


    showResult(
        score,
        percentage
    );

}



// ======================================================
// SAVE RESULT
// ======================================================

async function saveQuizResult(
    score,
    percentage
) {

    if (!user) {

        return;

    }


    const resultData = {

        user_id:
            user.id,

        score:
            score,

        total_questions:
            questions.length,

        percentage:
            percentage

    };


    const {
        error
    } =
        await supabaseClient

            .from("quiz_results")

            .insert([
                resultData
            ]);


    if (error) {

        console.error(
            "Unable to save quiz result:",
            error
        );

    }

}



// ======================================================
// SHOW RESULT
// ======================================================

function showResult(
    score,
    percentage
) {

    document
        .getElementById("questionArea")
        .style.display =
        "none";


    document
        .getElementById("result")
        .style.display =
        "block";


    document
        .getElementById("finalScore")
        .textContent =
        percentage + "%";


    let message = "";


    if (
        percentage >= 80
    ) {

        message =
            "Excellent work! 🎉 You have a strong understanding of this topic.";

    }

    else if (
        percentage >= 60
    ) {

        message =
            "Good job! 👍 Keep studying and you can improve even further.";

    }

    else if (
        percentage >= 50
    ) {

        message =
            "Fair attempt. 📚 Review your notes and try the quiz again.";

    }

    else {

        message =
            "Keep practicing. 💪 Go through your notes and try again.";

    }


    document
        .getElementById("resultMessage")
        .textContent =

        "You scored " +
        score +
        " out of " +
        questions.length +
        ". " +
        message;

}



// ======================================================
// RETRY
// ======================================================

function retryQuiz() {

    currentQuestion = 0;

    selectedAnswers = {};


    document
        .getElementById("result")
        .style.display =
        "none";


    document
        .getElementById("questionArea")
        .style.display =
        "block";


    displayQuestion();

}



// ======================================================
// BACK
// ======================================================

function goBack() {

    window.location.href =
        "foundations-topics.html";

}



// ======================================================
// ERROR
// ======================================================

function showError(message) {

    document
        .getElementById("loading")
        .style.display =
        "none";


    document
        .getElementById("quizContainer")
        .style.display =
        "block";


    document
        .getElementById("quizContainer")
        .innerHTML = `

        <div class="error">

            ${message}

            <br><br>

            <button
                class="nav-button home"
                onclick="goBack()">

                ← Back to Topics

            </button>

        </div>

    `;

}



// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



// ======================================================
// START QUIZ
// ======================================================

async function startQuiz() {

    const loggedIn =
        await loadUser();


    if (!loggedIn) {

        return;

    }


    const loaded =
        await loadQuestions();


    if (!loaded) {

        return;

    }


    document
        .getElementById("loading")
        .style.display =
        "none";


    document
        .getElementById("quizContainer")
        .style.display =
        "block";


    displayQuestion();

}



// ======================================================
// START
// ======================================================

startQuiz();


</script>


</body>

</html>
