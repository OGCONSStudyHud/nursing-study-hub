<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>OGCONS Study Hub - Notes Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

/* =========================
   HEADER
========================= */

header {
    background: linear-gradient(135deg, #064e3b, #0f766e);
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header button {
    border: none;
    background: white;
    color: #064e3b;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   PAGE
========================= */

.container {
    width: 95%;
    max-width: 1400px;
    margin: 25px auto;
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.card h2 {
    margin-top: 0;
}

/* =========================
   FORM
========================= */

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

select,
input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 15px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px;
    background: #eef2f7;
    border: 1px solid #d1d5db;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
}

.toolbar button,
.toolbar select {
    width: auto;
    margin: 0;
    padding: 7px 9px;
    border: 1px solid #cbd5e1;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}

.toolbar button:hover {
    background: #e5e7eb;
}

.toolbar .danger {
    color: #b91c1c;
}

.toolbar-separator {
    width: 1px;
    background: #cbd5e1;
    margin: 0 3px;
}

/* =========================
   RICH EDITOR
========================= */

.rich-editor {
    position: relative;
    min-height: 650px;
    border: 1px solid #d1d5db;
    border-radius: 0 0 10px 10px;
    padding: 25px;
    background: white;
    overflow: hidden;
    outline: none;
    line-height: 1.6;
}

.rich-editor:focus {
    border-color: #0f766e;
}

/* Normal text */
.rich-editor > p {
    margin: 10px 0;
}

/* =========================
   DESIGN OBJECT
========================= */

.design-object {
    position: absolute;
    user-select: none;
    z-index: 10;
}

.design-object.selected {
    outline: 2px dashed #0f766e;
}

.design-object.editing {
    outline: 2px solid #0f766e;
}

/* =========================
   TEXT OBJECT
========================= */

.text-object {
    width: 280px;
    min-height: 55px;
    padding: 0;
    background: transparent;
    cursor: move;
    transform-origin: center center;
}

.text-object .text-content {
    width: 100%;
    min-height: 55px;
    padding: 8px 10px;
    outline: none;
    border: none;
    background: transparent;
    white-space: pre-wrap;
    word-break: break-word;
    cursor: move;
    user-select: none;
}

.text-object.editing .text-content {
    cursor: text;
    user-select: text;
    background: rgba(255,255,255,0.35);
}

.text-object .text-content:focus {
    outline: none;
}

/* =========================
   IMAGE OBJECT
========================= */

.image-object {
    cursor: move;
    transform-origin: center center;
}

.image-object img {
    display: block;
    max-width: 100%;
    width: 250px;
    height: auto;
    pointer-events: none;
}

/* =========================
   SHAPES
========================= */

.shape-object {
    cursor: move;
    transform-origin: center center;
}

.shape-rectangle {
    width: 180px;
    height: 100px;
    border: 3px solid #0f766e;
    background: rgba(15,118,110,0.08);
}

.shape-circle {
    width: 130px;
    height: 130px;
    border: 3px solid #0f766e;
    border-radius: 50%;
    background: rgba(15,118,110,0.08);
}

.shape-line {
    width: 180px;
    height: 4px;
    background: #111827;
    transform-origin: left center;
}

.shape-arrow {
    width: 180px;
    height: 4px;
    background: #111827;
    position: relative;
    transform-origin: left center;
}

.shape-arrow::after {
    content: "";
    position: absolute;
    right: -2px;
    top: -7px;
    width: 15px;
    height: 15px;
    border-top: 4px solid #111827;
    border-right: 4px solid #111827;
    transform: rotate(45deg);
}

/* =========================
   OBJECT CONTROLS
========================= */

.object-controls {
    position: absolute;
    top: -35px;
    left: 0;
    display: none;
    gap: 4px;
    background: white;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    z-index: 100;
}

.design-object.selected .object-controls {
    display: flex;
}

.object-controls button {
    border: none;
    background: #f8fafc;
    padding: 4px 7px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
}

.object-controls button:hover {
    background: #e2e8f0;
}

/* =========================
   ROTATE HANDLE
========================= */

.rotate-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #0f766e;
    border: 2px solid white;
    top: -48px;
    left: 50%;
    transform: translateX(-50%);
    cursor: grab;
    display: none;
    z-index: 101;
}

.design-object.selected .rotate-handle {
    display: block;
}

/* =========================
   RESIZE HANDLE
========================= */

.resize-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    right: -7px;
    bottom: -7px;
    background: #0f766e;
    border: 2px solid white;
    border-radius: 3px;
    cursor: nwse-resize;
    display: none;
    z-index: 101;
}

.design-object.selected .resize-handle {
    display: block;
}

/* =========================
   BUTTONS
========================= */

.primary-btn {
    border: none;
    background: #0f766e;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.primary-btn:hover {
    background: #115e59;
}

.secondary-btn {
    border: none;
    background: #475569;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

.delete-btn {
    border: none;
    background: #dc2626;
    color: white;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
}

/* =========================
   NOTE LIST
========================= */

.note-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 15px;
}

.note-card {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 15px;
    background: white;
}

.note-card h3 {
    margin-top: 0;
    color: #064e3b;
}

.note-preview {
    max-height: 180px;
    overflow: hidden;
    font-size: 14px;
}

.note-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.note-actions button {
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.edit-note {
    background: #dbeafe;
    color: #1d4ed8;
}

.delete-note {
    background: #fee2e2;
    color: #b91c1c;
}

/* =========================
   PREVIEW
========================= */

.preview-box {
    display: none;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 25px;
    margin-top: 20px;
}

.preview-box.show {
    display: block;
}

/* =========================
   TABLE
========================= */

.rich-editor table {
    border-collapse: collapse;
    width: 100%;
    margin: 15px 0;
}

.rich-editor table td,
.rich-editor table th {
    border: 1px solid #94a3b8;
    padding: 8px;
    min-width: 50px;
}

/* =========================
   BLOCKQUOTE
========================= */

.rich-editor blockquote {
    border-left: 5px solid #0f766e;
    margin: 15px 0;
    padding-left: 15px;
    color: #475569;
}

/* =========================
   IMAGE
========================= */

.rich-editor img {
    max-width: 100%;
}

/* =========================
   STATUS
========================= */

#status {
    margin-top: 12px;
    font-weight: bold;
}

.success {
    color: #15803d;
}

.error {
    color: #b91c1c;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 700px) {

    .form-row {
        grid-template-columns: 1fr;
    }

    header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
    }

    .rich-editor {
        min-height: 500px;
        padding: 15px;
    }

}

</style>
</head>

<script>

/* =========================================================

========================================================= */

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";

const SUPABASE_KEY =

const supabaseClient =

    );


/* =========================================================
   COURSE TOPICS
========================================================= */

const courseTopics = {

    "Foundations of Nursing": [

    ],


    "Anatomy & Physiology": [

    ],


    "Pharmacology": [

    ],


    "Primary Health Care": [

        "The Community",
        "Cadre of Health Workers in PHC",
        "Community Mobilization",
        "Community Diagnosis",
        "Health Education",
        "Components of Primary Health Care",
        "Immunization Against Major Communicable Diseases",
        "Prevention and Control of Locally Endemic and Epidemic Diseases",
        "Promotion of Mental Health",
        "Maternal and Child Health Services",
        "Provision of Essential Drugs and Supplies",
        "Oral Hygiene and Eye Care",
        "Adolescence and Their Problems",
        "Referral System in PHC",
        "Care of the Aged in the Community",
        "Management of Occupational Health",
        "Management in Primary Health Care"

    ],


    "Medical/Surgical Nursing": [

        "Concepts and Terms in Medical-Surgical Nursing",
        "Management of Patients with Medical/Surgical Conditions",
        "Management of Patients with Medical/Surgical Conditions 2",
        "Common Situations That Threaten Adaptation",
        "Body Defense Mechanisms",
        "Diagnostic Measures",
        "Principles of Operating Room Nursing"

    ],


    "Microbiology": [

        "Introduction to Microbiology",
        "Bacteria",
        "Viruses",
        "Fungi",
        "Parasites",
        "Immunology",
        "Sterilization & Disinfection",
        "Healthcare-Associated Infections"

    ]

};


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let editingNoteId = null;

let selectedObject = null;

let savedSelection = null;

let dragData = null;

let resizeData = null;

let rotateData = null;


/* =========================================================
   COURSE CHANGE
========================================================= */

document
.getElementById("course")
.addEventListener("change", function () {

    const course = this.value;

    const topicSelect =
        document.getElementById("topic");

    topicSelect.innerHTML =
        '<option value="">Select Topic</option>';

    if (!course || !courseTopics[course]) {
        return;
    }

    courseTopics[course].forEach(function(topic) {

        const option =
            document.createElement("option");

        option.value = topic;

        option.textContent = topic;

        topicSelect.appendChild(option);

    });

});


/* =========================================================
   NORMALIZE TOPIC
========================================================= */

function normalizeTopic(value) {

    return String(value || "")
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

}


/* =========================================================
   SAVE SELECTION
========================================================= */

function saveSelection() {

    const selection =
        window.getSelection();

    if (!selection.rangeCount) {
        return;
    }

    const range =
        selection.getRangeAt(0);

    if (
        document
        .getElementById("content")
        .contains(range.commonAncestorContainer)
    ) {

        savedSelection =
            range.cloneRange();

    }

}


/* =========================================================
   RESTORE SELECTION
========================================================= */

function restoreSelection() {

    if (!savedSelection) {
        return;
    }

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        savedSelection
    );

}


/* =========================================================
   EDITOR FOCUS
========================================================= */

document
.getElementById("content")
.addEventListener(
    "keyup",
    saveSelection
);

document
.getElementById("content")
.addEventListener(
    "mouseup",
    saveSelection
);


/* =========================================================
   FORMAT TEXT
========================================================= */

function formatText(command, value = null) {

    restoreSelection();

    document.execCommand(
        command,
        false,
        value
    );

    saveSelection();

}


/* =========================================================
   FORMAT BLOCK
========================================================= */

function formatBlock(tag) {

    if (!tag) return;

    restoreSelection();

    document.execCommand(
        "formatBlock",
        false,
        tag
    );

    saveSelection();

}


/* =========================================================
   FONT SIZE
========================================================= */

function changeFontSize(size) {

    if (!size) return;

    restoreSelection();

    document.execCommand(
        "fontSize",
        false,
        size
    );

    saveSelection();

}


/* =========================================================
   TEXT COLOR
========================================================= */

function changeTextColor() {

    const color =
        prompt(
            "Enter text color:\n\nExample: red, blue, #0f766e"
        );

    if (!color) return;

    restoreSelection();

    document.execCommand(
        "foreColor",
        false,
        color
    );

    saveSelection();

}


/* =========================================================
   HIGHLIGHT
========================================================= */

function changeHighlightColor() {

    const color =
        prompt(
            "Enter highlight color:\n\nExample: yellow, #fef08a"
        );

    if (!color) return;

    restoreSelection();

    document.execCommand(
        "hiliteColor",
        false,
        color
    );

    saveSelection();

}


/* =========================================================
   INSERT LINK
========================================================= */

function insertLink() {

    const url =
        prompt(
            "Enter URL:"
        );

    if (!url) return;

    restoreSelection();

    document.execCommand(
        "createLink",
        false,
        url
    );

    saveSelection();

}


/* =========================================================
   INSERT TABLE
========================================================= */

function insertTable() {

    const rows =
        parseInt(
            prompt("Number of rows:", "3")
        );

    const cols =
        parseInt(
            prompt("Number of columns:", "3")
        );

    if (
        !rows ||
        !cols ||
        rows < 1 ||
        cols < 1
    ) {
        return;
    }

    let html =
        '<table><tbody>';

    for (
        let r = 0;
        r < rows;
        r++
    ) {

        html += "<tr>";

        for (
            let c = 0;
            c < cols;
            c++
        ) {

            html +=
                "<td>&nbsp;</td>";

        }

        html += "</tr>";

    }

    html +=
        "</tbody></table><p><br></p>";

    restoreSelection();

    document.execCommand(
        "insertHTML",
        false,
        html
    );

}


/* =========================================================
   INSERT IMAGE FROM COMPUTER
========================================================= */

function insertImage() {

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept =
        "image/*";

    input.onchange =
        function () {

            const file =
                input.files[0];

            if (!file) return;

            const reader =
                new FileReader();

            reader.onload =
                function (event) {

                    addImageObject(
                        event.target.result
                    );

                };

            reader.readAsDataURL(
                file
            );

        };

    input.click();

}


/* =========================================================
   INSERT IMAGE URL
========================================================= */

function insertImageURL() {

    const url =
        prompt(
            "Enter image URL:"
        );

    if (!url) return;

    addImageObject(url);

}


/* =========================================================
   ADD IMAGE OBJECT
========================================================= */

function addImageObject(src) {

    const editor =
        document.getElementById("content");

    const object =
        document.createElement("div");

    object.className =
        "design-object image-object";

    object.dataset.objectType =
        "image";

    object.style.left =
        "80px";

    object.style.top =
        "100px";

    object.innerHTML = `

        <img
            src="${escapeAttribute(src)}"
        >

        ${objectControlsHTML()}

        <div class="rotate-handle"></div>

        <div class="resize-handle"></div>

    `;

    editor.appendChild(object);

    makeObjectInteractive(object);

    selectObject(object);

}


/* =========================================================
   TEXT BOX
========================================================= */

function addTextBox() {

    const editor =
        document.getElementById("content");

    const object =
        document.createElement("div");

    object.className =
        "design-object text-object editing";

    object.dataset.objectType =
        "text";

    object.style.left =
        "80px";

    object.style.top =
        "100px";

    object.setAttribute(
        "contenteditable",
        "false"
    );

    object.innerHTML = `

        <div
            class="text-content"
            contenteditable="true"
        >Type your text here...</div>

        ${objectControlsHTML()}

        <div class="rotate-handle"></div>

        <div class="resize-handle"></div>

    `;

    editor.appendChild(object);

    makeObjectInteractive(object);

    selectObject(object);

    enterTextEdit(object);

}


/* =========================================================
   TEXT EDIT
========================================================= */

function enterTextEdit(object) {

    if (!object) return;

    if (
        !object.classList.contains(
            "text-object"
        )
    ) {
        return;
    }

    exitAllTextEditing(
        object
    );

    object.classList.add(
        "editing"
    );

    const text =
        object.querySelector(
            ".text-content"
        );

    if (!text) return;

    text.setAttribute(
        "contenteditable",
        "true"
    );

    text.focus();

    placeCaretAtEnd(text);

}


/* =========================================================
   EXIT TEXT EDIT
========================================================= */

function exitTextEdit(object) {

    if (!object) return;

    object.classList.remove(
        "editing"
    );

    const text =
        object.querySelector(
            ".text-content"
        );

    if (text) {

        text.setAttribute(
            "contenteditable",
            "false"
        );

    }

    savedSelection = null;

}


/* =========================================================
   EXIT ALL TEXT EDITING
========================================================= */

function exitAllTextEditing(except = null) {

    document
    .querySelectorAll(
        ".text-object.editing"
    )
    .forEach(function(object) {

        if (
            object !== except
        ) {

            exitTextEdit(
                object
            );

        }

    });

}


/* =========================================================
   CARET AT END
========================================================= */

function placeCaretAtEnd(element) {

    const range =
        document.createRange();

    range.selectNodeContents(
        element
    );

    range.collapse(false);

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        range
    );

}


/* =========================================================
   OBJECT CONTROLS HTML
========================================================= */

function objectControlsHTML() {

    return `

        <div class="object-controls">

            <button
                type="button"
                onclick="moveObjectLeft(event)"
                title="Move left"
            >
                ←
            </button>

            <button
                type="button"
                onclick="moveObjectCenter(event)"
                title="Center"
            >
                ↔
            </button>

            <button
                type="button"
                onclick="moveObjectRight(event)"
                title="Move right"
            >
                →
            </button>

            <button
                type="button"
                onclick="rotateObjectLeft(event)"
                title="Rotate left"
            >
                ↶
            </button>

            <button
                type="button"
                onclick="rotateObjectRight(event)"
                title="Rotate right"
            >
                ↷
            </button>

            <button
                type="button"
                onclick="deleteSelectedObject(event)"
                title="Delete"
            >
                🗑
            </button>

        </div>

    `;

}


/* =========================================================
   SELECT OBJECT
========================================================= */

function selectObject(object) {

    if (!object) return;

    document
    .querySelectorAll(
        ".design-object.selected"
    )
    .forEach(function(item) {

        item.classList.remove(
            "selected"
        );

    });

    selectedObject =
        object;

    object.classList.add(
        "selected"
    );

}


/* =========================================================
   DESELECT ALL
========================================================= */

function deselectAll() {

    document
    .querySelectorAll(
        ".design-object.selected"
    )
    .forEach(function(object) {

        object.classList.remove(
            "selected"
        );

    });

    selectedObject = null;

}


/* =========================================================
   OBJECT INTERACTION
========================================================= */

function makeObjectInteractive(object) {

    /* -----------------------------------------
       NORMAL OBJECT POINTER DOWN
    ----------------------------------------- */

    object.addEventListener(
        "pointerdown",
        function(e) {

            if (
                e.target.closest(
                    ".object-controls"
                )
            ) {
                return;
            }

            if (
                e.target.closest(
                    ".rotate-handle"
                )
            ) {
                return;
            }

            if (
                e.target.closest(
                    ".resize-handle"
                )
            ) {
                return;
            }

            selectObject(
                object
            );


            /* ---------------------------------
               TEXT OBJECT
            --------------------------------- */

            if (
                object.classList.contains(
                    "text-object"
                )
            ) {

                /*
                    When editing:
                    allow normal text selection.
                */

                if (
                    object.classList.contains(
                        "editing"
                    )
                ) {

                    return;

                }

                /*
                    When not editing:
                    clicking/dragging the box
                    moves it like Canva.
                */

                beginDrag(
                    e,
                    object
                );

                return;

            }


            /* ---------------------------------
               IMAGE / SHAPE
            --------------------------------- */

            beginDrag(
                e,
                object
            );

        }
    );


    /* -----------------------------------------
       DOUBLE CLICK TEXT TO EDIT
    ----------------------------------------- */

    if (
        object.classList.contains(
            "text-object"
        )
    ) {

        object.addEventListener(
            "dblclick",
            function(e) {

                if (
                    e.target.closest(
                        ".object-controls"
                    )
                ) {
                    return;
                }

                if (
                    e.target.closest(
                        ".rotate-handle"
                    )
                ) {
                    return;
                }

                if (
                    e.target.closest(
                        ".resize-handle"
                    )
                ) {
                    return;
                }

                enterTextEdit(
                    object
                );

            }
        );

    }


    /* -----------------------------------------
       ROTATE
    ----------------------------------------- */

    const rotateHandle =
        object.querySelector(
            ".rotate-handle"
        );

    if (rotateHandle) {

        rotateHandle.addEventListener(
            "pointerdown",
            function(e) {

                e.stopPropagation();

                selectObject(
                    object
                );

                beginRotate(
                    e,
                    object
                );

            }
        );

    }


    /* -----------------------------------------
       RESIZE
    ----------------------------------------- */

    const resizeHandle =
        object.querySelector(
            ".resize-handle"
        );

    if (resizeHandle) {

        resizeHandle.addEventListener(
            "pointerdown",
            function(e) {

                e.stopPropagation();

                selectObject(
                    object
                );

                beginResize(
                    e,
                    object
                );

            }
        );

    }

}


/* =========================================================
   BEGIN DRAG
========================================================= */

function beginDrag(e, object) {

    e.preventDefault();

    const editor =
        document.getElementById("content");

    const editorRect =
        editor.getBoundingClientRect();

    const objectRect =
        object.getBoundingClientRect();

    const scrollLeft =
        editor.scrollLeft;

    const scrollTop =
        editor.scrollTop;

    dragData = {

        object,

        startX:
            e.clientX,

        startY:
            e.clientY,

        startLeft:
            object.offsetLeft,

        startTop:
            object.offsetTop,

        editorRect,

        scrollLeft,

        scrollTop

    };


    document.addEventListener(
        "pointermove",
        dragMove
    );

    document.addEventListener(
        "pointerup",
        endDrag,
        {
            once: true
        }
    );

}


/* =========================================================
   DRAG MOVE
========================================================= */

function dragMove(e) {

    if (!dragData) {
        return;
    }

    const dx =
        e.clientX -
        dragData.startX;

    const dy =
        e.clientY -
        dragData.startY;

    let newLeft =
        dragData.startLeft +
        dx;

    let newTop =
        dragData.startTop +
        dy;


    const editor =
        document.getElementById(
            "content"
        );


    const maxLeft =
        editor.scrollWidth -
        dragData.object.offsetWidth -
        5;

    const maxTop =
        Math.max(
            editor.scrollHeight,
            editor.clientHeight
        ) -
        dragData.object.offsetHeight -
        5;


    newLeft =
        Math.max(
            0,
            Math.min(
                newLeft,
                Math.max(
                    0,
                    maxLeft
                )
            )
        );

    newTop =
        Math.max(
            0,
            Math.min(
                newTop,
                Math.max(
                    0,
                    maxTop
                )
            )
        );


    dragData.object.style.left =
        newLeft + "px";

    dragData.object.style.top =
        newTop + "px";

}


/* =========================================================
   END DRAG
========================================================= */

function endDrag() {

    document.removeEventListener(
        "pointermove",
        dragMove
    );

    dragData = null;

}


/* =========================================================
   BEGIN RESIZE
========================================================= */

function beginResize(e, object) {

    e.preventDefault();

    resizeData = {

        object,

        startX:
            e.clientX,

        startY:
            e.clientY,

        startWidth:
            object.offsetWidth,

        startHeight:
            object.offsetHeight

    };


    document.addEventListener(
        "pointermove",
        resizeMove
    );

    document.addEventListener(
        "pointerup",
        endResize,
        {
            once: true
        }
    );

}


/* =========================================================
   RESIZE MOVE
========================================================= */

function resizeMove(e) {

    if (!resizeData) {
        return;
    }

    const dx =
        e.clientX -
        resizeData.startX;

    const dy =
        e.clientY -
        resizeData.startY;

    const object =
        resizeData.object;


    let newWidth =
        resizeData.startWidth +
        dx;

    let newHeight =
        resizeData.startHeight +
        dy;


    newWidth =
        Math.max(
            60,
            newWidth
        );

    newHeight =
        Math.max(
            40,
            newHeight
        );


    object.style.width =
        newWidth + "px";


    /*
       Text boxes can resize vertically.
    */

    if (
        object.classList.contains(
            "text-object"
        )
    ) {

        object.style.minHeight =
            newHeight + "px";

    }

    else if (
        object.classList.contains(
            "image-object"
        )
    ) {

        const img =
            object.querySelector(
                "img"
            );

        if (img) {

            img.style.width =
                newWidth + "px";

        }

    }

    else {

        object.style.width =
            newWidth + "px";

        object.style.height =
            newHeight + "px";

    }

}


/* =========================================================
   END RESIZE
========================================================= */

function endResize() {

    document.removeEventListener(
        "pointermove",
        resizeMove
    );

    resizeData = null;

}


/* =========================================================
   BEGIN ROTATE
========================================================= */

function beginRotate(e, object) {

    e.preventDefault();

    const rect =
        object.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    const startAngle =
        Math.atan2(
            e.clientY - centerY,
            e.clientX - centerX
        ) *
        180 /
        Math.PI;


    const currentRotation =
        getRotation(object);


    rotateData = {

        object,

        centerX,

        centerY,

        startAngle,

        currentRotation

    };


    document.addEventListener(
        "pointermove",
        rotateMove
    );

    document.addEventListener(
        "pointerup",
        endRotate,
        {
            once: true
        }
    );

}


/* =========================================================
   ROTATE MOVE
========================================================= */

function rotateMove(e) {

    if (!rotateData) {
        return;
    }

    const angle =
        Math.atan2(
            e.clientY -
                rotateData.centerY,

            e.clientX -
                rotateData.centerX
        ) *
        180 /
        Math.PI;


    const rotation =
        rotateData.currentRotation +
        (
            angle -
            rotateData.startAngle
        );


    rotateData.object.style.transform =
        `rotate(${rotation}deg)`;

}


/* =========================================================
   END ROTATE
========================================================= */

function endRotate() {

    document.removeEventListener(
        "pointermove",
        rotateMove
    );

    rotateData = null;

}


/* =========================================================
   GET ROTATION
========================================================= */

function getRotation(object) {

    const transform =
        window.getComputedStyle(
            object
        ).transform;

    if (
        !transform ||
        transform === "none"
    ) {
        return 0;
    }

    const values =
        transform
        .match(
            /matrix\(([^)]+)\)/
        );

    if (!values) {
        return 0;
    }

    const parts =
        values[1]
        .split(",")
        .map(Number);

    const a =
        parts[0];

    const b =
        parts[1];

    let angle =
        Math.round(
            Math.atan2(
                b,
                a
            ) *
            180 /
            Math.PI
        );

    return angle;

}


/* =========================================================
   MOVE OBJECT LEFT
========================================================= */

function moveObjectLeft(e) {

    e.stopPropagation();

    if (!selectedObject) return;

    selectedObject.style.left =
        Math.max(
            0,
            selectedObject.offsetLeft - 10
        ) + "px";

}


/* =========================================================
   MOVE OBJECT CENTER
========================================================= */

function moveObjectCenter(e) {

    e.stopPropagation();

    if (!selectedObject) return;

    const editor =
        document.getElementById(
            "content"
        );

    const left =
        (
            editor.clientWidth -
            selectedObject.offsetWidth
        ) / 2;

    selectedObject.style.left =
        Math.max(
            0,
            left
        ) + "px";

}


/* =========================================================
   MOVE OBJECT RIGHT
========================================================= */

function moveObjectRight(e) {

    e.stopPropagation();

    if (!selectedObject) return;

    const editor =
        document.getElementById(
            "content"
        );

    const left =
        editor.clientWidth -
        selectedObject.offsetWidth -
        10;

    selectedObject.style.left =
        Math.max(
            0,
            left
        ) + "px";

}


/* =========================================================
   ROTATE LEFT
========================================================= */

function rotateObjectLeft(e) {

    e.stopPropagation();

    if (!selectedObject) return;

    const rotation =
        getRotation(
            selectedObject
        );

    selectedObject.style.transform =
        `rotate(${rotation - 15}deg)`;

}


/* =========================================================
   ROTATE RIGHT
========================================================= */

function rotateObjectRight(e) {

    e.stopPropagation();

    if (!selectedObject) return;

    const rotation =
        getRotation(
            selectedObject
        );

    selectedObject.style.transform =
        `rotate(${rotation + 15}deg)`;

}


/* =========================================================
   DELETE OBJECT
========================================================= */

function deleteSelectedObject(e) {

    if (e) {
        e.stopPropagation();
    }

    if (!selectedObject) return;

    selectedObject.remove();

    selectedObject = null;

}


/* =========================================================
   ADD SHAPE
========================================================= */

function addShape(type) {

    const editor =
        document.getElementById(
            "content"
        );

    const object =
        document.createElement("div");

    object.className =
        "design-object shape-object";

    object.dataset.objectType =
        "shape";

    object.dataset.shape =
        type;

    object.style.left =
        "100px";

    object.style.top =
        "150px";


    if (
        type === "arrow"
    ) {

        object.classList.add(
            "shape-arrow"
        );

    }

    else if (
        type === "line"
    ) {

        object.classList.add(
            "shape-line"
        );

    }

    else if (
        type === "rectangle"
    ) {

        object.classList.add(
            "shape-rectangle"
        );

    }

    else if (
        type === "circle"
    ) {

        object.classList.add(
            "shape-circle"
        );

    }


    object.innerHTML +=
        objectControlsHTML();

    object.innerHTML +=
        '<div class="rotate-handle"></div>';

    object.innerHTML +=
        '<div class="resize-handle"></div>';


    editor.appendChild(
        object
    );

    makeObjectInteractive(
        object
    );

    selectObject(
        object
    );

}


/* =========================================================
   CLICK OUTSIDE OBJECT
========================================================= */

document.addEventListener(
    "pointerdown",
    function(e) {

        const editor =
            document.getElementById(
                "content"
            );

        /*
           If currently editing a text box
           and user clicks outside it,
           save/finish editing.
        */

        const editingObject =
            document.querySelector(
                ".text-object.editing"
            );


        if (
            editingObject &&
            !editingObject.contains(e.target)
        ) {

            exitTextEdit(
                editingObject
            );

        }


        /*
           If clicking completely outside
           an object, deselect it.
        */

        if (
            !e.target.closest(
                ".design-object"
            )
        ) {

            deselectAll();

        }

    }
);


/* =========================================================
   PREVENT EDITOR FROM TREATING OBJECT
   AS NORMAL TEXT
========================================================= */

document
.getElementById("content")
.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Delete" ||
            e.key === "Backspace"
        ) {

            if (
                selectedObject &&
                !document
                .querySelector(
                    ".text-object.editing"
                )
            ) {

                /*
                   Delete object only if the
                   normal editor is not being typed into.
                */

            }

        }

    }
);


/* =========================================================
   PREVIEW
========================================================= */

function togglePreview() {

    const preview =
        document.getElementById(
            "previewBox"
        );

    if (
        preview.classList.contains(
            "show"
        )
    ) {

        preview.classList.remove(
            "show"
        );

        preview.innerHTML =
            "";

        return;

    }


    const html =
        prepareHTMLForSaving(
            false
        );

    preview.innerHTML =
        html;

    preview.classList.add(
        "show"
    );

}


/* =========================================================
   UNDO
========================================================= */

function undoAction() {

    document.execCommand(
        "undo"
    );

}


/* =========================================================
   REDO
========================================================= */

function redoAction() {

    document.execCommand(
        "redo"
    );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   PREPARE HTML FOR SAVING
========================================================= */

function prepareHTMLForSaving(
    wrapCanvas = true
) {

    const editor =
        document.getElementById(
            "content"
        );

    const clone =
        editor.cloneNode(
            true
        );


    /*
       Remove editing controls.
    */

    clone
    .querySelectorAll(
        ".object-controls, .rotate-handle, .resize-handle"
    )
    .forEach(function(element) {

        element.remove();

    });


    /*
       Clean text objects.
    */

    clone
    .querySelectorAll(
        ".text-object"
    )
    .forEach(function(object) {

        object.classList.remove(
            "selected"
        );

        object.classList.remove(
            "editing"
        );

        object.removeAttribute(
            "contenteditable"
        );

        const text =
            object.querySelector(
                ".text-content"
            );

        if (text) {

            text.removeAttribute(
                "contenteditable"
            );

            text.style.userSelect =
                "";

        }

    });


    /*
       Remove editor-only selection styles.
    */

    clone
    .querySelectorAll(
        ".selected"
    )
    .forEach(function(element) {

        element.classList.remove(
            "selected"
        );

    });


    const html =
        clone.innerHTML.trim();


    if (!wrapCanvas) {

        return html;

    }


    /*
       Put everything inside a
       self-contained relative canvas.
    */

    const hasObjects =
        clone.querySelector(
            ".design-object"
        );


    if (!hasObjects) {

        return html;

    }


    /*
       Find the lowest object so that
       student pages have enough height.
    */

    let maxBottom = 0;

    clone
    .querySelectorAll(
        ".design-object"
    )
    .forEach(function(object) {

        const top =
            parseFloat(
                object.style.top
            ) || 0;

        const height =
            object.offsetHeight ||
            parseFloat(
                object.style.height
            ) ||
            100;

        maxBottom =
            Math.max(
                maxBottom,
                top + height
            );

    });


    const canvasHeight =
        Math.max(
            500,
            maxBottom + 80
        );


    return `

        <div
            class="ogcons-note-canvas"
            style="
                position:relative;
                min-height:${canvasHeight}px;
                width:100%;
            "
        >

            ${html}

        </div>

    `;

}


/* =========================================================
   LOAD EDITOR CONTENT
========================================================= */

function loadEditorContent(html) {

    const editor =
        document.getElementById(
            "content"
        );

    editor.innerHTML =
        html || "";


    /*
       If this is a previously saved
       canvas, unwrap it.
    */

    const canvas =
        editor.querySelector(
            ":scope > .ogcons-note-canvas"
        );


    if (canvas) {

        editor.innerHTML =
            canvas.innerHTML;

    }


    /*
       Prepare saved text objects.
    */

    editor
    .querySelectorAll(
        ".text-object"
    )
    .forEach(function(object) {

        convertOldTextObject(
            object
        );

        makeObjectInteractive(
            object
        );

    });


    /*
       Prepare saved image objects.
    */

    editor
    .querySelectorAll(
        ".image-object"
    )
    .forEach(function(object) {

        addControlsIfMissing(
            object
        );

        makeObjectInteractive(
            object
        );

    });


    /*
       Prepare saved shapes.
    */

    editor
    .querySelectorAll(
        ".shape-object"
    )
    .forEach(function(object) {

        addControlsIfMissing(
            object
        );

        makeObjectInteractive(
            object
        );

    });

}


/* =========================================================
   CONVERT OLD TEXT OBJECT
========================================================= */

function convertOldTextObject(object) {

    if (
        object.querySelector(
            ".text-content"
        )
    ) {

        object.setAttribute(
            "contenteditable",
            "false"
        );

        return;

    }


    /*
       Old version may have text directly
       inside the object.
    */

    const children =
        Array.from(
            object.childNodes
        );


    let oldHTML = "";


    children.forEach(function(node) {

        if (
            node.nodeType ===
            Node.TEXT_NODE
        ) {

            oldHTML +=
                node.textContent;

        }

        else if (
            node.nodeType ===
            Node.ELEMENT_NODE
        ) {

            if (
                !node.classList.contains(
                    "object-controls"
                ) &&
                !node.classList.contains(
                    "rotate-handle"
                ) &&
                !node.classList.contains(
                    "resize-handle"
                )
            ) {

                oldHTML +=
                    node.outerHTML;

            }

        }

    });


    object.innerHTML =
        `

        <div
            class="text-content"
            contenteditable="false"
        >
            ${oldHTML || "Type your text here..."}
        </div>

        ${objectControlsHTML()}

        <div class="rotate-handle"></div>

        <div class="resize-handle"></div>

        `;

    object.setAttribute(
        "contenteditable",
        "false"
    );

}


/* =========================================================
   ADD CONTROLS IF MISSING
========================================================= */

function addControlsIfMissing(object) {

    if (
        !object.querySelector(
            ".object-controls"
        )
    ) {

        object.insertAdjacentHTML(
            "beforeend",
            objectControlsHTML()
        );

    }


    if (
        !object.querySelector(
            ".rotate-handle"
        )
    ) {

        object.insertAdjacentHTML(
            "beforeend",
            '<div class="rotate-handle"></div>'
        );

    }


    if (
        !object.querySelector(
            ".resize-handle"
        )
    ) {

        object.insertAdjacentHTML(
            "beforeend",
            '<div class="resize-handle"></div>'
        );

    }

}


/* =========================================================
   SAVE NOTE
========================================================= */

async function saveNote() {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Saving...";

    status.className =
        "";


    /*
       Finish any active text editing.
    */

    exitAllTextEditing();


    const course =
        document.getElementById(
            "course"
        ).value;

    const topic =
        document.getElementById(
            "topic"
        ).value;

    const title =
        document.getElementById(
            "title"
        ).value.trim();


    if (!course) {

        status.textContent =
            "Please select a course.";

        status.className =
            "error";

        return;

    }


    if (!topic) {

        status.textContent =
            "Please select a topic.";

        status.className =
            "error";

        return;

    }


    if (!title) {

        status.textContent =
            "Please enter a note title.";

        status.className =
            "error";

        return;

    }


    const content =
        prepareHTMLForSaving(
            true
        );


    if (!content.trim()) {

        status.textContent =
            "Please enter some note content.";

        status.className =
            "error";

        return;

    }


    try {

        let result;


        if (editingNoteId) {

            result =
                await supabaseClient
                .from("notes")
                .update({

                    course:
                        course,

                    topic:
                        topic,

                    title:
                        title,

                    content:
                        content,

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    editingNoteId
                );

        }

        else {

            result =
                await supabaseClient
                .from("notes")
                .insert({

                    course:
                        course,

                    topic:
                        topic,

                    title:
                        title,

                    content:
                        content

                });

        }


        if (result.error) {

            throw result.error;

        }


        status.textContent =
            editingNoteId
                ? "Note updated successfully."
                : "Note saved successfully.";

        status.className =
            "success";


        await loadNotes();

        clearEditor();

    }

    catch(error) {

        console.error(
            error
        );

        status.textContent =
            "Error: " +
            error.message;

        status.className =
            "error";

    }

}


/* =========================================================
   LOAD NOTES
========================================================= */

async function loadNotes() {

    const list =
        document.getElementById(
            "notesList"
        );

    list.innerHTML =
        "<p>Loading notes...</p>";


    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("notes")
            .select(
                "id, course, topic, title, content, created_at, updated_at"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {
            throw error;
        }


        if (
            !data ||
            data.length === 0
        ) {

            list.innerHTML =
                "<p>No notes found.</p>";

            return;

        }


        list.innerHTML =
            "";


        data.forEach(function(note) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "note-card";


            const preview =
                note.content || "";


            card.innerHTML = `

                <h3>
                    ${escapeHTML(
                        note.title
                    )}
                </h3>

                <strong>
                    ${escapeHTML(
                        note.course
                    )}
                </strong>

                <p>
                    ${escapeHTML(
                        note.topic
                    )}
                </p>

                <div class="note-preview">
                    ${preview}
                </div>

                <div class="note-actions">

                    <button
                        class="edit-note"
                        onclick="editNote('${note.id}')"
                    >
                        Edit
                    </button>

                    <button
                        class="delete-note"
                        onclick="deleteNote('${note.id}')"
                    >
                        Delete
                    </button>

                </div>

            `;


            list.appendChild(
                card
            );

        });

    }

    catch(error) {

        console.error(
            error
        );

        list.innerHTML =
            `<p class="error">
                ${escapeHTML(
                    error.message
                )}
            </p>`;

    }

}


/* =========================================================
   EDIT NOTE
========================================================= */

async function editNote(id) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("notes")
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


        if (error) {
            throw error;
        }


        editingNoteId =
            data.id;


        document.getElementById(
            "editorTitle"
        ).textContent =
            "Edit Note";


        document.getElementById(
            "course"
        ).value =
            data.course;


        /*
           Trigger course topic loading.
        */

        document
        .getElementById(
            "course"
        )
        .dispatchEvent(
            new Event("change")
        );


        const topicSelect =
            document.getElementById(
                "topic"
            );


        /*
           Match topic safely.
        */

        let foundTopic =
            courseTopics[
                data.course
            ]?.find(function(topic) {

                return normalizeTopic(
                    topic
                ) ===
                normalizeTopic(
                    data.topic
                );

            });


        if (foundTopic) {

            topicSelect.value =
                foundTopic;

        }
        else {

            topicSelect.value =
                data.topic;

        }


        document.getElementById(
            "title"
        ).value =
            data.title || "";


        loadEditorContent(
            data.content || ""
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

    catch(error) {

        alert(
            "Error loading note: " +
            error.message
        );

    }

}


/* =========================================================
   DELETE NOTE
========================================================= */

async function deleteNote(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this note?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const {
            error
        } =
            await supabaseClient
            .from("notes")
            .delete()
            .eq(
                "id",
                id
            );


        if (error) {
            throw error;
        }


        await loadNotes();

    }

    catch(error) {

        alert(
            "Error deleting note: " +
            error.message
        );

    }

}


/* =========================================================
   CLEAR EDITOR
========================================================= */

function clearEditor() {

    editingNoteId =
        null;


    document.getElementById(
        "editorTitle"
    ).textContent =
        "Create New Note";


    document.getElementById(
        "course"
    ).value =
        "";


    document.getElementById(
        "topic"
    ).innerHTML =
        '<option value="">Select Topic</option>';


    document.getElementById(
        "title"
    ).value =
        "";


    document.getElementById(
        "content"
    ).innerHTML =
        "";


    document.getElementById(
        "previewBox"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "previewBox"
    ).innerHTML =
        "";


    selectedObject =
        null;


    savedSelection =
        null;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadNotes();


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        /*
           Escape exits text editing.
        */

        if (
            e.key === "Escape"
        ) {

            const editingObject =
                document.querySelector(
                    ".text-object.editing"
                );

            if (editingObject) {

                exitTextEdit(
                    editingObject
                );

                selectObject(
                    editingObject
                );

            }

        }


        /*
           Delete selected object.
        */

        if (
            e.key === "Delete"
        ) {

            const editingObject =
                document.querySelector(
                    ".text-object.editing"
                );


            if (
                !editingObject &&
                selectedObject
            ) {

                /*
                   Only delete if the user
                   is not typing in the editor.
                */

                const active =
                    document.activeElement;

                if (
                    active ===
                    document.getElementById(
                        "content"
                    )
                ) {

                    return;

                }

                deleteSelectedObject();

            }

        }

    }
);

</script>
