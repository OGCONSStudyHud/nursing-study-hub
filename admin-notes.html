<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>OGCONS Study Hub - Notes Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:Arial,sans-serif;

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #e8fff2,
        #e8f4ff,
        #f5eaff
    );

    color:#172033;
}


/* ==============================
   HEADER
============================== */

header{

    background:
    linear-gradient(
        135deg,
        #18a058,
        #2eb7a0
    );

    color:white;

    padding:22px 20px;
}

.header-content{

    max-width:1200px;

    margin:auto;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;
}

.logo{

    font-size:23px;

    font-weight:bold;
}

.header-buttons{

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.header-button{

    border:none;

    background:white;

    color:#18a058;

    padding:10px 17px;

    border-radius:22px;

    font-weight:bold;

    cursor:pointer;

    text-decoration:none;
}

.header-button:hover{

    background:#f1f1f1;
}


/* ==============================
   MAIN
============================== */

.container{

    max-width:1200px;

    margin:auto;

    padding:30px 20px;
}


/* ==============================
   PAGE TITLE
============================== */

.page-title{

    background:white;

    padding:28px;

    border-radius:20px;

    box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);

    text-align:center;

    margin-bottom:25px;
}

.page-title h1{

    color:#18a058;

    margin-bottom:10px;

    font-size:30px;
}

.page-title p{

    color:#68756d;

    line-height:1.6;
}


/* ==============================
   STATUS
============================== */

#status{

    display:none;

    padding:15px;

    border-radius:10px;

    margin-bottom:20px;

    font-weight:bold;
}

.success{

    background:#d1e7dd;

    color:#0f5132;
}

.error{

    background:#f8d7da;

    color:#842029;
}


/* ==============================
   FORM CARD
============================== */

.form-card{

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);

    margin-bottom:25px;
}

.form-card h2{

    color:#18a058;

    margin-bottom:20px;
}

.form-group{

    margin-bottom:18px;
}

.form-group label{

    display:block;

    font-weight:bold;

    margin-bottom:7px;

    color:#26382d;
}

input,
select,
textarea{

    width:100%;

    padding:13px;

    border:2px solid #dce4df;

    border-radius:10px;

    font-size:15px;

    outline:none;

    font-family:Arial,sans-serif;
}

input:focus,
select:focus,
textarea:focus{

    border-color:#18a058;
}

textarea{

    min-height:180px;

    resize:vertical;

    line-height:1.6;
}

.form-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:18px;
}

.button-row{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:20px;
}

button{

    border:none;

    padding:13px 22px;

    border-radius:10px;

    font-weight:bold;

    cursor:pointer;

    font-size:15px;
}

.primary{

    background:#18a058;

    color:white;
}

.primary:hover{

    background:#117d45;
}

.secondary{

    background:#6c757d;

    color:white;
}

.secondary:hover{

    background:#565e64;
}


/* ==============================
   FILTER CARD
============================== */

.filter-card{

    background:white;

    padding:25px;

    border-radius:20px;

    box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);

    margin-bottom:25px;
}

.filter-card h2{

    color:#18a058;

    margin-bottom:18px;
}

.filter-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:15px;
}


/* ==============================
   NOTES HEADER
============================== */

.notes-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:18px;
}

.notes-header h2{

    color:#18a058;
}

.note-count{

    background:#e7fff0;

    color:#117d45;

    padding:8px 14px;

    border-radius:20px;

    font-weight:bold;
}


/* ==============================
   NOTE CARD
============================== */

.note-card{

    background:white;

    padding:25px;

    border-radius:18px;

    box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);

    margin-bottom:18px;
}

.note-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;

    margin-bottom:12px;
}

.note-number{

    color:#18a058;

    font-weight:bold;

    font-size:17px;
}

.course-badge{

    background:#e8f4ff;

    color:#0b5ed7;

    padding:6px 11px;

    border-radius:15px;

    font-size:13px;

    font-weight:bold;
}

.topic-badge{

    display:inline-block;

    background:#fff4e5;

    color:#b45309;

    padding:7px 11px;

    border-radius:15px;

    font-size:13px;

    font-weight:bold;

    margin-bottom:12px;
}

.note-title{

    font-size:21px;

    color:#172033;

    margin-bottom:12px;

    line-height:1.4;
}

.note-content{

    color:#526159;

    line-height:1.7;

    white-space:pre-wrap;

    background:#f8faf9;

    padding:18px;

    border-radius:12px;

    border:1px solid #e4ebe7;

    max-height:350px;

    overflow:auto;

}

.note-actions{

    display:flex;

    gap:10px;

    margin-top:18px;
}

.edit-btn{

    background:#0b5ed7;

    color:white;
}

.edit-btn:hover{

    background:#084da8;
}

.delete-btn{

    background:#dc3545;

    color:white;
}

.delete-btn:hover{

    background:#bb2d3b;
}


/* ==============================
   LOADING / EMPTY
============================== */

#loading{

    text-align:center;

    padding:35px;

    color:#68756d;
}

.empty{

    background:white;

    padding:40px;

    border-radius:18px;

    text-align:center;

    color:#68756d;

    box-shadow:
    0 8px 20px
    rgba(0,0,0,.06);
}


/* ==============================
   FOOTER
============================== */

footer{

    text-align:center;

    padding:35px;

    color:#68756d;

    font-size:14px;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:800px){

    .header-content{

        flex-direction:column;

        text-align:center;
    }

    .form-grid{

        grid-template-columns:1fr;
    }

    .filter-grid{

        grid-template-columns:1fr;
    }

    .note-top{

        flex-direction:column;
    }

}

@media(max-width:600px){

    .container{

        padding:20px 15px;
    }

    .form-card,
    .filter-card{

        padding:20px;
    }

    .notes-header{

        flex-direction:column;

        align-items:flex-start;
    }

    .note-actions{

        flex-direction:column;
    }

    .note-actions button{

        width:100%;
    }

}

</style>

</head>

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

);



/* =====================================================
   VARIABLES
===================================================== */

let allNotes = [];

let editingId = null;



/* =====================================================
   COURSE TOPICS
===================================================== */

const courseTopics = {


"Foundations of Nursing": [

"Introduction to Nursing",

"Health Care Institutions",

"Ethico-Legal Issues in Nursing",

"Tools of Nursing",

"Comfort and Safety Measures",

"Emergency Care",

"Administration of Drugs",

"Diagnostic Investigation",

"Aseptic Techniques",

"Unsafe Injection Safety",

"Introduction to Healthcare Waste",

"Legal Aspects of Nursing",

"Nursing Care of Patients with Feeding/Elimination Problems",

"Basic Life Support"

],


"Primary Health Care": [

"Introduction to Primary Health Care",

"The Community",

"Cadre of Health Workers in PHC",

"Community Mobilization",

"Community Diagnosis",

"Health Education",

"Components of Primary Health Care",

"Immunization Against Major Communicable Diseases",

"Prevention and Control of Locally Endemic and Epidemic Diseases",

"Promotion of Mental Health",

"Maternal and Child Health Services",

"Provision of Essential Drugs and Supplies",

"Oral Hygiene and Eye Care",

"Adolescence and Their Problems",

"Referral System in PHC",

"Care of the Aged in the Community",

"Management of Occupational Health",

"Management in Primary Health Care"

],


"Anatomy & Physiology": [

"Introduction to Anatomy",

"The Musculoskeletal System",

"Blood and Cardiovascular System",

"The Respiratory System",

"The Digestive System",

"The Integumentary System",

"The Excretory System",

"The Endocrine System",

"The Female Reproductive System",

"The Male Reproductive System",

"Foetal Development"

],


"Medical/Surgical Nursing": [

"Concepts and Terms in Medical-Surgical Nursing",

"Management of Patients with Medical/Surgical Conditions",

"Management of Patients with Medical/Surgical Conditions 2",

"Common Situations That Threaten Adaptation",

"Body Defense Mechanisms",

"Diagnostic Measures",

"Principles of Operating Room Nursing"

],


"Microbiology": [

"Introduction to Microbiology",

"Bacteria",

"Viruses",

"Fungi",

"Parasites",

"Immunology",

"Sterilization & Disinfection",

"Healthcare-Associated Infections"

],


"Pharmacology": [

"Introduction",

"Sources and Classification of Drugs",

"Preparation of Drugs",

"Routes of Drug Administration",

"Mechanism of Drug Action",

"National Drug Policy",

"Drugs Used in Management of Other Health Conditions",

"Patient Education and Counseling"

]

};



/* =====================================================
   UPDATE ADD/EDIT TOPICS
===================================================== */

function updateTopics(selectedTopic = "") {

    const course =
        document.getElementById("course").value;

    const topicSelect =
        document.getElementById("topic");


    topicSelect.innerHTML =
        `<option value="">Select Topic</option>`;


    if(!course){

        return;

    }


    const topics =
        courseTopics[course] || [];


    topics.forEach(function(topic){

        const option =
            document.createElement("option");


        option.value =
            topic;

        option.textContent =
            topic;


        if(topic === selectedTopic){

            option.selected =
                true;

        }


        topicSelect.appendChild(option);

    });

}



/* =====================================================
   UPDATE FILTER TOPICS
===================================================== */

function updateFilterTopics(selectedTopic = "") {

    const course =
        document.getElementById("filterCourse").value;

    const topicSelect =
        document.getElementById("filterTopic");


    topicSelect.innerHTML =
        `<option value="">All Topics</option>`;


    if(!course){

        return;

    }


    const topics =
        courseTopics[course] || [];


    topics.forEach(function(topic){

        const option =
            document.createElement("option");


        option.value =
            topic;

        option.textContent =
            topic;


        if(topic === selectedTopic){

            option.selected =
                true;

        }


        topicSelect.appendChild(option);

    });

}



/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin(){

    const {

        data:{
            user
        },

        error

    } =
    await supabaseClient
        .auth
        .getUser();


    if(error || !user){

        window.location.href =
            "index.html";

        return false;

    }


    return true;

}



/* =====================================================
   LOAD NOTES
===================================================== */

async function loadNotes(){

    const loading =
        document.getElementById("loading");


    loading.style.display =
        "block";


    const {

        data,

        error

    } =
    await supabaseClient
        .from("notes")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);


        showStatus(

            "Unable to load notes: " +
            error.message,

            "error"

        );


        loading.style.display =
            "none";


        return;

    }


    allNotes =
        data || [];


    loading.style.display =
        "none";


    filterNotes();

}



/* =====================================================
   FILTER NOTES
===================================================== */

function filterNotes(){

    const course =
        document.getElementById(
            "filterCourse"
        ).value;


    const topic =
        document.getElementById(
            "filterTopic"
        ).value;


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        allNotes.filter(function(note){

            const noteCourse =
                String(
                    note.course || ""
                );


            const noteTopic =
                String(
                    note.topic || ""
                );


            const noteTitle =
                String(
                    note.title || ""
                );


            const noteContent =
                String(
                    note.content || ""
                );


            const matchesCourse =
                !course ||
                noteCourse === course;


            const matchesTopic =
                !topic ||
                noteTopic === topic;


            const matchesSearch =
                !search ||

                noteTitle
                    .toLowerCase()
                    .includes(search)

                ||

                noteContent
                    .toLowerCase()
                    .includes(search)

                ||

                noteCourse
                    .toLowerCase()
                    .includes(search)

                ||

                noteTopic
                    .toLowerCase()
                    .includes(search);


            return (

                matchesCourse &&

                matchesTopic &&

                matchesSearch

            );

        });


    displayNotes(filtered);

}



/* =====================================================
   DISPLAY NOTES
===================================================== */

function displayNotes(notes){

    const container =
        document.getElementById(
            "notesList"
        );


    container.innerHTML =
        "";


    document
        .getElementById("noteCount")
        .textContent =
            notes.length +
            (
                notes.length === 1
                    ? " Note"
                    : " Notes"
            );


    if(notes.length === 0){

        container.innerHTML = `

            <div class="empty">

                <h2>

                    📭 No Notes Found

                </h2>

                <p style="margin-top:10px;">

                    No notes match your
                    selected filters.

                </p>

            </div>

        `;

        return;

    }


    notes.forEach(function(note,index){

        const card =
            document.createElement("div");


        card.className =
            "note-card";


        card.innerHTML = `

            <div class="note-top">

                <div class="note-number">

                    Note ${index + 1}

                </div>


                <div class="course-badge">

                    ${escapeHTML(
                        note.course || ""
                    )}

                </div>

            </div>


            <div class="topic-badge">

                ${escapeHTML(
                    note.topic || "No Topic"
                )}

            </div>


            <div class="note-title">

                ${escapeHTML(
                    note.title ||
                    "Untitled Note"
                )}

            </div>


            <div class="note-content">

                ${escapeHTML(
                    note.content ||
                    "No content available."
                )}

            </div>


            <div class="note-actions">


                <button
                    class="edit-btn"
                    onclick="editNote('${note.id}')">

                    ✏️ Edit

                </button>


                <button
                    class="delete-btn"
                    onclick="deleteNote('${note.id}')">

                    🗑️ Delete

                </button>


            </div>

        `;


        container.appendChild(card);

    });

}



/* =====================================================
   SAVE NOTE
===================================================== */

async function saveNote(){

    const course =
        document.getElementById(
            "course"
        ).value;


    const topic =
        document.getElementById(
            "topic"
        ).value;


    const title =
        document.getElementById(
            "title"
        )
        .value
        .trim();


    const content =
        document.getElementById(
            "content"
        )
        .value
        .trim();



    /* REQUIRED FIELDS */

    if(

        !course ||

        !topic ||

        !title ||

        !content

    ){

        showStatus(

            "Please complete Course, Topic, Note Title and Note Content.",

            "error"

        );

        return;

    }



    const noteData = {

        course: course,

        topic: topic,

        title: title,

        content: content

    };



    /* =================================================
       EDIT
    ================================================= */

    if(editingId){

        const {

            error

        } =
        await supabaseClient
            .from("notes")
            .update(noteData)
            .eq(
                "id",
                editingId
            );


        if(error){

            console.error(error);


            showStatus(

                "Unable to update note: " +
                error.message,

                "error"

            );

            return;

        }


        showStatus(

            "✅ Note updated successfully.",

            "success"

        );


        editingId =
            null;


        resetEditMode();

        clearForm();


        await loadNotes();


        return;

    }



    /* =================================================
       ADD
    ================================================= */

    const {

        error

    } =
    await supabaseClient
        .from("notes")
        .insert([

            noteData

        ]);


    if(error){

        console.error(error);


        showStatus(

            "Unable to add note: " +
            error.message,

            "error"

        );

        return;

    }


    showStatus(

        "✅ Note added successfully.",

        "success"

    );


    clearForm();


    await loadNotes();

}



/* =====================================================
   EDIT NOTE
===================================================== */

function editNote(id){

    const note =
        allNotes.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!note){

        return;

    }


    editingId =
        note.id;


    document
        .getElementById("formTitle")
        .textContent =
            "✏️ Edit Note";


    document
        .getElementById("saveButton")
        .textContent =
            "💾 Update Note";


    document
        .getElementById("cancelButton")
        .style.display =
            "inline-block";


    document
        .getElementById("course")
        .value =
            note.course || "";


    updateTopics(
        note.topic || ""
    );


    document
        .getElementById("title")
        .value =
            note.title || "";


    document
        .getElementById("content")
        .value =
            note.content || "";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

    editingId =
        null;


    resetEditMode();

    clearForm();

}



/* =====================================================
   RESET EDIT MODE
===================================================== */

function resetEditMode(){

    document
        .getElementById("formTitle")
        .textContent =
            "➕ Add New Note";


    document
        .getElementById("saveButton")
        .textContent =
            "➕ Add Note";


    document
        .getElementById("cancelButton")
        .style.display =
            "none";

}



/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

    document
        .getElementById("course")
        .value =
            "";


    document
        .getElementById("topic")
        .innerHTML = `

            <option value="">

                Select a course first

            </option>

        `;


    document
        .getElementById("title")
        .value =
            "";


    document
        .getElementById("content")
        .value =
            "";

}



/* =====================================================
   DELETE NOTE
===================================================== */

async function deleteNote(id){

    const note =
        allNotes.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!note){

        return;

    }


    const confirmed =
        confirm(

            "Are you sure you want to delete this note?\n\n" +

            (
                note.title ||
                "Untitled Note"
            )

        );


    if(!confirmed){

        return;

    }


    const {

        error

    } =
    await supabaseClient
        .from("notes")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        console.error(error);


        showStatus(

            "Unable to delete note: " +
            error.message,

            "error"

        );

        return;

    }


    showStatus(

        "✅ Note deleted successfully.",

        "success"

    );


    await loadNotes();

}



/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        type;


    status.style.display =
        "block";


    setTimeout(function(){

        status.style.display =
            "none";

    },4000);

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    if(

        value === null ||

        value === undefined

    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}



/* =====================================================
   START
===================================================== */

async function startAdmin(){

    const loggedIn =
        await checkLogin();


    if(!loggedIn){

        return;

    }


    updateFilterTopics();

    await loadNotes();

}


startAdmin();
