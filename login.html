<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8fff2, #e8f4ff, #f5eaff);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #163020;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #687a70;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #777;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #18a058;
            border-bottom-color: #18a058;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #263a2d;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #ccd8d0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #18a058;
        }

        .main-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #18a058;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .main-button:hover {
            background: #117d45;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #18a058;
            text-decoration: none;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🩺</div>

    <h1>OGCONS Study Hub</h1>

    <p class="subtitle">
        Student Account
    </p>

    <div class="tabs">

        <button class="tab active" id="loginTab" onclick="showLogin()">
            Login
        </button>

        <button class="tab" id="registerTab" onclick="showRegister()">
            Register
        </button>

    </div>


    <!-- LOGIN -->

    <div id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
        >

        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
        >

        <button class="main-button" onclick="login()">
            🔐 Login
        </button>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" class="hidden">

        <label>Full Name</label>

        <input
            type="text"
            id="registerName"
            placeholder="Enter your full name"
        >

        <label>Email</label>

        <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email"
        >

        <label>Password</label>

        <input
            type="password"
            id="registerPassword"
            placeholder="Create a password"
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
        >

        <button class="main-button" onclick="register()">
            📝 Create Account
        </button>

    </div>


    <div id="message" class="message"></div>

    <a class="back" href="index.html">
        ← Back to Study Hub
    </a>

</div>


<script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
        "https://bvetmmvpdotifusjkywd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // ==========================================
    // SWITCH BETWEEN LOGIN AND REGISTER
    // ==========================================

    function showLogin() {

        document.getElementById("loginForm")
            .classList.remove("hidden");

        document.getElementById("registerForm")
            .classList.add("hidden");

        document.getElementById("loginTab")
            .classList.add("active");

        document.getElementById("registerTab")
            .classList.remove("active");

        clearMessage();
    }


    function showRegister() {

        document.getElementById("loginForm")
            .classList.add("hidden");

        document.getElementById("registerForm")
            .classList.remove("hidden");

        document.getElementById("loginTab")
            .classList.remove("active");

        document.getElementById("registerTab")
            .classList.add("active");

        clearMessage();
    }


    // ==========================================
    // REGISTER
    // ==========================================

    async function register() {

        const name =
            document.getElementById("registerName").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim();

        const password =
            document.getElementById("registerPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (!name || !email || !password || !confirmPassword) {

            showMessage(
                "Please fill in all the fields.",
                false
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                false
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                false
            );

            return;
        }


        showMessage(
            "Creating your account...",
            true
        );


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {
                        full_name: name
                    },

                    emailRedirectTo:
                        "https://ogconsstudyhud.github.io/nursing-study-hub/login.html"

                }

            });


        if (error) {

            showMessage(
                error.message,
                false
            );

            return;
        }


        showMessage(
            "Account created! Check your email to confirm your account.",
            true
        );

    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function login() {

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password.",
                false
            );

            return;
        }


        showMessage(
            "Logging in...",
            true
        );


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            showMessage(
                error.message,
                false
            );

            return;
        }


        showMessage(
            "Login successful! 🎉",
            true
        );


        setTimeout(function() {

            window.location.href = "dashboard.html";

        }, 1000);

    }


    // ==========================================
    // MESSAGES
    // ==========================================

    function showMessage(text, success) {

        const message =
            document.getElementById("message");

        message.style.display = "block";

        message.textContent = text;

        if (success) {

            message.style.background = "#e6f8ed";
            message.style.color = "#117d45";

        } else {

            message.style.background = "#ffe8e8";
            message.style.color = "#b42318";

        }

    }


    function clearMessage() {

        const message =
            document.getElementById("message");

        message.style.display = "none";

    }

</script>

</body>
</html>
