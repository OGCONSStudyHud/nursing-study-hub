<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OGCONS Study Hub - Pharmacology Notes</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #e8fff2,
            #e8f4ff,
            #f5eaff
        );

    color: #172033;

    line-height: 1.7;
}

header {

    background:
        linear-gradient(
            135deg,
            #18a058,
            #2eb7a0
        );

    color: white;

    padding: 30px 20px;

    text-align: center;
}

header h1 {

    margin-bottom: 8px;

    font-size: 28px;
}

.container {

    max-width: 900px;

    margin: auto;

    padding: 30px 20px;
}

.back {

    display: inline-block;

    margin-bottom: 20px;

    color: #18a058;

    font-weight: bold;

    text-decoration: none;
}

.back:hover {

    text-decoration: underline;
}

.note-card {

    background: white;

    border-radius: 18px;

    padding: 35px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);
}

.topic-title {

    text-align: center;

    margin-bottom: 30px;
}

.topic-title h2 {

    color: #18a058;

    font-size: 28px;

    margin-bottom: 10px;
}

.topic-title p {

    color: #68756d;
}

.note-section {

    margin-bottom: 28px;
}

.note-section h3 {

    color: #18a058;

    font-size: 21px;

    margin-bottom: 10px;

    border-left: 5px solid #18a058;

    padding-left: 12px;
}

.note-section h4 {

    color: #26382d;

    margin: 15px 0 8px;
}

.note-section p {

    margin-bottom: 12px;
}

.note-section ul,
.note-section ol {

    margin-left: 25px;

    margin-bottom: 15px;
}

.note-section li {

    margin-bottom: 7px;
}

.highlight {

    background: #e8fff2;

    border-left: 5px solid #18a058;

    padding: 15px;

    border-radius: 8px;

    margin: 15px 0;
}

.warning {

    background: #fff4e5;

    border-left: 5px solid #f59e0b;

    padding: 15px;

    border-radius: 8px;

    margin: 15px 0;
}

.navigation {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    margin-top: 30px;
}

.nav-btn {

    display: inline-block;

    padding: 13px 20px;

    border-radius: 10px;

    text-decoration: none;

    font-weight: bold;
}

.topic-btn {

    background: #6c757d;

    color: white;
}

.quiz-btn {

    background: #18a058;

    color: white;
}

#error {

    background: white;

    padding: 30px;

    border-radius: 18px;

    text-align: center;

    color: #dc3545;
}

#loading {

    background: white;

    padding: 30px;

    border-radius: 18px;

    text-align: center;

    color: #18a058;

    font-weight: bold;
}

footer {

    text-align: center;

    padding: 35px;

    color: #68756d;
}

@media(max-width:600px) {

    .note-card {

        padding: 22px;
    }

    .topic-title h2 {

        font-size: 23px;
    }

    .navigation {

        flex-direction: column;
    }

    .nav-btn {

        text-align: center;
    }

}

</style>

</head>

<body>

<header>

<h1>
💊 OGCONS Study Hub
</h1>

<p>
Pharmacology Notes
</p>

</header>


<div class="container">

<a
href="pharmacology.html"
class="back">

← Back to Pharmacology Topics

</a>


<!-- LOADING MESSAGE -->

<div
id="loading">

Loading note...

</div>


<!-- ERROR MESSAGE -->

<div
id="error"
style="display:none;">

</div>


<!-- NOTE CARD -->

<div
class="note-card"
id="noteCard"
style="display:none;">


<div class="topic-title">

<h2 id="topicTitle">
Pharmacology
</h2>

<p>
Study Note
</p>

</div>


<div id="noteContent"></div>


<div class="navigation">

<a
href="pharmacology.html"
class="nav-btn topic-btn">

← All Topics

</a>

<a
id="quizLink"
href="#"
class="nav-btn quiz-btn">

📝 Take Quiz →

</a>

</div>


</div>

</div>


<footer>

OGCONS Study Hub © 2026

</footer>


<script>

// ==========================================
// SUPABASE CONNECTION
// ==========================================

const SUPABASE_URL =
"https://bvetmmvpdotifusjkywd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// COURSE
// ==========================================

const COURSE =
"Pharmacology";


// ==========================================
// GET TOPIC FROM URL
// ==========================================

const urlParams =
new URLSearchParams(
    window.location.search
);

const topic =
urlParams.get("topic");


// ==========================================
// ELEMENTS
// ==========================================

const topicTitle =
document.getElementById(
    "topicTitle"
);

const noteContent =
document.getElementById(
    "noteContent"
);

const quizLink =
document.getElementById(
    "quizLink"
);

const noteCard =
document.getElementById(
    "noteCard"
);

const error =
document.getElementById(
    "error"
);

const loading =
document.getElementById(
    "loading"
);


// ==========================================
// NORMALIZE TEXT
// ==========================================

function normalizeText(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

}


// ==========================================
// SHOW ERROR
// ==========================================

function showError(title, message) {

    loading.style.display =
        "none";

    noteCard.style.display =
        "none";

    error.style.display =
        "block";

    error.innerHTML = `

        <h2>
        ${title}
        </h2>

        <p style="margin-top:10px;">
        ${message}
        </p>

    `;

}


// ==========================================
// CHECK TOPIC
// ==========================================

if (!topic) {

    showError(
        "⚠️ No Topic Selected",
        "Please return to Pharmacology and select a topic."
    );

} else {

    topicTitle.textContent =
        topic;

    quizLink.href =
        "pharmacology-quiz.html?topic=" +
        encodeURIComponent(topic);

    loadNote(topic);

}


// ==========================================
// LOAD NOTE FROM SUPABASE
// ==========================================

async function loadNote(selectedTopic) {

    loading.style.display =
        "block";

    try {

        const {
            data,
            error: supabaseError
        } = await supabaseClient

            .from("notes")

            .select(
                "course, topic, title, content"
            )

            .eq(
                "course",
                COURSE
            );


        // ==================================
        // SUPABASE ERROR
        // ==================================

        if (supabaseError) {

            console.error(
                "Supabase error:",
                supabaseError
            );

            showError(
                "⚠️ Unable to Load Note",
                "There was a problem connecting to the notes database."
            );

            return;

        }


        // ==================================
        // FIND SELECTED TOPIC
        // ==================================

        const wantedTopic =
            normalizeText(
                selectedTopic
            );


        const selectedNote =
            (data || []).find(
                note =>
                    normalizeText(
                        note.topic
                    ) === wantedTopic
            );


        // ==================================
        // NOTE NOT FOUND
        // ==================================

        if (!selectedNote) {

            showError(
                "📚 Note Not Available",
                `A note for "${selectedTopic}" has not been added yet.`
            );

            return;

        }


        // ==================================
        // DISPLAY NOTE
        // ==================================

        loading.style.display =
            "none";

        error.style.display =
            "none";

        noteCard.style.display =
            "block";


        topicTitle.textContent =
            selectedNote.title ||
            selectedNote.topic ||
            selectedTopic;


        noteContent.innerHTML =
            selectedNote.content || `

                <div class="note-section">

                    <h3>
                    No Content Available
                    </h3>

                    <p>
                    This note has been created,
                    but no content has been added yet.
                    </p>

                </div>

            `;


        // ==================================
        // QUIZ LINK
        // ==================================

        quizLink.href =
            "pharmacology-quiz.html?topic=" +
            encodeURIComponent(
                selectedNote.topic ||
                selectedTopic
            );


    } catch (err) {

        console.error(
            "Unexpected error:",
            err
        );

        showError(
            "⚠️ Something Went Wrong",
            "The note could not be loaded. Please try again."
        );

    }

}

</script>

</body>

</html>
