<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OGCONS Study Hub - Pharmacology Notes</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #e8fff2,
            #e8f4ff,
            #f5eaff
        );

    color: #172033;

    line-height: 1.7;
}

header {

    background:
        linear-gradient(
            135deg,
            #18a058,
            #2eb7a0
        );

    color: white;

    padding: 30px 20px;

    text-align: center;
}

header h1 {

    margin-bottom: 8px;

    font-size: 28px;
}

.container {

    max-width: 900px;

    margin: auto;

    padding: 30px 20px;
}

.back {

    display: inline-block;

    margin-bottom: 20px;

    color: #18a058;

    font-weight: bold;

    text-decoration: none;
}

.back:hover {

    text-decoration: underline;
}

.note-card {

    background: white;

    border-radius: 18px;

    padding: 35px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);
}

.topic-title {

    text-align: center;

    margin-bottom: 30px;
}

.topic-title h2 {

    color: #18a058;

    font-size: 28px;

    margin-bottom: 10px;
}

.topic-title p {

    color: #68756d;
}

.note-section {

    margin-bottom: 28px;
}

.note-section h3 {

    color: #18a058;

    font-size: 21px;

    margin-bottom: 10px;

    border-left: 5px solid #18a058;

    padding-left: 12px;
}

.note-section h4 {

    color: #26382d;

    margin: 15px 0 8px;
}

.note-section p {

    margin-bottom: 12px;
}

.note-section ul,
.note-section ol {

    margin-left: 25px;

    margin-bottom: 15px;
}

.note-section li {

    margin-bottom: 7px;
}

.highlight {

    background: #e8fff2;

    border-left: 5px solid #18a058;

    padding: 15px;

    border-radius: 8px;

    margin: 15px 0;
}

.warning {

    background: #fff4e5;

    border-left: 5px solid #f59e0b;

    padding: 15px;

    border-radius: 8px;

    margin: 15px 0;
}

.navigation {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    margin-top: 30px;
}

.nav-btn {

    display: inline-block;

    padding: 13px 20px;

    border-radius: 10px;

    text-decoration: none;

    font-weight: bold;
}

.topic-btn {

    background: #6c757d;

    color: white;
}

.quiz-btn {

    background: #18a058;

    color: white;
}

#error {

    background: white;

    padding: 30px;

    border-radius: 18px;

    text-align: center;

    color: #dc3545;
}

footer {

    text-align: center;

    padding: 35px;

    color: #68756d;
}

@media(max-width:600px) {

    .note-card {

        padding: 22px;
    }

    .topic-title h2 {

        font-size: 23px;
    }

    .navigation {

        flex-direction: column;
    }

    .nav-btn {

        text-align: center;
    }
}

</style>

</head>

<body>

<header>

<h1>
💊 OGCONS Study Hub
</h1>

<p>
Pharmacology Notes
</p>

</header>


<div class="container">

<a
href="pharmacology.html"
class="back">

← Back to Pharmacology Topics

</a>


<div
id="error"
style="display:none;">

</div>


<div
class="note-card"
id="noteCard">


<div class="topic-title">

<h2 id="topicTitle">
Pharmacology
</h2>

<p>
Study Note
</p>

</div>


<div id="noteContent"></div>


<div class="navigation">

<a
href="pharmacology.html"
class="nav-btn topic-btn">

← All Topics

</a>

<a
id="quizLink"
href="#"
class="nav-btn quiz-btn">

📝 Take Quiz →

</a>

</div>


</div>

</div>


<footer>

OGCONS Study Hub © 2026

</footer>


<script>

const urlParams =
new URLSearchParams(
    window.location.search
);

const topic =
urlParams.get("topic");


const topicTitle =
document.getElementById(
    "topicTitle"
);

const noteContent =
document.getElementById(
    "noteContent"
);

const quizLink =
document.getElementById(
    "quizLink"
);

const error =
document.getElementById(
    "error"
);


if (!topic) {

    document
        .getElementById("noteCard")
        .style.display = "none";

    error.style.display = "block";

    error.innerHTML = `

        <h2>
        ⚠️ No Topic Selected
        </h2>

        <p style="margin-top:10px;">
        Please return to Pharmacology and
        select a topic.
        </p>

    `;

} else {

    topicTitle.textContent =
        topic;

    quizLink.href =
        "pharmacology-quiz.html?topic=" +
        encodeURIComponent(topic);

    loadNote(topic);

}


function loadNote(topic) {

    let html = "";


    // =========================================
    // INTRODUCTION
    // =========================================

    if (topic === "Introduction") {

        html = `

        <div class="note-section">

        <h3>Meaning of Pharmacology</h3>

        <p>

        Pharmacology is the scientific study of
        drugs and their effects on living organisms.
        It deals with the source, properties, actions,
        uses, side effects and fate of drugs in the body.

        </p>

        </div>


        <div class="note-section">

        <h3>What is a Drug?</h3>

        <p>

        A drug is a substance that is used to prevent,
        diagnose, treat or relieve disease or abnormal
        conditions in the body.

        </p>

        <div class="highlight">

        <strong>Remember:</strong>

        A drug can produce a desired therapeutic effect,
        but it may also produce unwanted effects.

        </div>

        </div>


        <div class="note-section">

        <h3>Branches of Pharmacology</h3>

        <ul>

        <li>
        <strong>Pharmacokinetics:</strong>
        What the body does to the drug.
        </li>

        <li>
        <strong>Pharmacodynamics:</strong>
        What the drug does to the body.
        </li>

        <li>
        <strong>Pharmacotherapeutics:</strong>
        Use of drugs in the prevention and treatment of disease.
        </li>

        <li>
        <strong>Toxicology:</strong>
        Study of harmful effects of chemicals and drugs.
        </li>

        </ul>

        </div>


        <div class="note-section">

        <h3>Importance of Pharmacology to Nursing</h3>

        <ul>

        <li>Safe administration of medicines.</li>

        <li>Recognition of adverse drug reactions.</li>

        <li>Patient education about medications.</li>

        <li>Monitoring therapeutic effects.</li>

        <li>Prevention of medication errors.</li>

        </ul>

        </div>

        `;

    }


    // =========================================
    // SOURCES AND CLASSIFICATION
    // =========================================

    else if (
        topic ===
        "Sources and Classification of Drugs"
    ) {

        html = `

        <div class="note-section">

        <h3>Sources of Drugs</h3>

        <p>
        Drugs can be obtained from natural sources
        or produced synthetically.
        </p>

        <h4>1. Plant Sources</h4>

        <p>
        Some drugs are obtained from plants.
        Examples include digitalis and some alkaloids.
        </p>

        <h4>2. Animal Sources</h4>

        <p>
        Some medicinal substances are obtained from
        animals or animal products.
        </p>

        <h4>3. Mineral Sources</h4>

        <p>
        Some drugs and medicinal substances come
        from minerals.
        </p>

        <h4>4. Microorganisms</h4>

        <p>
        Some drugs, especially certain antibiotics,
        are obtained from microorganisms.
        </p>

        <h4>5. Synthetic Sources</h4>

        <p>
        Drugs can be manufactured through chemical
        synthesis in laboratories.
        </p>

        <h4>6. Semi-synthetic Sources</h4>

        <p>
        These drugs are produced by chemically
        modifying naturally occurring substances.
        </p>

        </div>


        <div class="note-section">

        <h3>Classification of Drugs</h3>

        <p>
        Drugs may be classified according to different
        criteria.
        </p>

        <ul>

        <li>
        Classification according to source.
        </li>

        <li>
        Classification according to therapeutic use.
        </li>

        <li>
        Classification according to pharmacological action.
        </li>

        <li>
        Classification according to chemical structure.
        </li>

        <li>
        Classification according to body system affected.
        </li>

        </ul>

        </div>

        `;

    }


    // =========================================
    // PREPARATION OF DRUGS
    // =========================================

    else if (
        topic === "Preparation of Drugs"
    ) {

        html = `

        <div class="note-section">

        <h3>Meaning</h3>

        <p>

        Drug preparation refers to the physical form
        in which a drug is produced and supplied for
        administration to a patient.

        </p>

        </div>


        <div class="note-section">

        <h3>Common Drug Preparations</h3>

        <h4>Tablets</h4>

        <p>
        Solid preparations intended to be swallowed
        or used through other appropriate routes.
        </p>

        <h4>Capsules</h4>

        <p>
        Drugs enclosed in a soluble shell.
        </p>

        <h4>Solutions</h4>

        <p>
        Liquid preparations in which the drug is
        completely dissolved.
        </p>

        <h4>Suspensions</h4>

        <p>
        Liquid preparations containing finely divided
        drug particles that are not completely dissolved.
        </p>

        <h4>Syrups</h4>

        <p>
        Sweetened liquid preparations containing
        medicinal substances.
        </p>

        <h4>Injections</h4>

        <p>
        Sterile preparations administered by injection,
        such as intravenous, intramuscular or subcutaneous
        routes.
        </p>

        <h4>Creams and Ointments</h4>

        <p>
        Semi-solid preparations usually applied to
        the skin or other appropriate surfaces.
        </p>

        </div>


        <div class="warning">

        <strong>Nursing point:</strong>

        Always check the drug name, strength,
        formulation, expiry date and prescribed dose
        before administration.

        </div>

        `;

    }


    // =========================================
    // ROUTES
    // =========================================

    else if (
        topic ===
        "Routes of Drug Administration"
    ) {

        html = `

        <div class="note-section">

        <h3>Meaning</h3>

        <p>

        The route of drug administration is the path
        through which a drug is introduced into the body.

        </p>

        </div>


        <div class="note-section">

        <h3>Enteral Routes</h3>

        <ul>

        <li>
        <strong>Oral:</strong>
        Drug is swallowed and absorbed through the
        gastrointestinal tract.
        </li>

        <li>
        <strong>Sublingual:</strong>
        Drug is placed under the tongue.
        </li>

        <li>
        <strong>Rectal:</strong>
        Drug is administered through the rectum.
        </li>

        </ul>

        </div>


        <div class="note-section">

        <h3>Parenteral Routes</h3>

        <ul>

        <li>
        <strong>Intravenous (IV):</strong>
        Drug is administered directly into a vein.
        </li>

        <li>
        <strong>Intramuscular (IM):</strong>
        Drug is injected into a muscle.
        </li>

        <li>
        <strong>Subcutaneous (SC):</strong>
        Drug is injected into the tissue beneath the skin.
        </li>

        <li>
        <strong>Intradermal:</strong>
        Drug is injected into the dermis.
        </li>

        </ul>

        </div>


        <div class="note-section">

        <h3>Other Routes</h3>

        <ul>

        <li>Topical</li>

        <li>Transdermal</li>

        <li>Inhalational</li>

        <li>Ophthalmic</li>

        <li>Otic</li>

        <li>Nasal</li>

        <li>Vaginal</li>

        </ul>

        </div>

        `;

    }


    // =========================================
    // MECHANISM
    // =========================================

    else if (
        topic ===
        "Mechanism of Drug Action"
    ) {

        html = `

        <div class="note-section">

        <h3>Meaning</h3>

        <p>

        Mechanism of drug action refers to the way
        a drug produces its effect in the body.

        </p>

        </div>


        <div class="note-section">

        <h3>Drug Receptors</h3>

        <p>

        Many drugs produce their effects by binding
        to specific receptors on or inside cells.

        </p>

        <div class="highlight">

        Drug + Receptor → Drug-Receptor Interaction → Biological Effect

        </div>

        </div>


        <div class="note-section">

        <h3>Agonists</h3>

        <p>

        An agonist is a drug that binds to a receptor
        and activates it to produce a response.

        </p>

        </div>


        <div class="note-section">

        <h3>Antagonists</h3>

        <p>

        An antagonist binds to a receptor and prevents
        or reduces the action of an agonist or another
        substance.

        </p>

        </div>


        <div class="note-section">

        <h3>Other Mechanisms</h3>

        <ul>

        <li>
        Enzyme inhibition
        </li>

        <li>
        Ion channel modification
        </li>

        <li>
        Transporter inhibition
        </li>

        <li>
        Alteration of cell membrane function
        </li>

        </ul>

        </div>

        `;

    }


    // =========================================
    // NATIONAL DRUG POLICY
    // =========================================

    else if (
        topic === "National Drug Policy"
    ) {

        html = `

        <div class="note-section">

        <h3>Meaning</h3>

        <p>

        A national drug policy is a framework developed
        by a country to guide the availability, quality,
        safety, affordability and rational use of medicines.

        </p>

        </div>


        <div class="note-section">

        <h3>Importance</h3>

        <ul>

        <li>
        Promotes access to essential medicines.
        </li>

        <li>
        Promotes safe and effective use of medicines.
        </li>

        <li>
        Helps maintain medicine quality.
        </li>

        <li>
        Encourages rational prescribing and use.
        </li>

        <li>
        Helps reduce inappropriate use of medicines.
        </li>

        </ul>

        </div>


        <div class="note-section">

        <h3>Essential Medicines</h3>

        <p>

        Essential medicines are medicines that satisfy
        the priority health-care needs of a population.

        </p>

        </div>

        `;

    }


    // =========================================
    // OTHER HEALTH CONDITIONS
    // =========================================

    else if (
        topic ===
        "Drugs Used in Management of Other Health Conditions"
    ) {

        html = `

        <div class="note-section">

        <h3>Introduction</h3>

        <p>

        Different health conditions require different
        groups of medicines. The choice of drug depends
        on the patient's condition, diagnosis, age,
        allergies, other medicines and other clinical factors.

        </p>

        </div>


        <div class="note-section">

        <h3>Examples of Drug Groups</h3>

        <ul>

        <li>
        <strong>Analgesics:</strong>
        Used to relieve pain.
        </li>

        <li>
        <strong>Antipyretics:</strong>
        Used to reduce fever.
        </li>

        <li>
        <strong>Antibiotics:</strong>
        Used to treat susceptible bacterial infections.
        </li>

        <li>
        <strong>Antihypertensives:</strong>
        Used in the management of hypertension.
        </li>

        <li>
        <strong>Antidiabetic drugs:</strong>
        Used in the management of diabetes.
        </li>

        <li>
        <strong>Anti-inflammatory drugs:</strong>
        Used to reduce inflammation in appropriate conditions.
        </li>

        </ul>

        </div>


        <div class="warning">

        Drug selection and dosing should be based on
        the patient's prescription and appropriate
        clinical guidance.

        </div>

        `;

    }


    // =========================================
    // PATIENT EDUCATION
    // =========================================

    else if (
        topic ===
        "Patient Education and Counseling"
    ) {

        html = `

        <div class="note-section">

        <h3>Meaning</h3>

        <p>

        Patient education and counseling involve providing
        patients with understandable information about
        their medicines so that they can use them safely
        and effectively.

        </p>

        </div>


        <div class="note-section">

        <h3>Important Information to Explain</h3>

        <ul>

        <li>
        Name of the medicine.
        </li>

        <li>
        Purpose of the medicine.
        </li>

        <li>
        Dose and frequency.
        </li>

        <li>
        Route of administration.
        </li>

        <li>
        Duration of treatment.
        </li>

        <li>
        Important side effects.
        </li>

        <li>
        Important precautions.
        </li>

        <li>
        What to do if a dose is missed.
        </li>

        </ul>

        </div>


        <div class="note-section">

        <h3>Nurse's Role</h3>

        <ul>

        <li>
        Explain medication instructions clearly.
        </li>

        <li>
        Check the patient's understanding.
        </li>

        <li>
        Encourage adherence to the prescribed regimen.
        </li>

        <li>
        Teach appropriate storage where relevant.
        </li>

        <li>
        Encourage patients to report significant
        or unexpected reactions.
        </li>

        </ul>

        </div>

        `;

    }


    // =========================================
    // UNKNOWN TOPIC
    // =========================================

    else {

        html = `

        <div class="note-section">

        <h3>
        Topic Not Found
        </h3>

        <p>

        Notes for this topic have not been added yet.

        </p>

        </div>

        `;

    }


    noteContent.innerHTML =
        html;

}

</script>

</body>

</html>
