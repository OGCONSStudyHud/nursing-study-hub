<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Foundations of Nursing</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #e8fff2,
                    #e8f4ff,
                    #f5eaff
                );

            color: #163020;
        }

        header {
            background:
                linear-gradient(
                    135deg,
                    #18a058,
                    #2eb7a0
                );

            color: white;

            padding: 25px 20px;
        }

        .header-content {
            max-width: 1100px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }

        .logo {
            font-size: 23px;

            font-weight: bold;
        }

        .back-button {
            border: none;

            background: white;

            color: #18a058;

            padding: 10px 18px;

            border-radius: 20px;

            font-weight: bold;

            cursor: pointer;
        }

        .back-button:hover {
            background: #f0f0f0;
        }

        .container {
            max-width: 1100px;

            margin: auto;

            padding: 35px 20px;
        }

        .intro {
            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.08);

            margin-bottom: 30px;

            text-align: center;
        }

        .intro-icon {
            font-size: 50px;

            margin-bottom: 10px;
        }

        .intro h1 {
            font-size: 30px;

            margin-bottom: 10px;

            color: #18a058;
        }

        .intro p {
            color: #617568;

            line-height: 1.6;

            max-width: 750px;

            margin: auto;
        }

        .section-title {
            font-size: 24px;

            margin-bottom: 20px;
        }

        .topics {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .topic-card {
            background: white;

            padding: 22px;

            border-radius: 16px;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.07);

            display: flex;

            align-items: center;

            gap: 18px;

            transition: 0.2s;
        }

        .topic-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(0,0,0,0.10);
        }

        .topic-number {
            min-width: 45px;

            height: 45px;

            border-radius: 50%;

            background: #e5f8ed;

            color: #18a058;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 17px;
        }

        .topic-content {
            flex: 1;
        }

        .topic-content h3 {
            font-size: 17px;

            margin-bottom: 6px;

            line-height: 1.4;
        }

        .topic-content p {
            color: #718077;

            font-size: 13px;

            line-height: 1.4;
        }

        .open-topic {
            border: none;

            background: #18a058;

            color: white;

            padding: 10px 15px;

            border-radius: 18px;

            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;
        }

        .open-topic:hover {
            background: #117d45;
        }

        footer {
            text-align: center;

            padding: 30px 20px;

            color: #718077;

            font-size: 14px;
        }

        @media (max-width: 750px) {

            .header-content {
                flex-direction: column;

                text-align: center;
            }

            .topics {
                grid-template-columns: 1fr;
            }

            .topic-card {
                align-items: flex-start;
            }

            .open-topic {
                padding: 9px 12px;

                font-size: 13px;
            }

            .intro h1 {
                font-size: 25px;
            }

        }

        @media (max-width: 500px) {

            .topic-card {
                flex-wrap: wrap;
            }

            .open-topic {
                width: 100%;

                margin-top: 5px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="logo">
            🩺 OGCONS Study Hub
        </div>

        <button
            class="back-button"
            onclick="goBack()">

            ← Back to Dashboard

        </button>

    </div>

</header>


<div class="container">


    <div class="intro">

        <div class="intro-icon">
            📚
        </div>

        <h1>
            Foundations of Nursing
        </h1>

        <p>

            Study the fundamental principles,
            skills, procedures and professional
            responsibilities that form the foundation
            of nursing practice.

        </p>

    </div>


    <h2 class="section-title">

        📖 Course Topics

    </h2>


    <div
        class="topics"
        id="topicsContainer">

    </div>


</div>


<footer>

    OGCONS Study Hub © 2026

</footer>


<script>


const topics = [

    {
        number: 1,

        name: "Introduction to Nursing",

        description:
            "Basic concepts, history, roles and functions of nursing."
    },

    {
        number: 2,

        name: "Health Care Institutions",

        description:
            "Types, organization and functions of healthcare institutions."
    },

    {
        number: 3,

        name: "Ethico-Legal Issues in Nursing",

        description:
            "Ethical principles and legal responsibilities in nursing practice."
    },

    {
        number: 4,

        name: "Tools of Nursing",

        description:
            "Common tools and equipment used in nursing practice."
    },

    {
        number: 5,

        name: "Comfort and Safety Measures",

        description:
            "Measures used to promote patient comfort and maintain safety."
    },

    {
        number: 6,

        name: "Emergency Care",

        description:
            "Basic principles of responding to emergencies and critically ill patients."
    },

    {
        number: 7,

        name: "Administration of Drugs",

        description:
            "Basic principles and safe practices involved in medication administration."
    },

    {
        number: 8,

        name: "Diagnostic Investigation",

        description:
            "Basic investigations used to assess and diagnose patients."
    },

    {
        number: 9,

        name: "Aseptic Techniques",

        description:
            "Principles and practices used to prevent contamination and infection."
    },

    {
        number: 10,

        name: "Unsafe Injection Safety",

        description:
            "Safe injection practices and prevention of injection-related infections."
    },

    {
        number: 11,

        name: "Introduction to Healthcare Waste",

        description:
            "Types, handling, disposal and safety principles of healthcare waste."
    },

    {
        number: 12,

        name: "Legal Aspects of Nursing",

        description:
            "Legal responsibilities, accountability and professional nursing practice."
    },

    {
        number: 13,

        name: "Nursing Care of Patients with Feeding/Elimination Problems",

        description:
            "Nursing care for patients experiencing feeding and elimination problems."
    },

    {
        number: 14,

        name: "Basic Life Support",

        description:
            "Fundamental life-saving measures for patients in cardiac or respiratory emergencies."
    }

];


function displayTopics() {

    const container =
        document.getElementById(
            "topicsContainer"
        );

    container.innerHTML = "";


    topics.forEach(function(topic) {

        const card =
            document.createElement("div");

        card.className =
            "topic-card";


        card.innerHTML = `

            <div class="topic-number">

                ${topic.number}

            </div>

            <div class="topic-content">

                <h3>
                    ${escapeHTML(topic.name)}
                </h3>

                <p>
                    ${escapeHTML(topic.description)}
                </p>

            </div>

            <button
                class="open-topic"
                onclick='openTopic(${JSON.stringify(topic.name)})'>

                Open →

            </button>

        `;


        container.appendChild(card);

    });

}


function openTopic(topicName) {

    const url =
        "fon-note.html?topic=" +
        encodeURIComponent(topicName);


    window.location.href =
        url;

}


function goBack() {

    window.location.href =
        "dashboard.html";

}


function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


displayTopics();


</script>


</body>

</html>
