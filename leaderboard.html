<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Leaderboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #e8fff2,
                    #e8f4ff,
                    #f5eaff
                );

            color: #163020;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background:
                linear-gradient(
                    135deg,
                    #18a058,
                    #2eb7a0
                );

            color: white;

            padding: 30px 20px;

            text-align: center;

        }


        header h1 {

            font-size: 30px;

            margin-bottom: 8px;

        }


        header p {

            font-size: 16px;

            opacity: 0.95;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            max-width: 900px;

            margin: auto;

            padding: 30px 20px;

        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {

            display: inline-block;

            color: #18a058;

            text-decoration: none;

            font-weight: bold;

            margin-bottom: 25px;

        }


        .back:hover {

            text-decoration: underline;

        }


        /* =========================
           INFO CARD
        ========================= */

        .info-card {

            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.08);

            text-align: center;

            margin-bottom: 25px;

        }


        .info-card h2 {

            margin-bottom: 10px;

        }


        .info-card p {

            color: #617568;

            line-height: 1.5;

        }


        /* =========================
           MY POSITION
        ========================= */

        .my-position {

            background:
                linear-gradient(
                    135deg,
                    #18a058,
                    #2eb7a0
                );

            color: white;

            padding: 22px;

            border-radius: 18px;

            margin-bottom: 25px;

            text-align: center;

            box-shadow:
                0 8px 20px
                rgba(24,160,88,0.25);

        }


        .my-position h2 {

            margin-bottom: 8px;

        }


        .my-position .score {

            font-size: 32px;

            font-weight: bold;

            margin: 8px 0;

        }


        /* =========================
           LEADERBOARD
        ========================= */

        .leaderboard {

            background: white;

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.08);

        }


        .leaderboard-title {

            font-size: 22px;

            margin-bottom: 20px;

        }


        /* =========================
           ROW
        ========================= */

        .student-row {

            display: grid;

            grid-template-columns:
                80px 1fr 120px;

            align-items: center;

            gap: 15px;

            padding: 18px;

            border-bottom:
                1px solid #edf0f2;

            transition: 0.2s;

        }


        .student-row:last-child {

            border-bottom: none;

        }


        .student-row:hover {

            background: #f8fffb;

        }


        /* =========================
           CURRENT USER
        ========================= */

        .student-row.you {

            background: #e8fff2;

            border-radius: 12px;

            border: 2px solid #18a058;

        }


        /* =========================
           RANK
        ========================= */

        .rank {

            font-size: 22px;

            font-weight: bold;

            text-align: center;

        }


        /* =========================
           STUDENT
        ========================= */

        .student-name {

            font-weight: bold;

            font-size: 16px;

        }


        .you-label {

            display: inline-block;

            background: #18a058;

            color: white;

            padding: 4px 8px;

            border-radius: 10px;

            font-size: 11px;

            margin-left: 6px;

        }


        /* =========================
           SCORE
        ========================= */

        .score {

            text-align: right;

            font-weight: bold;

            color: #18a058;

            font-size: 18px;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 50px 20px;

            color: #617568;

        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #617568;

        }


        /* =========================
           ERROR
        ========================= */

        .error {

            text-align: center;

            padding: 40px 20px;

            color: #dc3545;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .student-row {

                grid-template-columns:
                    55px 1fr 80px;

                gap: 8px;

                padding: 15px 10px;

            }


            .rank {

                font-size: 18px;

            }


            .student-name {

                font-size: 14px;

            }


            .score {

                font-size: 15px;

            }


            .you-label {

                display: block;

                width: fit-content;

                margin-left: 0;

                margin-top: 4px;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        🏆 OGCONS Study Hub
    </h1>

    <p>
        Student Leaderboard
    </p>

</header>



<div class="container">


    <a
        href="dashboard.html"
        class="back">

        ← Back to Dashboard

    </a>



    <!-- =========================
         INFORMATION
    ========================= -->

    <div class="info-card">

        <h2>
            🏆 Class Leaderboard
        </h2>

        <p>

            See how you rank among other
            students based on your quiz
            performance.

            Student names are hidden
            for privacy.

        </p>

    </div>



    <!-- =========================
         MY POSITION
    ========================= -->

    <div
        id="myPosition"
        class="my-position"
        style="display:none;">

        <h2>
            🎯 Your Position
        </h2>

        <div
            id="myRank"
            class="score">

            -

        </div>

        <p>
            Keep studying and improve your score!
        </p>

    </div>



    <!-- =========================
         LEADERBOARD
    ========================= -->

    <div class="leaderboard">

        <h2 class="leaderboard-title">

            📊 Rankings

        </h2>


        <div
            id="leaderboardList">

            <div class="loading">

                Loading leaderboard...

            </div>

        </div>

    </div>


</div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );



// =====================================================
// GET CURRENT USER
// =====================================================

async function getCurrentUser() {

    const {

        data: {
            user

        },

        error

    } =
        await supabaseClient
            .auth
            .getUser();


    if (error || !user) {

        window.location.href =
            "index.html";

        return null;

    }


    return user;

}



// =====================================================
// LOAD LEADERBOARD
// =====================================================

async function loadLeaderboard() {


    const list =
        document.getElementById(
            "leaderboardList"
        );


    const myPosition =
        document.getElementById(
            "myPosition"
        );


    const myRank =
        document.getElementById(
            "myRank"
        );



    const user =
        await getCurrentUser();


    if (!user) {

        return;

    }



    // =================================================
    // GET QUIZ RESULTS
    // =================================================

    const {

        data,
        error

    } =
        await supabaseClient

            .from("quiz_results")

            .select(
                "user_id, percentage"
            );



    if (error) {

        console.error(
            "Leaderboard error:",
            error
        );


        list.innerHTML = `

            <div class="error">

                ❌ Unable to load leaderboard.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }



    const results =
        data || [];



    // =================================================
    // NO RESULTS
    // =================================================

    if (
        results.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                📭 No quiz results yet.

                <br><br>

                Complete a quiz to appear
                on the leaderboard.

            </div>

        `;

        return;

    }



    // =================================================
    // CALCULATE STUDENT AVERAGES
    // =================================================

    const students = {};



    results.forEach(
        function(result) {

            const userId =
                result.user_id;


            const percentage =
                Number(
                    result.percentage || 0
                );


            if (
                !students[userId]
            ) {

                students[userId] = {

                    total: 0,

                    quizzes: 0

                };

            }


            students[userId].total +=
                percentage;


            students[userId].quizzes++;

        }
    );



    // =================================================
    // CREATE RANKING
    // =================================================

    const ranking =

        Object.keys(students)

            .map(
                function(userId) {

                    const average =

                        students[userId].total /
                        students[userId].quizzes;


                    return {

                        userId:
                            userId,

                        average:
                            Math.round(
                                average
                            ),

                        quizzes:
                            students[userId].quizzes

                    };

                }
            )

            .sort(
                function(a, b) {

                    return b.average -
                        a.average;

                }
            );



    // =================================================
    // FIND CURRENT USER
    // =================================================

    const currentIndex =
        ranking.findIndex(
            function(student) {

                return String(
                    student.userId
                ) === String(
                    user.id
                );

            }
        );



    if (
        currentIndex !== -1
    ) {

        myPosition.style.display =
            "block";


        myRank.textContent =

            "Rank #" +
            (
                currentIndex + 1
            ) +
            " • " +
            ranking[currentIndex].average +
            "%";

    }



    // =================================================
    // DISPLAY LEADERBOARD
    // =================================================

    list.innerHTML = "";



    ranking.forEach(
        function(student, index) {

            const rank =
                index + 1;


            const isYou =
                String(
                    student.userId
                ) === String(
                    user.id
                );



            let rankDisplay;


            if (rank === 1) {

                rankDisplay = "🥇";

            }

            else if (rank === 2) {

                rankDisplay = "🥈";

            }

            else if (rank === 3) {

                rankDisplay = "🥉";

            }

            else {

                rankDisplay =
                    "#" + rank;

            }



            // Anonymous student number
            const studentNumber =
                String(rank)
                    .padStart(
                        3,
                        "0"
                    );



            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "student-row" +
                (
                    isYou
                        ? " you"
                        : ""
                );



            row.innerHTML = `

                <div class="rank">

                    ${rankDisplay}

                </div>


                <div class="student-name">

                    Student #${studentNumber}

                    ${
                        isYou
                            ? `
                                <span class="you-label">
                                    YOU
                                </span>
                              `
                            : ""
                    }

                </div>


                <div class="score">

                    ${student.average}%

                </div>

            `;



            list.appendChild(
                row
            );

        }
    );

}



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// =====================================================
// START
// =====================================================

loadLeaderboard();


</script>


</body>

</html>
