<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OGCONS Study Hub - Foundations of Nursing</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: linear-gradient(
                135deg,
                #0066cc,
                #00a86b
            );

            color: white;

            padding: 18px 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;

            font-size: 22px;
        }

        .back-btn {
            background: white;

            color: #0066cc;

            border: none;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;

            max-width: 1000px;

            margin: auto;

            padding: 25px 20px 50px;
        }

        /* =========================
           NOTE CARD
        ========================= */

        .note-card {
            background: white;

            border-radius: 14px;

            padding: 30px;

            box-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }

        .course-name {
            color: #00a86b;

            font-size: 15px;

            font-weight: bold;

            text-transform: uppercase;

            margin-bottom: 8px;
        }

        .topic-name {
            color: #667085;

            font-size: 15px;

            margin-bottom: 18px;
        }

        .note-title {
            font-size: 28px;

            margin: 0 0 25px;

            color: #111827;

            line-height: 1.25;
        }

        /* =========================
           NOTE CONTENT
        ========================= */

        .note-content {
            width: 100%;

            max-width: 100%;

            overflow-x: hidden;

            overflow-wrap: anywhere;

            word-wrap: break-word;

            line-height: 1.6;

            font-size: 16px;
        }

        .note-content img {
            max-width: 100% !important;

            width: auto;

            height: auto !important;

            display: block;

            margin: 15px auto;

            object-fit: contain;
        }

        .note-content table {
            width: 100% !important;

            max-width: 100% !important;

            border-collapse: collapse;

            margin: 15px 0;

            display: table;

            table-layout: fixed;

            overflow-wrap: anywhere;
        }

        .note-content td,
        .note-content th {
            border: 1px solid #ccc;

            padding: 8px;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .note-content iframe,
        .note-content video {
            max-width: 100% !important;

            height: auto;
        }

        .note-content pre {
            max-width: 100%;

            overflow-x: auto;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .note-content blockquote {
            border-left: 4px solid #0066cc;

            margin: 15px 0;

            padding: 10px 15px;

            background: #f5f8fc;
        }

        .note-content hr {
            border: none;

            border-top: 1px solid #ddd;

            margin: 25px 0;
        }

        /* =========================
           RESPONSIVE CANVAS
        ========================= */

        .ogcons-note-canvas {

            position: relative;

            width: 100% !important;

            max-width: 100% !important;

            box-sizing: border-box;

            overflow: visible;

            min-height: 0;

        }

        .ogcons-note-canvas img {

            max-width: 100% !important;

            height: auto !important;

        }

        .ogcons-note-canvas .image-object {

            position: absolute;

            max-width: 100%;

            box-sizing: border-box;

        }

        .ogcons-note-canvas .image-object img {

            width: 100% !important;

            max-width: 100% !important;

            height: auto !important;

            display: block;

        }

        .ogcons-note-canvas .text-object {

            position: absolute;

            max-width: 90%;

            box-sizing: border-box;

            overflow-wrap: anywhere;

            word-break: break-word;

        }

        .ogcons-note-canvas .shape-object {

            position: absolute;

            box-sizing: border-box;

        }

        .ogcons-note-canvas .object-controls,
        .ogcons-note-canvas .resize-handle,
        .ogcons-note-canvas .rotation-handle,
        .ogcons-note-canvas .rotation-line {

            display: none !important;

        }

        .ogcons-note-canvas table {

            max-width: 100% !important;

            width: 100% !important;

            border-collapse: collapse;

        }

        /* =========================
           STATUS
        ========================= */

        .loading {
            text-align: center;

            padding: 50px 20px;

            color: #667085;

            font-size: 16px;
        }

        .error {
            background: #fdecec;

            color: #a4161a;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;
        }

        .empty {
            text-align: center;

            padding: 50px 20px;

            color: #667085;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 18px;
            }

            .container {
                padding: 12px;
            }

            .note-card {
                padding: 18px;

                border-radius: 10px;
            }

            .note-title {
                font-size: 23px;

                margin-bottom: 20px;
            }

            .note-content {
                font-size: 15px;

                line-height: 1.55;

                width: 100%;

                max-width: 100%;

                overflow-x: hidden;
            }

            .note-content img {

                max-width: 100% !important;

                width: auto !important;

                height: auto !important;

                margin: 12px auto;

            }

            .note-content table {

                width: 100% !important;

                max-width: 100% !important;

                table-layout: fixed;

                font-size: 13px;

            }

            .note-content td,
            .note-content th {

                padding: 6px;

                word-break: break-word;

            }

            .ogcons-note-canvas {

                width: 100% !important;

                max-width: 100% !important;

            }

            .ogcons-note-canvas .text-object {

                max-width: 92% !important;

            }

            .ogcons-note-canvas .image-object {

                max-width: 100% !important;

            }

            .ogcons-note-canvas .image-object img {

                max-width: 100% !important;

                height: auto !important;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        OGCONS Study Hub
    </h1>

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← Back to Topics
    </button>

</header>


<div class="container">

    <div class="note-card">

        <div
            id="courseName"
            class="course-name"
        >
            FOUNDATIONS OF NURSING
        </div>

        <div
            id="topicName"
            class="topic-name"
        >
            Loading topic...
        </div>

        <h2
            id="noteTitle"
            class="note-title"
        >
            Loading note...
        </h2>

        <div
            id="noteContent"
            class="note-content"
        >

            <div class="loading">
                Loading note...
            </div>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        "https://bvetmmvpdotifusjkywd.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =====================================================
       COURSE
    ===================================================== */

    const COURSE =
        "Foundations of Nursing";


    /* =====================================================
       GET TOPIC FROM URL
    ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const selectedTopic =
        params.get("topic") || "";


    /* =====================================================
       NORMALIZE TEXT
    ===================================================== */

    function normalize(value) {

        return String(value || "")
            .trim()
            .replace(/\s+/g, " ")
            .toLowerCase();

    }


    /* =====================================================
       DISPLAY TOPIC
    ===================================================== */

    document.getElementById(
        "topicName"
    ).textContent =
        selectedTopic ||
        "Topic";


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    function goBack() {

        window.location.href =
            "foundations-topics.html";

    }


    /* =====================================================
       LOAD NOTE
    ===================================================== */

    async function loadNote() {

        const contentElement =
            document.getElementById(
                "noteContent"
            );

        try {

            if (!selectedTopic) {

                contentElement.innerHTML = `
                    <div class="error">
                        No topic was selected.
                    </div>
                `;

                return;

            }


            /*
                Load all Foundations of Nursing
                notes.

                We match the topic ourselves so
                spacing/capitalization differences
                do not cause a failure.
            */

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("notes")
                    .select(
                        "course, topic, title, content"
                    )
                    .eq(
                        "course",
                        COURSE
                    );


            if (error) {

                throw error;

            }


            const notes =
                data || [];


            const selectedNote =
                notes.find(
                    function(note) {

                        return (
                            normalize(
                                note.topic
                            ) ===
                            normalize(
                                selectedTopic
                            )
                        );

                    }
                );


            if (!selectedNote) {

                document.getElementById(
                    "noteTitle"
                ).textContent =
                    "Note Not Found";


                contentElement.innerHTML = `
                    <div class="empty">
                        <p>
                            No note has been added for this topic yet.
                        </p>
                    </div>
                `;

                return;

            }


            /* =========================
               TITLE
            ========================= */

            document.getElementById(
                "noteTitle"
            ).textContent =
                selectedNote.title ||
                selectedTopic;


            /* =========================
               TOPIC
            ========================= */

            document.getElementById(
                "topicName"
            ).textContent =
                selectedNote.topic;


            /* =================================================
               IMPORTANT FIX
               
               DO NOT USE escapeHTML() HERE.

               The Admin Notes page saves formatted HTML.

               innerHTML allows the student's browser to
               render the formatting, images, text boxes,
               tables, headings, etc.
            ================================================= */

            contentElement.innerHTML =
                selectedNote.content ||
                "<p>No content available.</p>";


            /*
                Make images responsive after loading.
            */

            const images =
                contentElement.querySelectorAll(
                    "img"
                );


            images.forEach(
                function(img) {

                    img.style.maxWidth =
                        "100%";

                    img.style.height =
                        "auto";

                }
            );


            /*
                Make tables responsive.
            */

            const tables =
                contentElement.querySelectorAll(
                    "table"
                );


            tables.forEach(
                function(table) {

                    table.style.maxWidth =
                        "100%";

                    table.style.width =
                        "100%";

                }
            );

        }
        catch(error) {

            console.error(
                "Error loading note:",
                error
            );


            contentElement.innerHTML = `

                <div class="error">

                    Unable to load this note.

                    <br><br>

                    ${escapeText(
                        error.message
                    )}

                </div>

            `;

        }

    }


    /* =====================================================
       ESCAPE ONLY ERROR TEXT
       
       We DO NOT use this on note.content.
    ===================================================== */

    function escapeText(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;

    }


    /* =====================================================
       START
    ===================================================== */

    loadNote();

</script>


</body>

</html>
