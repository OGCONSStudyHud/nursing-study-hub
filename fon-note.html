// ======================================================
// 1. INTRODUCTION TO NURSING
// ======================================================

"Introduction to Nursing": `

    <h2>1. Meaning of Nursing</h2>

    <div class="definition">

        <strong>Nursing</strong> is the art and science of
        caring for individuals, families and communities
        to promote health, prevent illness, restore health,
        relieve suffering and help people achieve the best
        possible level of health.

    </div>


    <h2>2. Nature of Nursing</h2>

    <p>
        Nursing is both an art and a science. It involves
        scientific knowledge as well as skills, compassion,
        communication and professional judgment.
    </p>


    <h3>Important characteristics of nursing</h3>

    <ul>

        <li>It is a caring profession.</li>

        <li>It involves scientific knowledge and skills.</li>

        <li>It focuses on the individual as a whole.</li>

        <li>It promotes health and prevents illness.</li>

        <li>It involves teamwork with other healthcare professionals.</li>

        <li>It requires professional accountability.</li>

    </ul>


    <h2>3. Goals of Nursing</h2>

    <ul>

        <li>To promote health.</li>

        <li>To prevent diseases and complications.</li>

        <li>To restore health.</li>

        <li>To relieve pain and suffering.</li>

        <li>To assist patients in rehabilitation.</li>

        <li>To provide comfort and emotional support.</li>

        <li>To help patients achieve independence.</li>

    </ul>


    <h2>4. Roles of a Nurse</h2>

    <ul>

        <li><strong>Caregiver:</strong> Provides direct care to patients.</li>

        <li><strong>Educator:</strong> Teaches patients and families about health.</li>

        <li><strong>Advocate:</strong> Protects and speaks up for patients' rights.</li>

        <li><strong>Communicator:</strong> Maintains effective communication with patients and healthcare workers.</li>

        <li><strong>Collaborator:</strong> Works with other members of the healthcare team.</li>

        <li><strong>Counsellor:</strong> Provides emotional support and guidance.</li>

        <li><strong>Manager:</strong> Coordinates nursing care and resources.</li>

        <li><strong>Researcher:</strong> Uses evidence and participates in improving nursing practice.</li>

    </ul>


    <h2>5. Qualities of a Good Nurse</h2>

    <ul>

        <li>Compassion</li>

        <li>Patience</li>

        <li>Honesty</li>

        <li>Respect</li>

        <li>Good communication skills</li>

        <li>Observation skills</li>

        <li>Responsibility</li>

        <li>Emotional stability</li>

        <li>Confidentiality</li>

        <li>Professionalism</li>

    </ul>


    <div class="remember">

        <strong>Remember:</strong>
        Nursing is not only about treating illness.
        It also involves health promotion, disease prevention,
        comfort, rehabilitation and patient education.

    </div>

`,


// ======================================================
// 2. HEALTH CARE INSTITUTIONS
// ======================================================

"Health Care Institutions": `

    <h2>1. Meaning of Health Care Institution</h2>

    <div class="definition">

        A health care institution is an organized establishment
        where health services are provided to individuals,
        families and communities.

    </div>


    <h2>2. Examples of Health Care Institutions</h2>

    <ul>

        <li>Hospitals</li>

        <li>Primary Health Centres</li>

        <li>Health clinics</li>

        <li>Maternity centres</li>

        <li>Specialist hospitals</li>

        <li>Rehabilitation centres</li>

        <li>Long-term care facilities</li>

        <li>Laboratories</li>

        <li>Community health centres</li>

    </ul>


    <h2>3. Levels of Health Care</h2>


    <h3>Primary Health Care</h3>

    <p>
        Primary health care is the first level of contact
        between individuals and the healthcare system.
        It emphasizes health promotion, disease prevention,
        basic treatment and community participation.
    </p>


    <h3>Secondary Health Care</h3>

    <p>
        Secondary health care provides more specialized
        services, usually through general hospitals and
        specialist clinics.
    </p>


    <h3>Tertiary Health Care</h3>

    <p>
        Tertiary health care provides highly specialized
        services such as advanced surgery, intensive care
        and management of complex diseases.
    </p>


    <h2>4. Functions of Hospitals</h2>

    <ul>

        <li>Diagnosis and treatment of diseases.</li>

        <li>Emergency services.</li>

        <li>Surgical services.</li>

        <li>Maternity services.</li>

        <li>Health education.</li>

        <li>Training of healthcare professionals.</li>

        <li>Research.</li>

        <li>Rehabilitation.</li>

    </ul>


    <h2>5. Departments Commonly Found in Hospitals</h2>

    <ul>

        <li>Medical ward</li>

        <li>Surgical ward</li>

        <li>Paediatric ward</li>

        <li>Maternity ward</li>

        <li>Emergency department</li>

        <li>Pharmacy</li>

        <li>Laboratory</li>

        <li>Radiology</li>

        <li>Operating theatre</li>

        <li>Medical records department</li>

    </ul>


    <div class="remember">

        <strong>Remember:</strong>
        Primary care is the first level,
        secondary care provides specialized care,
        while tertiary care provides highly specialized care.

    </div>

`,


// ======================================================
// 3. ETHICO-LEGAL ISSUES
// ======================================================

"Ethico-Legal Issues in Nursing": `

    <h2>1. Meaning of Ethics</h2>

    <div class="definition">

        Ethics refers to principles that guide a person's
        conduct and help determine what is right or wrong.

    </div>


    <h2>2. Nursing Ethics</h2>

    <p>
        Nursing ethics refers to the moral principles and
        professional standards that guide nurses in their
        relationships with patients, colleagues and society.
    </p>


    <h2>3. Important Ethical Principles</h2>

    <h3>Autonomy</h3>

    <p>
        Respecting the patient's right to make informed
        decisions about their own healthcare.
    </p>


    <h3>Beneficence</h3>

    <p>
        The duty to do good and promote the welfare of
        the patient.
    </p>


    <h3>Non-maleficence</h3>

    <p>
        The duty to avoid causing harm to the patient.
    </p>


    <h3>Justice</h3>

    <p>
        Providing fair and equal treatment to patients.
    </p>


    <h3>Fidelity</h3>

    <p>
        Being faithful to professional responsibilities
        and promises.
    </p>


    <h3>Veracity</h3>

    <p>
        Telling the truth and providing accurate information.
    </p>


    <h3>Confidentiality</h3>

    <p>
        Protecting private information obtained from patients.
    </p>


    <h2>4. Ethical Problems in Nursing</h2>

    <ul>

        <li>Confidentiality violations.</li>

        <li>Informed consent issues.</li>

        <li>Patient refusal of treatment.</li>

        <li>End-of-life decisions.</li>

        <li>Patient privacy.</li>

        <li>Discrimination.</li>

        <li>Conflict between professional duties and patient wishes.</li>

    </ul>


    <div class="important">

        <strong>Important:</strong>
        A nurse must respect the patient's dignity,
        rights, privacy and confidentiality.

    </div>

`,

// ======================================================

// ======================================================

"Comfort and Safety Measures": `

    <h2>1. Meaning of Comfort</h2>

    <div class="definition">

        Comfort is a state in which a patient experiences
        physical, psychological and environmental well-being.

    </div>


    <h2>2. Measures for Patient Comfort</h2>

    <ul>

        <li>Proper positioning.</li>

        <li>Maintaining cleanliness.</li>

        <li>Providing clean and comfortable bedding.</li>

        <li>Managing pain.</li>

        <li>Providing adequate rest and sleep.</li>

        <li>Maintaining appropriate room temperature.</li>

        <li>Providing emotional support.</li>

        <li>Maintaining privacy.</li>

        <li>Good communication.</li>

    <h2>3. Patient Safety</h2>

    <h3>Common Safety Measures</h3>

// ======================================================
// 6. EMERGENCY CARE
// ======================================================

"Emergency Care": `

    <h2>1. Meaning of Emergency</h2>

    <div class="definition">

        An emergency is a sudden condition that requires

        death, permanent disability or serious complications.

    </div>


    <h2>2. Examples of Emergencies</h2>

    <ul>

        <li>Cardiac arrest</li>

        <li>Respiratory arrest</li>

        <li>Severe bleeding</li>

        <li>Shock</li>

        <li>Severe burns</li>

        <li>Poisoning</li>

        <li>Severe allergic reaction</li>

        <li>Unconsciousness</li>

        <li>Major trauma</li>

    <h2>3. General Principles of Emergency Care</h2>

        <li>Ensure safety of the scene.</li>

        <li>Assess the patient's responsiveness.</li>

        <li>Call for help.</li>

        <li>Assess airway.</li>

        <li>Assess breathing.</li>

        <li>Assess circulation.</li>

        <li>Control severe bleeding.</li>

        <li>Provide appropriate immediate care.</li>

        <li>Monitor the patient continuously.</li>

    <h2>4. Aims of Emergency Care</h2>

    <ul>

        <li>Preserve life.</li>

        <li>Prevent deterioration.</li>

        <li>Prevent disability.</li>

        <li>Relieve suffering.</li>

        <li>Promote recovery.</li>

    </ul>

`,


// ======================================================

"Administration of Drugs": `

    </div>


    <h2>2. Common Routes of Drug Administration</h2>

    <ul>

    <h2>3. Rights of Medication Administration</h2>

    <ul>

// ======================================================

"Aseptic Techniques": `

    <h2>1. Meaning of Asepsis</h2>

    <div class="definition">

        Asepsis refers to practices used to prevent the
        introduction and spread of microorganisms that can
        cause infection.

    </div>


    <h2>2. Types of Aseptic Technique</h2>

    <h3>Medical Asepsis</h3>

    <p>
        Medical asepsis refers to practices that reduce
        the number and spread of microorganisms.
    </p>


    <h3>Surgical Asepsis</h3>

    <p>
        Surgical asepsis, also called sterile technique,
        aims to eliminate microorganisms from an area,
        object or procedure where sterility is required.
    </p>


    <h2>3. Principles of Aseptic Technique</h2>

    <ul>

        <li>Perform proper hand hygiene.</li>

        <li>Use appropriate personal protective equipment.</li>

        <li>Maintain a clean environment.</li>

        <li>Use sterile equipment when required.</li>

        <li>Do not touch sterile items with contaminated hands.</li>

        <li>Keep sterile fields within view.</li>

        <li>Avoid reaching over sterile fields.</li>

        <li>Dispose of contaminated materials correctly.</li>

    </ul>


    <h2>4. Importance</h2>

    <ul>

        <li>Prevents healthcare-associated infections.</li>

        <li>Protects patients.</li>

        <li>Protects healthcare workers.</li>

        <li>Reduces cross-infection.</li>

        <li>Promotes safe nursing procedures.</li>

    </ul>

// 10. UNSAFE INJECTION SAFETY
// ======================================================

"Unsafe Injection Safety": `

    <h2>1. Meaning of Injection Safety</h2>

    <div class="definition">

        Injection safety refers to practices that ensure
        injections are prepared and administered in a way
        that prevents harm, contamination and transmission
        of infection.

    </div>


    <h2>2. Unsafe Injection Practices</h2>

    <ul>

        <li>Reusing needles.</li>

        <li>Reusing syringes.</li>

        <li>Using contaminated equipment.</li>

        <li>Using medications from improperly handled containers.</li>

        <li>Failing to perform hand hygiene.</li>

        <li>Incorrect disposal of sharps.</li>

        <li>Recapping contaminated needles unnecessarily.</li>

    </ul>


    <h2>3. Safe Injection Practices</h2>

    <ul>

        <li>Use a new sterile needle and syringe for every injection.</li>

        <li>Perform hand hygiene before preparing medication.</li>

        <li>Prepare injections in a clean area.</li>

        <li>Check the medication before use.</li>

        <li>Use aseptic technique.</li>

        <li>Dispose of used needles immediately in an appropriate sharps container.</li>

        <li>Never reuse a syringe or needle.</li>

        <li>Follow institutional infection-prevention policies.</li>

    </ul>


    <div class="important">

        <strong>Important:</strong>
        A syringe and needle used for one patient must
        not be reused for another patient.

    </div>

`,

        <li>Assist the patient as necessary.</li>

// 14. BASIC LIFE SUPPORT
// ======================================================

"Basic Life Support": `

    <h2>1. Meaning of Basic Life Support</h2>

    <div class="definition">

        Basic Life Support (BLS) consists of immediate
        life-saving interventions used to support a person
        who has cardiac arrest, respiratory arrest or another
        life-threatening emergency.

    </div>


    <h2>2. Main Components of BLS</h2>

    <ul>

        <li>Recognition of cardiac arrest.</li>

        <li>Activation of emergency response.</li>

        <li>High-quality cardiopulmonary resuscitation (CPR).</li>

        <li>Use of an automated external defibrillator (AED) when available and appropriate.</li>

        <li>Continued assessment and care.</li>

    </ul>


    <h2>3. Basic Adult BLS Sequence</h2>

    <ol>

        <li>Ensure the environment is safe.</li>

        <li>Check responsiveness.</li>

        <li>Call for help and activate the emergency response system.</li>

        <li>Assess breathing and signs of circulation according to current BLS protocol.</li>

        <li>Begin CPR when indicated.</li>

        <li>Use an AED as soon as it becomes available.</li>

        <li>Continue resuscitation according to the applicable BLS protocol.</li>

    </ol>


    <h2>4. Chest Compressions</h2>

    <p>
        Chest compressions are used during CPR to circulate
        blood to vital organs when the heart is not effectively
        pumping.
    </p>


    <h3>Important Principles</h3>

    <ul>

        <li>Position the patient appropriately on a firm surface.</li>

        <li>Place the hands correctly on the chest.</li>

        <li>Allow adequate chest recoil after each compression.</li>

        <li>Minimize interruptions.</li>

        <li>Use an AED when available.</li>

    </ul>


    <h2>5. Importance of Early CPR</h2>

    <p>
        Early recognition, activation of emergency assistance,
        effective CPR and early defibrillation when indicated
        can improve the chances of survival from cardiac arrest.
    </p>


    <div class="important">

        <strong>Important:</strong>
        BLS skills should be learned and practiced according
        to the current approved resuscitation guidelines and
        institutional protocols.

    </div>

`

function displayNote() {

    const noteContent =
        document.getElementById(
            "noteContent"
        );


    if (!selectedTopic) {

        topicTitle.textContent =
            "Foundations of Nursing";

        noteTitle.textContent =
            "Foundations of Nursing";


        noteContent.innerHTML = `

            <div class="definition">

                <strong>No topic selected.</strong>

            </div>

            <p>

                Please return to the Foundations of Nursing
                topics page and select a topic.

            </p>

        `;

        return;

    }


    if (notes[selectedTopic]) {

        noteContent.innerHTML =
            notes[selectedTopic];

    }

    else {

        noteContent.innerHTML = `

            <div class="definition">

                <strong>Note not found.</strong>

            </div>

            <p>

                The note for
                <strong>
                    ${escapeHTML(selectedTopic)}
                </strong>
                has not been added yet.

            </p>

        `;

    }

}

function takeQuiz() {

    if (!selectedTopic) {

        alert(
            "Please select a topic first."
        );

        return;

    }


    window.location.href =

        "foundations-quiz.html?topic=" +

        encodeURIComponent(
            selectedTopic
        );

}



// ======================================================
// GO BACK
// ======================================================

function goBack() {

    window.location.href =
        "foundations-topics.html";

}



// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
