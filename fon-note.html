<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Foundations of Nursing</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #0066cc;
            color: white;
            padding: 18px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.95;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto 50px;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .topic-title {
            margin: 0;
            color: #0066cc;
            font-size: 25px;
            line-height: 1.3;
        }

        .back-btn {
            border: none;
            background: #555;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #333;
        }

        /* =========================
           NOTE AREA
        ========================= */

        .note-box {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);

            /*
             * IMPORTANT:
             * Do not give this container a fixed height.
             * This allows long notes to display completely.
             */
            height: auto;
            min-height: 300px;
            overflow: visible;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 16px;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #ddd;
            border-top: 4px solid #0066cc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           ERROR / EMPTY MESSAGE
        ========================= */

        .message {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .message h2 {
            margin-bottom: 10px;
            color: #444;
        }

        .message p {
            margin: 0;
            line-height: 1.6;
        }

        /* =========================
           NOTE CONTENT
        ========================= */

        #noteContent {
            width: 100%;
            height: auto;
            min-height: 100px;

            /*
             * VERY IMPORTANT:
             * Render saved HTML normally.
             * Do not use overflow:hidden here.
             */
            overflow: visible;

            overflow-wrap: anywhere;
            word-wrap: break-word;
        }

        #noteContent img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        #noteContent video,
        #noteContent iframe {
            max-width: 100%;
        }

        #noteContent table {
            max-width: 100%;
            border-collapse: collapse;
        }

        #noteContent th,
        #noteContent td {
            border: 1px solid #ccc;
            padding: 8px;
        }

        #noteContent p {
            line-height: 1.7;
        }

        #noteContent ul,
        #noteContent ol {
            line-height: 1.7;
        }

        #noteContent h1,
        #noteContent h2,
        #noteContent h3,
        #noteContent h4,
        #noteContent h5,
        #noteContent h6 {
            overflow-wrap: anywhere;
        }

        /* =========================
           CANVA-STYLE NOTE CANVAS
        ========================= */

        .ogcons-note-canvas {
            position: relative !important;
            width: 100% !important;
            max-width: 100% !important;

            /*
             * Do not force a height.
             * The saved min-height can still work.
             */
            height: auto !important;

            min-height: 300px;

            box-sizing: border-box;

            overflow: visible !important;

            overflow-wrap: anywhere;
            word-wrap: break-word;
        }

        /* =========================
           SAVED DESIGN OBJECTS
        ========================= */

        .ogcons-note-canvas .design-object {
            box-sizing: border-box;
        }

        .ogcons-note-canvas .text-object {
            position: absolute;
            box-sizing: border-box;

            max-width: 92%;

            overflow-wrap: anywhere;
            word-wrap: break-word;

            white-space: normal;
        }

        .ogcons-note-canvas .text-content {
            overflow-wrap: anywhere;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .ogcons-note-canvas .image-object {
            position: absolute;
            box-sizing: border-box;

            max-width: 100%;
        }

        .ogcons-note-canvas .image-object img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .ogcons-note-canvas .shape-object {
            box-sizing: border-box;
        }

        /* Hide editor controls if any accidentally remain */
        .ogcons-note-canvas .object-controls,
        .ogcons-note-canvas .resize-handle,
        .ogcons-note-canvas .rotate-handle {
            display: none !important;
        }

        /* =========================
           TABLE RESPONSIVENESS
        ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 15px 0;
        }

        #noteContent table {
            width: auto;
            min-width: 100%;
        }

        /* =========================
           QUIZ BUTTON
        ========================= */

        .quiz-button-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
            text-align: center;
        }

        .quiz-btn {
            background: #0066cc;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .quiz-btn:hover {
            background: #0052a3;
            transform: translateY(-1px);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 13px;
            }

            .container {
                width: 94%;
                margin-top: 18px;
            }

            .top-bar {
                align-items: stretch;
            }

            .topic-title {
                font-size: 21px;
            }

            .back-btn {
                width: 100%;
            }

            .note-box {
                padding: 15px;
                border-radius: 9px;
            }

            .quiz-btn {
                width: 100%;
                padding: 14px 18px;
            }

            #noteContent {
                font-size: 15px;
            }

            .ogcons-note-canvas {
                min-height: 250px !important;
            }

            .ogcons-note-canvas .text-object {
                max-width: 90%;
            }

            #noteContent table {
                font-size: 14px;
            }

            #noteContent th,
            #noteContent td {
                padding: 6px;
            }
        }

        @media (max-width: 450px) {

            .topic-title {
                font-size: 19px;
            }

            .note-box {
                padding: 12px;
            }

            #noteContent {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <h1>FOUNDATIONS OF NURSING</h1>

        <p>OGCONS Study Hub</p>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">

        <div class="top-bar">

            <h2
                class="topic-title"
                id="topicTitle">
                Loading topic...
            </h2>

            <button
                class="back-btn"
                onclick="goBack()">
                ← Back to Topics
            </button>

        </div>


        <!-- =========================
             NOTE
        ========================= -->

        <section class="note-box">

            <div
                id="loading"
                class="loading">

                <div class="spinner"></div>

                Loading note...

            </div>


            <div
                id="message"
                class="message"
                style="display: none;">

                <h2 id="messageTitle">
                    Note Not Found
                </h2>

                <p id="messageText">
                    No note was found for this topic.
                </p>

            </div>


            <!--
                NOTE CONTENT

                IMPORTANT:
                The content from Supabase is inserted using
                innerHTML because your admin editor saves HTML.
            -->

            <div
                id="noteContent"
                style="display: none;">
            </div>


            <!-- =========================
                 TAKE QUIZ BUTTON
            ========================= -->

            <div
                id="quizButtonContainer"
                class="quiz-button-container"
                style="display: none;">

                <button
                    class="quiz-btn"
                    onclick="takeQuiz()">

                    📝 Take Quiz

                </button>

            </div>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE CONFIGURATION
        ========================================== */

        const SUPABASE_URL =
            "https://bvetmmvpdotifusjkywd.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           COURSE
        ========================================== */

        const COURSE =
            "Foundations of Nursing";


        /* ==========================================
           GET TOPIC FROM URL
           
           Example:
           
           fon-note.html?topic=Introduction%20to%20Nursing
        ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const topic =
            params.get("topic");


        /* ==========================================
           ELEMENTS
        ========================================== */

        const topicTitle =
            document.getElementById("topicTitle");

        const loading =
            document.getElementById("loading");

        const message =
            document.getElementById("message");

        const messageTitle =
            document.getElementById("messageTitle");

        const messageText =
            document.getElementById("messageText");

        const noteContent =
            document.getElementById("noteContent");

        const quizButtonContainer =
            document.getElementById(
                "quizButtonContainer"
            );


        /* ==========================================
           NORMALIZE TEXT
           
           This prevents problems caused by:
           - extra spaces
           - different capitalization
           - accidental line breaks
        ========================================== */

        function normalizeText(value) {

            return String(value || "")
                .trim()
                .replace(/\s+/g, " ")
                .toLowerCase();

        }


        /* ==========================================
           LOAD NOTE
        ========================================== */

        async function loadNote() {

            try {

                /* ----------------------------------
                   Check topic
                ---------------------------------- */

                if (!topic) {

                    showMessage(
                        "Topic Not Found",
                        "No topic was provided in the page URL."
                    );

                    return;

                }


                /* ----------------------------------
                   Show topic
                ---------------------------------- */

                topicTitle.textContent =
                    topic;


                /* ----------------------------------
                   Get all notes for this course
                   
                   We deliberately load the course notes
                   and match the topic ourselves.
                   
                   This is more reliable if there are
                   spaces/capitalization differences.
                ---------------------------------- */

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("notes")

                    .select(
                        "id, course, topic, title, content, created_at, updated_at"
                    )

                    .eq(
                        "course",
                        COURSE
                    )

                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


                /* ----------------------------------
                   Database error
                ---------------------------------- */

                if (error) {

                    console.error(
                        "Supabase error:",
                        error
                    );

                    showMessage(
                        "Unable to Load Note",
                        "There was a problem connecting to the study notes. Please try again."
                    );

                    return;

                }


                /* ----------------------------------
                   No notes
                ---------------------------------- */

                if (!data || data.length === 0) {

                    showMessage(
                        "Note Not Found",
                        "There is currently no note available for this topic."
                    );

                    return;

                }


                /* ----------------------------------
                   Normalize requested topic
                ---------------------------------- */

                const requestedTopic =
                    normalizeText(topic);


                /* ----------------------------------
                   Find matching note
                ---------------------------------- */

                const selectedNote =
                    data.find(
                        function(note) {

                            return (
                                normalizeText(
                                    note.topic
                                ) === requestedTopic
                            );

                        }
                    );


                /* ----------------------------------
                   No matching topic
                ---------------------------------- */

                if (!selectedNote) {

                    showMessage(
                        "Note Not Found",
                        "There is currently no note available for \"" +
                        topic +
                        "\"."
                    );

                    return;

                }


                /* ==================================
                   DISPLAY NOTE
                   
                   IMPORTANT:
                   
                   DO NOT use textContent here.
                   
                   DO NOT use escapeHTML here.
                   
                   Your admin editor saves HTML such as:
                   
                   <div class="ogcons-note-canvas">
                       ...
                   </div>
                   
                   Therefore we must render it with innerHTML.
                ================================== */

                noteContent.innerHTML =
                    selectedNote.content || "";


                /* ----------------------------------
                   Show title from saved note if available
                ---------------------------------- */

                if (
                    selectedNote.title &&
                    selectedNote.title.trim() !== ""
                ) {

                    topicTitle.textContent =
                        selectedNote.title;

                }


                /* ----------------------------------
                   Make tables responsive
                ---------------------------------- */

                makeTablesResponsive();


                /* ----------------------------------
                   Show content
                ---------------------------------- */

                loading.style.display =
                    "none";

                message.style.display =
                    "none";

                noteContent.style.display =
                    "block";

                quizButtonContainer.style.display =
                    "block";

            }

            catch (err) {

                console.error(
                    "Unexpected error:",
                    err
                );

                showMessage(
                    "Something Went Wrong",
                    "An unexpected error occurred while loading the note. Please try again."
                );

            }

        }


        /* ==========================================
           MAKE TABLES RESPONSIVE
        ========================================== */

        function makeTablesResponsive() {

            const tables =
                noteContent.querySelectorAll(
                    "table"
                );


            tables.forEach(
                function(table) {

                    /*
                     * Avoid wrapping the same table
                     * more than once.
                     */

                    if (
                        table.parentElement &&
                        table.parentElement.classList.contains(
                            "table-wrapper"
                        )
                    ) {

                        return;

                    }


                    const wrapper =
                        document.createElement(
                            "div"
                        );

                    wrapper.className =
                        "table-wrapper";


                    table.parentNode.insertBefore(
                        wrapper,
                        table
                    );

                    wrapper.appendChild(
                        table
                    );

                }
            );

        }


        /* ==========================================
           SHOW MESSAGE
        ========================================== */

        function showMessage(
            title,
            text
        ) {

            loading.style.display =
                "none";

            noteContent.style.display =
                "none";

            quizButtonContainer.style.display =
                "none";

            message.style.display =
                "block";

            messageTitle.textContent =
                title;

            messageText.textContent =
                text;

        }


        /* ==========================================
           TAKE QUIZ
           
           Sends the SAME topic to the quiz page.
           
           Example:
           
           foundations-quiz.html?topic=Introduction%20to%20Nursing
        ========================================== */

        function takeQuiz() {

            if (!topic) {

                alert(
                    "Topic not found."
                );

                return;

            }


            window.location.href =
                "foundations-quiz.html?topic=" +
                encodeURIComponent(
                    topic
                );

        }


        /* ==========================================
           BACK TO TOPICS
        ========================================== */

        function goBack() {

            window.location.href =
                "foundations-topics.html";

        }


        /* ==========================================
           START
        ========================================== */

        loadNote();

    </script>

</body>

</html>
