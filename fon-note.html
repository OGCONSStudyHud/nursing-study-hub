<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Note</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8f6;
            color: #26332c;
        }

        header {
            background: linear-gradient(
                135deg,
                #18a058,
                #0d7a40
            );
            color: white;
            padding: 18px 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .header-content {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .back-button {
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.25);
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .note-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .course-name {
            color: #18a058;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .topic-name {
            color: #718077;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .note-title {
            font-size: 30px;
            line-height: 1.3;
            margin: 0 0 25px 0;
            color: #17231c;
        }

        .note-content {
            font-size: 16px;
            line-height: 1.8;
            color: #39473f;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #718077;
            font-size: 16px;
        }

        .error-box {
            background: #fff0f0;
            border: 1px solid #f0b4b4;
            color: #a33a3a;
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e6ece8;
        }

        .action-button {
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .topics-button {
            background: #eef5f0;
            color: #18a058;
        }

        .quiz-button {
            background: #18a058;
            color: white;
        }

        .topics-button:hover {
            background: #dcebe1;
        }

        .quiz-button:hover {
            background: #117d45;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #718077;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .note-card {
                padding: 22px;
            }

            .note-title {
                font-size: 25px;
            }

            .note-content {
                font-size: 15px;
            }

            .actions {
                flex-direction: column;
            }

            .action-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="logo">
            🩺 OGCONS Study Hub
        </div>

        <button
            class="back-button"
            onclick="goBack()">

            ← Back to Topics

        </button>

    </div>

</header>



<div class="container">

    <div
        id="loading"
        class="loading">

        🔄 Loading note...

    </div>


    <div
        id="errorBox"
        class="error-box"
        style="display:none;">

    </div>


    <div
        id="noteCard"
        class="note-card"
        style="display:none;">

        <div
            id="courseName"
            class="course-name">

            Foundations of Nursing

        </div>


        <div
            id="topicName"
            class="topic-name">

        </div>


        <h1
            id="noteTitle"
            class="note-title">

        </h1>


        <div
            id="noteContent"
            class="note-content">

        </div>


        <div class="actions">

            <button
                class="action-button topics-button"
                onclick="goBack()">

                ← Back to Topics

            </button>


            <button
                class="action-button quiz-button"
                onclick="takeQuiz()">

                Take Quiz →

            </button>

        </div>

    </div>

</div>



<footer>

    OGCONS Study Hub © 2026

</footer>



<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://bvetmmvpdotifusjkywd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1bssTw_8JM3HtHD3KoaL5w_iCwaLMYS";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* =====================================================
   COURSE
===================================================== */

const COURSE =
    "Foundations of Nursing";



/* =====================================================
   GET TOPIC FROM URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const selectedTopic =
    urlParams.get("topic");



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message) {

    document
        .getElementById("loading")
        .style.display = "none";


    document
        .getElementById("noteCard")
        .style.display = "none";


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.innerHTML =
        message;


    errorBox.style.display =
        "block";

}



/* =====================================================
   LOAD NOTE
===================================================== */

async function loadNote() {


    if (!selectedTopic) {

        showError(`
            <strong>No topic selected.</strong>
            <br><br>
            Please go back to the Foundations of Nursing
            topics and select a topic.
        `);

        return;

    }


    console.log(
        "Loading note:",
        COURSE,
        selectedTopic
    );


    const {
        data,
        error
    } =
        await supabaseClient

            .from("notes")

            .select(
                "course, topic, title, content"
            )

            .eq(
                "course",
                COURSE
            )

            .eq(
                "topic",
                selectedTopic
            )

            .maybeSingle();



    if (error) {

        console.error(
            "Note loading error:",
            error
        );


        showError(`
            <strong>Unable to load this note.</strong>
            <br><br>
            ${escapeHTML(error.message)}
        `);

        return;

    }



    if (!data) {

        showError(`
            <strong>Note not available yet.</strong>
            <br><br>
            There is currently no note for:
            <br><br>
            <strong>${escapeHTML(selectedTopic)}</strong>
            <br><br>
            Please check back later.
        `);

        return;

    }



    /* =================================================
       DISPLAY NOTE
    ================================================= */


    document
        .getElementById("loading")
        .style.display = "none";


    document
        .getElementById("errorBox")
        .style.display = "none";


    document
        .getElementById("noteCard")
        .style.display = "block";



    document
        .getElementById("courseName")
        .textContent =
        data.course || COURSE;



    document
        .getElementById("topicName")
        .textContent =
        data.topic || selectedTopic;



    document
        .getElementById("noteTitle")
        .textContent =
        data.title || selectedTopic;



    document
        .getElementById("noteContent")
        .textContent =
        data.content || "";

}



/* =====================================================
   BACK TO TOPICS
===================================================== */

function goBack() {

    window.location.href =
        "foundations-topics.html";

}



/* =====================================================
   TAKE QUIZ
===================================================== */

function takeQuiz() {

    window.location.href =
        "foundations-quiz.html?topic=" +
        encodeURIComponent(
            selectedTopic
        );

}



/* =====================================================
   START
===================================================== */

loadNote();


</script>


</body>

</html>
