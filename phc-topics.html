<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OGCONS Study Hub - Primary Health Care</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #e8fff2,
                    #e8f4ff,
                    #f5eaff
                );

            color: #163020;
        }


        /* ================================
           HEADER
        ================================= */

        header {

            background:
                linear-gradient(
                    135deg,
                    #18a058,
                    #2eb7a0
                );

            color: white;

            padding: 25px 20px;
        }


        .header-content {

            max-width: 1100px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        .logo {

            font-size: 23px;

            font-weight: bold;
        }


        .back-button {

            border: none;

            background: white;

            color: #18a058;

            padding: 10px 18px;

            border-radius: 20px;

            font-weight: bold;

            cursor: pointer;
        }


        .back-button:hover {

            background: #f0f0f0;
        }



        /* ================================
           CONTAINER
        ================================= */

        .container {

            max-width: 1100px;

            margin: auto;

            padding: 35px 20px;
        }



        /* ================================
           INTRO
        ================================= */

        .intro {

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.08);

            margin-bottom: 30px;

            text-align: center;
        }


        .intro-icon {

            font-size: 50px;

            margin-bottom: 10px;
        }


        .intro h1 {

            font-size: 30px;

            margin-bottom: 10px;

            color: #18a058;
        }


        .intro p {

            color: #617568;

            line-height: 1.6;

            max-width: 750px;

            margin: auto;
        }



        /* ================================
           TOPICS
        ================================= */

        .section-title {

            font-size: 24px;

            margin-bottom: 20px;
        }


        .topics {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }


        .topic-card {

            background: white;

            padding: 22px;

            border-radius: 16px;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.07);

            display: flex;

            align-items: center;

            gap: 18px;

            transition: 0.2s;
        }


        .topic-card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(0,0,0,0.10);
        }


        .topic-number {

            min-width: 45px;

            height: 45px;

            border-radius: 50%;

            background: #e5f8ed;

            color: #18a058;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 17px;
        }


        .topic-content {

            flex: 1;
        }


        .topic-content h3 {

            font-size: 17px;

            margin-bottom: 6px;

            line-height: 1.4;
        }


        .topic-content p {

            color: #718077;

            font-size: 13px;

            line-height: 1.4;
        }


        .open-topic {

            border: none;

            background: #18a058;

            color: white;

            padding: 10px 15px;

            border-radius: 18px;

            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;
        }


        .open-topic:hover {

            background: #117d45;
        }



        /* ================================
           FOOTER
        ================================= */

        footer {

            text-align: center;

            padding: 30px 20px;

            color: #718077;

            font-size: 14px;
        }



        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 750px) {

            .header-content {

                flex-direction: column;

                text-align: center;
            }


            .topics {

                grid-template-columns: 1fr;
            }


            .topic-card {

                align-items: flex-start;
            }


            .open-topic {

                padding: 9px 12px;

                font-size: 13px;
            }


            .intro h1 {

                font-size: 25px;
            }

        }


        @media (max-width: 500px) {

            .topic-card {

                flex-wrap: wrap;
            }


            .open-topic {

                width: 100%;

                margin-top: 5px;
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

    <div class="header-content">

        <div class="logo">

            🩺 OGCONS Study Hub

        </div>


        <button
            class="back-button"
            onclick="goBack()">

            ← Back to Dashboard

        </button>

    </div>

</header>



<!-- ==========================================
     MAIN
========================================== -->

<div class="container">


    <!-- INTRO -->

    <div class="intro">

        <div class="intro-icon">

            🏥

        </div>


        <h1>

            Primary Health Care

        </h1>


        <p>

            Study the principles, concepts,
            services and management of Primary
            Health Care and its role in promoting
            health within the community.

        </p>

    </div>



    <!-- TOPIC LIST -->

    <h2 class="section-title">

        📖 Course Topics

    </h2>



    <div
        class="topics"
        id="topicsContainer">

    </div>


</div>



<footer>

    OGCONS Study Hub © 2026

</footer>



<script>


// ==================================================
// PRIMARY HEALTH CARE TOPICS
// ==================================================

const topics = [

    {
        number: 1,
        name: "Introduction to Primary Health Care",
        description:
            "Basic concepts, principles, objectives and importance of Primary Health Care."
    },


    {
        number: 2,
        name: "The Community",
        description:
            "Understanding the community, its characteristics, structure and health needs."
    },


    {
        number: 3,
        name: "Cadre of Health Workers in PHC",
        description:
            "Different categories of health workers involved in Primary Health Care."
    },


    {
        number: 4,
        name: "Community Mobilization",
        description:
            "Methods of involving individuals and communities in improving their health."
    },


    {
        number: 5,
        name: "Community Diagnosis",
        description:
            "Identification and assessment of health problems and needs within a community."
    },


    {
        number: 6,
        name: "Health Education",
        description:
            "Principles, methods and importance of educating individuals and communities about health."
    },


    {
        number: 7,
        name: "Components of Primary Health Care",
        description:
            "The major components and essential elements of Primary Health Care."
    },


    {
        number: 8,
        name: "Immunization Against Major Communicable Diseases",
        description:
            "The role of immunization in preventing major communicable diseases."
    },


    {
        number: 9,
        name: "Prevention and Control of Locally Endemic and Epidemic Diseases",
        description:
            "Measures used to prevent and control endemic and epidemic diseases in communities."
    },


    {
        number: 10,
        name: "Promotion of Mental Health",
        description:
            "Basic principles and activities involved in promoting mental health in the community."
    },


    {
        number: 11,
        name: "Maternal and Child Health Services",
        description:
            "Primary health care services provided to mothers, newborns and children."
    },


    {
        number: 12,
        name: "Provision of Essential Drugs and Supplies",
        description:
            "Importance and management of essential drugs and supplies in Primary Health Care."
    },


    {
        number: 13,
        name: "Oral Hygiene and Eye Care",
        description:
            "Basic measures for maintaining oral health and preventing common eye problems."
    },


    {
        number: 14,
        name: "Adolescence and Their Problems",
        description:
            "Common physical, psychological, social and health problems affecting adolescents."
    },


    {
        number: 15,
        name: "Referral System in PHC",
        description:
            "Principles and processes involved in referring patients within the health care system."
    },


    {
        number: 16,
        name: "Care of the Aged in the Community",
        description:
            "Community-based care and support for older persons."
    },


    {
        number: 17,
        name: "Management of Occupational Health",
        description:
            "Principles of protecting workers and preventing occupational health problems."
    },


    {
        number: 18,
        name: "Management in Primary Health Care",
        description:
            "Basic principles of planning, organizing, coordinating and managing Primary Health Care services."
    }

];



// ==================================================
// DISPLAY TOPICS
// ==================================================

function displayTopics() {

    const container =
        document.getElementById(
            "topicsContainer"
        );


    container.innerHTML = "";


    topics.forEach(function(topic) {

        const card =
            document.createElement("div");


        card.className =
            "topic-card";


        card.innerHTML = `

            <div class="topic-number">

                ${topic.number}

            </div>


            <div class="topic-content">

                <h3>

                    ${escapeHTML(topic.name)}

                </h3>


                <p>

                    ${escapeHTML(topic.description)}

                </p>

            </div>


            <button
                class="open-topic"
                onclick='openTopic(${JSON.stringify(topic.name)})'>

                Open →

            </button>

        `;


        container.appendChild(card);

    });

}



// ==================================================
// OPEN TOPIC
// ==================================================

function openTopic(topicName) {

    /*
        IMPORTANT:

        The PHC note page will be:

        phc-note.html

        The selected topic is passed through
        the URL.

        Example:

        phc-note.html?topic=The%20Community
    */


    const url =

        "phc-note.html?topic=" +

        encodeURIComponent(
            topicName
        );


    window.location.href =
        url;

}



// ==================================================
// BACK TO DASHBOARD
// ==================================================

function goBack() {

    window.location.href =
        "dashboard.html";

}



// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==================================================
// START
// ==================================================

displayTopics();


</script>


</body>

</html>
