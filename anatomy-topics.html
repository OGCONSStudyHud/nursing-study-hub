<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
OGCONS Study Hub - Anatomy & Physiology
</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #e8fff2,
            #e8f4ff,
            #f5eaff
        );

    color: #172033;
}

header {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #14b8a6
        );

    color: white;

    padding: 25px 20px;
}

.header-content {

    max-width: 1000px;

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.logo {

    font-size: 22px;

    font-weight: bold;
}

.back-button {

    background: white;

    color: #2563eb;

    border: none;

    padding: 10px 18px;

    border-radius: 22px;

    font-weight: bold;

    cursor: pointer;
}

.container {

    max-width: 1000px;

    margin: auto;

    padding: 30px 20px;
}

.course-header {

    background: white;

    padding: 30px 25px;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);

    margin-bottom: 25px;
}

.course-icon {

    font-size: 55px;

    margin-bottom: 12px;
}

.course-header h1 {

    color: #2563eb;

    margin-bottom: 10px;

    font-size: 30px;
}

.course-header p {

    color: #68756d;

    line-height: 1.6;
}

.topics {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;
}

.topic-card {

    background: white;

    padding: 22px;

    border-radius: 16px;

    box-shadow:
        0 8px 22px
        rgba(0,0,0,0.07);

    cursor: pointer;

    transition: 0.2s;

    border-left: 5px solid #2563eb;
}

.topic-card:hover {

    transform: translateY(-4px);

    box-shadow:
        0 12px 28px
        rgba(0,0,0,0.11);
}

.topic-number {

    color: #2563eb;

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 8px;
}

.topic-card h2 {

    font-size: 18px;

    line-height: 1.4;

    margin-bottom: 8px;
}

.topic-card p {

    color: #68756d;

    font-size: 14px;

    line-height: 1.5;
}

footer {

    text-align: center;

    padding: 35px;

    color: #68756d;

    font-size: 14px;
}

@media(max-width:700px) {

    .header-content {

        flex-direction: column;

        text-align: center;
    }

    .topics {

        grid-template-columns: 1fr;
    }

    .course-header h1 {

        font-size: 25px;
    }

}

</style>

</head>


<body>


<header>

<div class="header-content">

<div class="logo">

🩺 OGCONS Study Hub

</div>


<button
    class="back-button"
    onclick="goBack()">

← Back to Dashboard

</button>

</div>

</header>



<div class="container">


<div class="course-header">

<div class="course-icon">

🫀

</div>

<h1>

Anatomy & Physiology

</h1>

<p>

Select a topic below to study the note
and test your knowledge with a quiz.

</p>

</div>



<div
    class="topics"
    id="topicsContainer">

</div>


</div>



<footer>

OGCONS Study Hub © 2026

</footer>



<script>

const topics = [

"Introduction to Anatomy",

"The Musculoskeletal System",

"Blood and Cardiovascular System",

"The Respiratory System",

"The Digestive System",

"The Integumentary System",

"The Excretory System",

"The Endocrine System",

"The Female Reproductive System",

"The Male Reproductive System",

"Foetal Development"

];


const topicsContainer =
document.getElementById(
    "topicsContainer"
);


topics.forEach(
function(topic, index) {

const card =
document.createElement("div");

card.className =
"topic-card";


card.innerHTML = `

<div class="topic-number">

TOPIC ${index + 1}

</div>

<h2>

${escapeHTML(topic)}

</h2>

<p>

Click to study this topic and
take the quiz.

</p>

`;


card.onclick =
function() {

window.location.href =
"anatomy-note.html?topic=" +
encodeURIComponent(topic);

};


topicsContainer.appendChild(card);

}
);


function goBack() {

window.location.href =
"dashboard.html";

}


function escapeHTML(value) {

return String(value)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}

</script>


</body>

</html>
