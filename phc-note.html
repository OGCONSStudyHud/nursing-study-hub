        /* ================================
           TOPIC NAVIGATION

        .topic-navigation {

        .nav-topic-button {

            cursor: pointer;

        /* ================================
           NOTE

        .note {

            background: white;

            margin-bottom: 15px;

            padding-bottom: 8px;

            border-bottom:
                2px solid #e5f5ec;
        }


        .note h2:first-child {

            margin-top: 0;
        }


        .note h3 {

            color: #117d45;

            font-size: 20px;

            margin-top: 24px;

        }


        .note h4 {

            color: #285f47;

        }


        .note p {

            color: #26382d;
        }


        .note ul,
        .note ol {

            margin-left: 28px;

        .note li {

        }


        .definition {

            background: #e9f9f0;

            border-left:
                5px solid #18a058;

            padding: 18px;

            border-radius: 10px;

        }


        .important {

            background: #fff8e6;

            border-left:
                5px solid #f0a500;

            padding: 18px;

            border-radius: 10px;

            margin: 18px 0;
        }


        .example {

            background: #eef6ff;

            border-left:
                5px solid #0b5ed7;

            padding: 18px;

            border-radius: 10px;

            margin: 18px 0;
        }


        .summary {

            background:
                linear-gradient(
                    135deg,
                    #e8fff2,
                    #eefcff
                );

            padding: 22px;

            border-radius: 15px;

            margin-top: 30px;
        }


        .summary h3 {

        /* ================================
           LEARNING OBJECTIVES

        .objectives {

        }


        .objectives h3 {

        }



        /* ================================
           QUIZ BUTTON

        .quiz-box {

        }


        .quiz-box h3 {

        }


        .quiz-box p {

        }


        .quiz-button {

            border: none;

            background: white;

            padding: 12px 24px;

            border-radius: 25px;

        }


        .quiz-button:hover {

           FOOTER
        ================================= */

        footer {

        }



        /* ================================

        ================================= */

        @media (max-width: 700px) {

            .header-content {

                flex-direction: column;

                text-align: center;
            }

<!-- ==================================================
     HEADER
================================================== -->

<header>

    <div class="header-content">

        <div class="logo">

            🩺 OGCONS Study Hub

        </div>


        <button
            class="back-button"
            onclick="goBack()">

            ← Back to PHC Topics

        </button>

    </div>

</header>



<!-- ==================================================
     MAIN
================================================== -->

<div class="container">


    <!-- TOPIC HEADER -->

    <div class="topic-header">

        <div class="topic-icon">

            🏥

        </div>


        <h1 id="topicTitle">

            Primary Health Care

        </h1>


        <p>

            Comprehensive study notes for
            Primary Health Care based on the
            major areas of the nursing curriculum.

        </p>

    </div>



    <!-- TOPIC NAVIGATION -->

    <div class="topic-navigation">

        <button
            class="nav-topic-button"
            onclick="previousTopic()">

            ← Previous Topic

        </button>


        <button
            class="nav-topic-button"
            onclick="goBack()">

            📚 All PHC Topics

        </button>


        <button
            class="nav-topic-button"
            onclick="nextTopic()">

            Next Topic →

        </button>

    </div>



    <!-- NOTE -->

    <div
        class="note"
        id="noteContent">

    </div>


</div>



<footer>

    OGCONS Study Hub © 2026

</footer>



<script>


// ======================================================
// PHC TOPICS
// ======================================================

const topics = [

    "Introduction to Primary Health Care",

    "The Community",

    "Cadre of Health Workers in PHC",

    "Community Mobilization",

    "Community Diagnosis",

    "Health Education",

    "Components of Primary Health Care",

    "Immunization Against Major Communicable Diseases",

    "Prevention and Control of Locally Endemic and Epidemic Diseases",

    "Promotion of Mental Health",

    "Maternal and Child Health Services",

    "Provision of Essential Drugs and Supplies",

    "Oral Hygiene and Eye Care",

    "Adolescence and Their Problems",

    "Referral System in PHC",

    "Care of the Aged in the Community",

    "Management of Occupational Health",

    "Management in Primary Health Care"

];



// ======================================================
// GET TOPIC FROM URL
// ======================================================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const selectedTopic =
    urlParams.get("topic");



let currentTopicIndex =
    topics.indexOf(
        selectedTopic
    );



// ======================================================
// IF TOPIC DOES NOT EXIST
// ======================================================

if (
    currentTopicIndex === -1
) {

    currentTopicIndex = 0;

}



// ======================================================
// DISPLAY TOPIC
// ======================================================

function displayTopic() {

    const topic =
        topics[
            currentTopicIndex
        ];


    document
        .getElementById("topicTitle")
        .textContent =
        topic;


    document
        .getElementById("noteContent")
        .innerHTML =
        getNote(topic);

}



// ======================================================
// GET NOTE
// ======================================================

function getNote(topic) {


    switch(topic) {


        // ==================================================
        // 1. INTRODUCTION TO PHC
        // ==================================================

        case "Introduction to Primary Health Care":

            return `

                <div class="objectives">

                    <h3>
                        Learning Objectives
                    </h3>

                    <ul>

                        <li>Define Primary Health Care.</li>

                        <li>
                            Explain the historical development
                            of Primary Health Care.
                        </li>

                        <li>
                            Discuss the principles and
                            concepts of PHC.
                        </li>

                        <li>
                            Identify the major components
                            of PHC.
                        </li>

                        <li>
                            Explain the organization of
                            PHC services in Nigeria.
                        </li>

                    </ul>

                </div>


                <h2>
                    1. Meaning of Primary Health Care
                </h2>


                <div class="definition">

                    <strong>
                        Primary Health Care (PHC)
                    </strong>
                    is essential health care that is
                    made universally accessible to
                    individuals and families in the
                    community through their full
                    participation and at a cost the
                    community and country can afford.

                </div>


                <p>

                    PHC is the level of health care
                    that brings essential health
                    services as close as possible to
                    where people live and work.

                </p>


                <h3>
                    Historical Background
                </h3>


                <p>

                    Primary Health Care became a major
                    global health strategy following the
                    International Conference on Primary
                    Health Care held at Alma-Ata,
                    Kazakhstan, in 1978.

                </p>


                <p>

                    The Alma-Ata Declaration emphasized
                    health as a fundamental human right
                    and promoted the goal of achieving
                    better health through accessible,
                    affordable and community-based care.

                </p>


                <h3>
                    Principles of Primary Health Care
                </h3>


                <ol>

                    <li>
                        <strong>Equitable distribution:</strong>
                        Health services should be available
                        to all people regardless of their
                        social or economic status.
                    </li>

                    <li>
                        <strong>Community participation:</strong>
                        Individuals and communities should
                        participate actively in decisions
                        affecting their health.
                    </li>

                    <li>
                        <strong>Intersectoral collaboration:</strong>
                        Health improvement requires
                        cooperation between health and
                        other sectors such as education,
                        agriculture, water and sanitation.
                    </li>

                    <li>
                        <strong>Appropriate technology:</strong>
                        Methods and technology used should
                        be scientifically sound, practical,
                        affordable and acceptable.
                    </li>

                </ol>


                <h3>
                    Major Areas of PHC
                </h3>


                <p>

                    PHC emphasizes health promotion,
                    disease prevention, treatment,
                    rehabilitation and community
                    participation.

                </p>


                <h3>
                    PHC in Nigeria
                </h3>


                <p>

                    The Nigerian health system operates
                    through primary, secondary and
                    tertiary levels. PHC represents the
                    first level where most individuals
                    and families should access essential
                    health services.

                </p>


                <h3>
                    Role of the Nurse in PHC
                </h3>


                <ul>

                    <li>Health education.</li>

                    <li>Immunization services.</li>

                    <li>Maternal and child health care.</li>

                    <li>Community assessment.</li>

                    <li>Disease prevention.</li>

                    <li>Health promotion.</li>

                    <li>Referral of patients.</li>

                    <li>Home visits and community outreach.</li>

                    <li>Record keeping and reporting.</li>

                </ul>


                <div class="summary">

                    <h3>
                        Summary
                    </h3>

                    <p>

                        PHC is the foundation of a
                        community-oriented health system.
                        It focuses on making essential
                        health care accessible, affordable,
                        acceptable and available to the
                        population.

                    </p>

                </div>

            `;



        // ==================================================
        // 2. THE COMMUNITY
        // ==================================================

        case "The Community":

            return `

                <h2>
                    2. The Community
                </h2>


                <div class="definition">

                    <strong>Community</strong>
                    refers to a group of people living
                    in a particular geographical area
                    or sharing common characteristics,
                    interests, values or goals.

                </div>


                <h3>
                    Characteristics of a Community
                </h3>


                <ul>

                    <li>
                        People living within a particular
                        geographical area.
                    </li>

                    <li>
                        Common interests or needs.
                    </li>

                    <li>
                        Social relationships.
                    </li>

                    <li>
                        Common institutions.
                    </li>

                    <li>
                        Leadership and decision-making
                        structures.
                    </li>

                    <li>
                        Shared values and customs.
                    </li>

                </ul>


                <h3>
                    Community Structure
                </h3>


                <p>

                    Community structure refers to the
                    arrangement of people, groups,
                    institutions and leadership systems
                    within the community.

                </p>


                <h3>
                    Community Leadership
                </h3>


                <p>

                    Leadership may include traditional
                    rulers, religious leaders, community
                    development associations, youth
                    leaders, women's groups and other
                    influential individuals.

                </p>


                <h3>
                    Family Patterns
                </h3>


                <p>

                    The family is an important social
                    unit in community health. Family
                    patterns may include nuclear,
                    extended and other culturally
                    recognized family arrangements.

                </p>


                <h3>
                    Health Patterns of the Community
                </h3>


                <p>

                    Health patterns describe the common
                    health conditions, behaviours,
                    environmental factors and health
                    practices found within a population.

                </p>


                <h3>
                    Functions of the Community
                </h3>


                <ul>

                    <li>
                        Provides social support.
                    </li>

                    <li>
                        Protects members.
                    </li>

                    <li>
                        Provides cultural identity.
                    </li>

                    <li>
                        Participates in health activities.
                    </li>

                    <li>
                        Identifies and responds to
                        community problems.
                    </li>

                </ul>


                <h3>
                    Health Needs Assessment
                </h3>


                <p>

                    Nurses and other health workers
                    identify community health needs by
                    collecting information about the
                    population, environment, diseases,
                    resources and available services.

                </p>

            `;



        // ==================================================
        // 3. CADRE OF HEALTH WORKERS
        // ==================================================

        case "Cadre of Health Workers in PHC":

            return `

                <h2>
                    3. Cadre of Health Workers in PHC
                </h2>


                <p>

                    Primary Health Care requires a
                    multidisciplinary team. Different
                    health workers have different
                    responsibilities, but they work
                    together to meet the health needs
                    of individuals, families and
                    communities.

                </p>


                <h3>
                    Major Health Workers
                </h3>


                <h4>
                    1. Community Health Officer (CHO)
                </h4>

                <p>

                    The CHO provides and supervises
                    community-based health services,
                    participates in health promotion,
                    disease prevention, treatment and
                    referral activities.

                </p>


                <h4>
                    2. Community Health Extension Worker
                    (CHEW)
                </h4>

                <p>

                    CHEWs provide basic preventive,
                    promotive and curative services,
                    health education, community
                    mobilization and outreach services.

                </p>


                <h4>
                    3. Junior Community Health Extension
                    Worker (JCHEW)
                </h4>

                <p>

                    JCHEWs assist in delivering basic
                    community health services and
                    supporting health promotion and
                    preventive activities.

                </p>


                <h4>
                    4. Nurse
                </h4>

                <ul>

                    <li>Health education.</li>

                    <li>Maternal and child health.</li>

                    <li>Immunization.</li>

                    <li>Community assessment.</li>

                    <li>Disease prevention.</li>

                    <li>Patient care and referral.</li>

                </ul>


                <h4>
                    5. Midwife
                </h4>

                <p>

                    Midwives provide antenatal,
                    delivery, postnatal and reproductive
                    health services within their scope
                    of practice.

                </p>


                <h4>
                    6. Public Health Nurse
                </h4>

                <p>

                    Public health nurses focus on
                    population health, health promotion,
                    disease prevention, surveillance,
                    education and community-based care.

                </p>


                <h4>
                    7. Community Physician/Medical Officer
                </h4>

                <p>

                    Provides medical assessment,
                    diagnosis, treatment, supervision
                    and support for PHC programmes
                    according to the level of service.

                </p>


                <h4>
                    8. Traditional Birth Attendant
                </h4>

                <p>

                    Traditional birth attendants may
                    have important community roles,
                    particularly in areas where they
                    are culturally accepted. Their
                    activities should be linked with
                    the formal health system and safe
                    referral practices.

                </p>


                <h3>
                    Importance of Teamwork
                </h3>

                <p>

                    Teamwork prevents duplication of
                    services, promotes efficient use
                    of resources and improves continuity
                    of care.

                </p>

            `;



        // ==================================================
        // 4. COMMUNITY MOBILIZATION
        // ==================================================

        case "Community Mobilization":

            return `

                <h2>
                    4. Community Mobilization
                </h2>


                <div class="definition">

                    Community mobilization is the process
                    of bringing individuals, groups,
                    organizations and community leaders
                    together to identify problems, make
                    decisions and take collective action
                    to improve health.

                </div>


                <h3>
                    Objectives
                </h3>

                <ul>

                    <li>
                        Encourage community participation.
                    </li>

                    <li>
                        Identify community health problems.
                    </li>

                    <li>
                        Mobilize local resources.
                    </li>

                    <li>
                        Promote ownership of health
                        programmes.
                    </li>

                    <li>
                        Encourage sustainable health
                        actions.
                    </li>

                </ul>


                <h3>
                    Principles
                </h3>

                <ul>

                    <li>Respect for the community.</li>

                    <li>Participation.</li>

                    <li>Local ownership.</li>

                    <li>Transparency.</li>

                    <li>Effective communication.</li>

                    <li>Use of available resources.</li>

                </ul>


                <h3>
                    Steps in Community Mobilization
                </h3>

                <ol>

                    <li>
                        Enter and understand the community.
                    </li>

                    <li>
                        Identify community leaders.
                    </li>

                    <li>
                        Establish relationships.
                    </li>

                    <li>
                        Identify health problems.
                    </li>

                    <li>
                        Prioritize problems.
                    </li>

                    <li>
                        Develop an action plan.
                    </li>

                    <li>
                        Mobilize resources.
                    </li>

                    <li>
                        Implement activities.
                    </li>

                    <li>
                        Monitor and evaluate results.
                    </li>

                </ol>

            `;



        // ==================================================
        // 5. COMMUNITY DIAGNOSIS
        // ==================================================

        case "Community Diagnosis":

            return `

                <h2>
                    5. Community Diagnosis
                </h2>


                <div class="definition">

                    Community diagnosis is the systematic
                    process of identifying and analysing
                    the health problems, needs, resources
                    and priorities of a community.

                </div>


                <h3>
                    Purpose
                </h3>

                <ul>

                    <li>
                        Identify major health problems.
                    </li>

                    <li>
                        Determine community needs.
                    </li>

                    <li>
                        Identify available resources.
                    </li>

                    <li>
                        Establish priorities.
                    </li>

                    <li>
                        Guide planning of interventions.
                    </li>

                </ul>


                <h3>
                    Information Required
                </h3>

                <ul>

                    <li>Population characteristics.</li>

                    <li>Birth and death information.</li>

                    <li>Disease patterns.</li>

                    <li>Environmental conditions.</li>

                    <li>Water and sanitation.</li>

                    <li>Health facilities.</li>

                    <li>Available health workers.</li>

                    <li>Social and economic conditions.</li>

                </ul>


                <h3>
                    Methods of Data Collection
                </h3>

                <ul>

                    <li>Observation.</li>

                    <li>Interview.</li>

                    <li>Questionnaires.</li>

                    <li>Household surveys.</li>

                    <li>Review of health records.</li>

                    <li>Community meetings.</li>

                    <li>Focus group discussions.</li>

                </ul>


                <h3>
                    Basic Steps
                </h3>

                <ol>

                    <li>Define the community.</li>

                    <li>Collect information.</li>

                    <li>Analyse the information.</li>

                    <li>Identify health problems.</li>

                    <li>Prioritize problems.</li>

                    <li>Plan interventions.</li>

                    <li>Implement interventions.</li>

                    <li>Evaluate outcomes.</li>

                </ol>

            `;



        // ==================================================
        // 6. HEALTH EDUCATION
        // ==================================================

        case "Health Education":

            return `

                <h2>
                    6. Health Education
                </h2>


                <div class="definition">

                    Health education is the process of
                    helping individuals and communities
                    acquire knowledge, attitudes and
                    skills that promote healthy behaviour
                    and improve health.

                </div>


                <h3>
                    Objectives
                </h3>

                <ul>

                    <li>
                        Increase health knowledge.
                    </li>

                    <li>
                        Correct harmful beliefs.
                    </li>

                    <li>
                        Encourage healthy behaviour.
                    </li>

                    <li>
                        Promote disease prevention.
                    </li>

                    <li>
                        Encourage appropriate use of
                        health services.
                    </li>

                </ul>


                <h3>
                    Principles
                </h3>

                <ul>

                    <li>
                        Start from what the learner
                        already knows.
                    </li>

                    <li>
                        Use simple language.
                    </li>

                    <li>
                        Relate teaching to actual needs.
                    </li>

                    <li>
                        Encourage participation.
                    </li>

                    <li>
                        Respect cultural beliefs while
                        addressing harmful practices.
                    </li>

                    <li>
                        Evaluate whether learning has
                        occurred.
                    </li>

                </ul>


                <h3>
                    Methods
                </h3>

                <ul>

                    <li>Individual teaching.</li>

                    <li>Group discussion.</li>

                    <li>Lecture.</li>

                    <li>Demonstration.</li>

                    <li>Role play.</li>

                    <li>Community meetings.</li>

                    <li>Posters and other IEC materials.</li>

                </ul>


                <h3>
                    IEC and Behaviour Change Communication
                </h3>

                <p>

                    Information, Education and
                    Communication (IEC) uses appropriate
                    communication materials and methods
                    to provide health information.

                </p>


                <p>

                    Behaviour Change Communication focuses
                    on communication strategies that help
                    individuals and communities adopt and
                    maintain healthier behaviours.

                </p>

            `;



        // ==================================================
        // 7. COMPONENTS OF PHC
        // ==================================================

        case "Components of Primary Health Care":

            return `

                <h2>

// ======================================================
// PREVIOUS TOPIC
// ======================================================

function previousTopic() {

    if (
        currentTopicIndex > 0
    ) {

        currentTopicIndex--;

        goToCurrentTopic();

    }

}



// ======================================================
// NEXT TOPIC
// ======================================================

function nextTopic() {

    if (
        currentTopicIndex <
        topics.length - 1
    ) {

        currentTopicIndex++;

        goToCurrentTopic();

    }

}



// ======================================================
// GO TO CURRENT TOPIC
// ======================================================

function goToCurrentTopic() {

    const topic =
        topics[
            currentTopicIndex
        ];


    window.location.href =

        "phc-note.html?topic=" +

        encodeURIComponent(
            topic
        );

}



// ======================================================
// BACK
// ======================================================
