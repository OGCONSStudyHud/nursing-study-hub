<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OGCONS Study Hub - PHC Notes</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#e8fff2,#e8f4ff,#f5eaff);
color:#172033;
line-height:1.7;
}

header{
background:linear-gradient(135deg,#18a058,#2eb7a0);
color:white;
padding:22px 20px;
}

.header-content{
max-width:1000px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.logo{
font-size:22px;
font-weight:bold;
}

.back-button{
border:none;
background:white;
color:#18a058;
padding:10px 18px;
border-radius:20px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.topic-header{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
text-align:center;
margin-bottom:20px;
}

.topic-icon{
font-size:55px;
}

.topic-header h1{
color:#18a058;
margin:10px 0;
font-size:30px;
}

.topic-header p{
color:#617568;
}

.actions{
display:flex;
gap:15px;
margin-bottom:25px;
}

.action-button{
flex:1;
border:none;
padding:15px;
border-radius:12px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.read{
background:#18a058;
color:white;
}

.quiz{
background:#0b5ed7;
color:white;
}

.note{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.note h2{
color:#18a058;
margin-bottom:20px;
font-size:28px;
}

.note h3{
color:#18a058;
margin-top:28px;
margin-bottom:10px;
font-size:21px;
}

.note p{
margin-bottom:15px;
}

.note ul,
.note ol{
margin-left:25px;
margin-bottom:20px;
}

.note li{
margin-bottom:9px;
}

.quiz-box{
margin-top:25px;
background:#eef8ff;
padding:20px;
border-radius:12px;
text-align:center;
}

footer{
text-align:center;
padding:30px;
color:#718077;
}

@media(max-width:650px){

.header-content{
flex-direction:column;
text-align:center;
}

.actions{
flex-direction:column;
}

.topic-header h1{
font-size:25px;
}

.note{
padding:22px;
}

}

</style>
</head>

<body>

<header>

<div class="header-content">

<div class="logo">
🩺 OGCONS Study Hub
</div>

<button class="back-button" onclick="goBack()">
← Back to PHC Topics
</button>

</div>

</header>

<div class="container">

<div class="topic-header">

<div class="topic-icon">
🏥
</div>

<h1 id="topicTitle">
Primary Health Care
</h1>

<p>
Study the topic carefully before attempting the quiz.
</p>

</div>

<div class="actions">

<button class="action-button read" onclick="showNote()">
📖 Read Note
</button>

<button class="action-button quiz" onclick="takeQuiz()">
📝 Take Quiz
</button>

</div>

<div class="note" id="noteContent">

<h2 id="noteTitle">
Topic Note
</h2>

<p>
Select <strong>Read Note</strong> to display the study note.
</p>

</div>

</div>

<footer>
OGCONS Study Hub © 2026
</footer>

<script>

const params=
new URLSearchParams(window.location.search);

const topic=
params.get("topic");

const topicTitle=
document.getElementById("topicTitle");

const noteTitle=
document.getElementById("noteTitle");

if(topic){

topicTitle.textContent=topic;
noteTitle.textContent=topic;

}


const notes={

"Introduction to Primary Health Care":`

<h3>Meaning of Primary Health Care</h3>

<p>
Primary Health Care (PHC) is essential health care that is made available to individuals and families in the community through methods that are practical, scientifically sound and socially acceptable.
</p>

<h3>Importance of Primary Health Care</h3>

<ul>
<li>Promotes health and prevents disease.</li>
<li>Makes essential health services accessible to communities.</li>
<li>Encourages community participation.</li>
<li>Promotes early detection and treatment of diseases.</li>
<li>Reduces preventable illness and death.</li>
</ul>

<h3>Principles of Primary Health Care</h3>

<ul>
<li>Equitable distribution of health services.</li>
<li>Community participation.</li>
<li>Intersectoral collaboration.</li>
<li>Appropriate technology.</li>
<li>Emphasis on prevention and health promotion.</li>
</ul>

<h3>Major Elements of PHC</h3>

<ul>
<li>Health education.</li>
<li>Promotion of proper nutrition.</li>
<li>Maternal and child health care.</li>
<li>Immunization.</li>
<li>Prevention and control of endemic diseases.</li>
<li>Essential drugs.</li>
<li>Treatment of common diseases and injuries.</li>
<li>Provision of safe water and basic sanitation.</li>
</ul>

`,

"Community Health Nursing":`

<h3>Meaning</h3>

<p>
Community health nursing is a branch of nursing concerned with promoting, maintaining and improving the health of individuals, families and groups within the community.
</p>

<h3>Roles of the Community Health Nurse</h3>

<ul>
<li>Health educator.</li>
<li>Care provider.</li>
<li>Advocate.</li>
<li>Counsellor.</li>
<li>Community mobilizer.</li>
<li>Home visitor.</li>
<li>Health promoter.</li>
<li>Participant in disease prevention programmes.</li>
</ul>

`,

"Health Education":`

<h3>Meaning of Health Education</h3>

<p>
Health education is the process of helping individuals and communities acquire knowledge and develop attitudes and skills that promote and maintain good health.
</p>

<h3>Importance</h3>

<ul>
<li>Improves health knowledge.</li>
<li>Encourages healthy behaviour.</li>
<li>Promotes disease prevention.</li>
<li>Encourages proper use of health services.</li>
<li>Helps individuals make informed health decisions.</li>
</ul>

`,

"Immunization":`

<h3>Meaning</h3>

<p>
Immunization is the process by which a person becomes protected against a particular infectious disease, usually through vaccination.
</p>

<h3>Importance</h3>

<ul>
<li>Prevents vaccine-preventable diseases.</li>
<li>Reduces complications and deaths.</li>
<li>Protects vulnerable members of the community.</li>
<li>Helps control outbreaks of infectious diseases.</li>
</ul>

`,

"Family Planning":`

<h3>Meaning</h3>

<p>
Family planning enables individuals and couples to determine freely and responsibly the number and spacing of their children.
</p>

<h3>Importance</h3>

<ul>
<li>Promotes maternal health.</li>
<li>Promotes child health.</li>
<li>Allows appropriate spacing of pregnancies.</li>
<li>Helps families plan their resources.</li>
</ul>

`

};


function showNote(){

const content=
notes[topic];

if(content){

document.getElementById("noteContent").innerHTML=
`
<h2>${escapeHTML(topic)}</h2>
${content}
`;

}

else{

document.getElementById("noteContent").innerHTML=`

<h2>${escapeHTML(topic || "Primary Health Care")}</h2>

<h3>Study Note</h3>

<p>
The detailed note for this topic will be added to this section.
</p>

<p>
Please continue to the next topic while the remaining
curriculum-based notes are being prepared.
</p>

`;

}

}


function takeQuiz(){

if(!topic){

alert("No topic selected.");
return;

}

window.location.href=
"phc-quiz.html?topic="+
encodeURIComponent(topic);

}


function goBack(){

window.location.href=
"phc-topics.html";

}


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

showNote();

</script>

</body>
</html>
