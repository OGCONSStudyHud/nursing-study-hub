notes["Introduction to Primary Health Care"] = `

<h2>Unit I: Introduction to Primary Health Care</h2>

<h3>Meaning of Primary Health Care</h3>

<div class="definition">

<strong>Primary Health Care (PHC)</strong> is essential health care that is made
accessible to individuals and families in the community through acceptable
methods and with their participation.

</div>

<p>
Primary Health Care is the first level of contact between individuals,
families and the health system. It brings basic health services closer
to where people live and work.
</p>

<h3>Historical Perspective</h3>

<p>
Primary Health Care became a major international health strategy following
the Alma-Ata Declaration of 1978. The declaration emphasized health for
all, community participation, equity and accessible health services.
</p>

<h3>Philosophy of Primary Health Care</h3>

<ul>
<li>Health is a fundamental human right.</li>
<li>People should participate in decisions concerning their health.</li>
<li>Health services should be accessible to everyone.</li>
<li>Prevention and health promotion are important parts of health care.</li>
<li>Different sectors and health professionals should work together.</li>
<li>Communities should be encouraged to become self-reliant.</li>
</ul>

<h3>Principles of Primary Health Care</h3>

<ol>
<li>Equitable distribution of health services.</li>
<li>Community participation.</li>
<li>Intersectoral collaboration.</li>
<li>Appropriate technology.</li>
<li>Health promotion and disease prevention.</li>
</ol>

<h3>Primary Health Care Services in Nigeria</h3>

<p>
Primary Health Care services are organized to provide basic health care
at community and local government levels. They include preventive,
promotive, curative and rehabilitative services.
</p>

<h3>Role of the Nurse in PHC</h3>

<ul>
<li>Health education.</li>
<li>Maternal and child health services.</li>
<li>Immunization activities.</li>
<li>Community assessment.</li>
<li>Home visits.</li>
<li>Disease prevention and control.</li>
<li>Referral of clients.</li>
<li>Record keeping and reporting.</li>
<li>Community mobilization.</li>
</ul>

<h3>Multidisciplinary Team Approach</h3>

<p>
Primary Health Care requires different health workers and community
members to work together. Collaboration improves the quality,
coverage and continuity of health services.
</p>

`;



// ======================================================
// PHC I - UNIT II

notes["The Community: Structure and Functions"] = `

<h2>Unit II: The Community – Structure and Functions</h2>

<h3>Meaning of Community</h3>

<div class="definition">

A community is a group of people living in a particular geographical
area who share common interests, resources, institutions or social
relationships.

</div>

<h3>Family Patterns</h3>

<ul>
<li>Nuclear family.</li>
<li>Extended family.</li>
<li>Compound family.</li>
<li>Family of orientation.</li>
<li>Family of procreation.</li>
</ul>

<h3>Community Structure</h3>

<p>
Community structure refers to the way people, groups, institutions
and leadership systems are organized within a community.
</p>

<h3>Leadership and Decision Making</h3>

<p>
Community leaders may include traditional leaders, religious leaders,
political leaders, youth leaders and other influential persons.
They may help mobilize community members and support health programmes.
</p>

<h3>Functions of a Community</h3>

<ul>
<li>Provides social support.</li>
<li>Provides opportunities for interaction.</li>
<li>Helps protect community members.</li>
<li>Provides resources.</li>
<li>Supports cultural development.</li>
<li>Participates in solving community problems.</li>
</ul>

<h3>Identifying Community Health Needs</h3>

<p>
The nurse can identify health needs through observation, interviews,
home visits, surveys, community meetings and review of available
health records.
</p>

`;



// ======================================================
// PHC I - UNIT III

different professional responsibilities.
</p>

<ul>

<li>Midwives.</li>
<li>Public health nurses.</li>
<li>Community Health Officers.</li>
<li>Community Health Extension Workers.</li>

<li>Laboratory personnel.</li>
<li>Pharmacy personnel.</li>

<h3>Importance of Teamwork</h3>

<p>
Teamwork allows health workers to combine their knowledge and skills
to address the health needs of individuals, families and communities.
</p>

<h3>Role of the PHC Nurse</h3>

<ul>
<li>Assess individuals and communities.</li>
<li>Provide health education.</li>
<li>Participate in immunization.</li>
<li>Provide maternal and child health services.</li>
<li>Provide basic nursing care.</li>
<li>Identify health problems.</li>
<li>Make appropriate referrals.</li>
<li>Maintain health records.</li>
</ul>

`;



// ======================================================

notes["Community Mobilization"] = `

<h2>Unit IV: Community Mobilization</h2>

<h3>Meaning</h3>

<div class="definition">

Community mobilization is the process of bringing individuals,
groups and organizations together to identify health problems,
take action and use available resources to improve community health.

</div>

<h3>Community Participation</h3>

<p>
Community participation means involving members of the community
in identifying problems, planning programmes, implementing activities
and evaluating results.
</p>

<h3>Advocacy</h3>

<p>
Advocacy involves supporting or speaking on behalf of individuals,
groups or communities to influence decisions and policies that
improve health.
</p>

<h3>Steps in Community Mobilization</h3>

<ol>
<li>Identify the community.</li>
<li>Identify community leaders and stakeholders.</li>
<li>Identify community health problems.</li>
<li>Prioritize the problems.</li>
<li>Mobilize available resources.</li>
<li>Plan appropriate activities.</li>
<li>Implement the activities.</li>
<li>Evaluate the results.</li>
</ol>

<h3>Community Committees</h3>

<p>
Community committees can help organize health activities,
mobilize resources, encourage participation and represent
community interests.
</p>

`;

notes["Health Education"] = `

<h3>Behaviour Change Communication</h3>

<p>

</p>

<ul>
<li>Use simple language.</li>
<li>Consider the learner's level of understanding.</li>
<li>Encourage participation.</li>
<li>Use relevant examples.</li>
<li>Provide accurate information.</li>
<li>Allow questions and feedback.</li>
<li>Respect culture and beliefs.</li>
</ul>

<ul>
<li>Individual teaching.</li>
<li>Group discussion.</li>
<li>Demonstration.</li>
<li>Lecture.</li>
<li>Role play.</li>
<li>Use of posters and other IEC materials.</li>
</ul>

<h3>Guidance and Counselling</h3>

<p>
The PHC nurse provides guidance and counselling to individuals,
families and groups on issues such as nutrition, reproductive
health, disease prevention, medication use and healthy behaviours.
</p>

`;

notes["Clinical Skills in Primary Health Care"] = `

<h2>Unit VII: Clinical Skills in Primary Health Care</h2>

<h3>History Taking</h3>

<p>
History taking involves obtaining relevant information from the

medications, family history, social history and other relevant
information.
</p>

<h3>Physical Examination</h3>

<p>
Physical examination involves systematic assessment of the client.
It may include inspection, palpation, percussion and auscultation.
</p>

<h3>Reporting and Recording</h3>

<p>
Accurate recording and reporting ensure continuity of care and
provide useful information for decision-making and evaluation.
</p>

<h3>Standing Orders</h3>

<p>
Standing orders are written instructions that guide health workers
in performing specified procedures or providing specified services
under defined circumstances.
</p>

<h3>Diagnostic Techniques</h3>

<p>
Diagnostic techniques assist health workers in identifying health
conditions and determining appropriate management or referral.
</p>

`;

notes["Components of Primary Health Care"] = `

</ul>

notes["Immunization Against Major Communicable Diseases"] = `

<h2>Unit II: Immunization Against Major Communicable Diseases</h2>

<h3>Meaning of Immunization</h3>

<div class="definition">

Immunization is the process by which a person becomes protected
against a disease, usually through vaccination.

</div>

<h3>Importance</h3>

<ul>
<li>Prevents vaccine-preventable diseases.</li>
<li>Reduces complications.</li>
<li>Reduces deaths.</li>
<li>Protects individuals and communities.</li>
<li>Helps control outbreaks.</li>
</ul>

<h3>Cold Chain</h3>

<p>
The cold chain is the system used to store and transport vaccines
within recommended temperature conditions from the point of
manufacture to the point of administration.
</p>

<h3>Follow-up of Defaulters</h3>

<p>
Defaulters are clients who have missed scheduled immunization doses.
Health workers should identify and follow them up to improve
immunization coverage.
</p>

`;



notes["Prevention and Control of Endemic and Epidemic Diseases"] = `

<h2>Unit III: Prevention and Control of Locally Endemic and Epidemic Diseases</h2>

<h3>Important Terms</h3>

<ul>
<li><strong>Endemic:</strong> A disease regularly present in a particular area or population.</li>
<li><strong>Epidemic:</strong> Occurrence of disease cases above what is normally expected in a population or area.</li>
<li><strong>Incidence:</strong> Number of new cases occurring in a population during a specified period.</li>
<li><strong>Surveillance:</strong> Continuous systematic collection and use of health information.</li>
<li><strong>Reservoir:</strong> A place where an infectious organism normally lives and multiplies.</li>
<li><strong>Route of transmission:</strong> The way an infectious agent moves from its source to a susceptible person.</li>
</ul>

<h3>Prevention and Control</h3>

<ul>
<li>Health education.</li>
<li>Immunization.</li>
<li>Environmental sanitation.</li>
<li>Early detection.</li>
<li>Prompt treatment.</li>
<li>Contact tracing.</li>
<li>Disease notification.</li>
<li>Surveillance.</li>
</ul>

<h3>Common Injuries</h3>

function displayNote() {

    const content =
        notes[topic];

    const note =
        document.getElementById(
            "noteContent"
        );

    if (content) {

        note.innerHTML =
            content;

    }

    else {

        note.innerHTML = `

            <h2>
                ${escapeHTML(topic)}
            </h2>

            <p>
                The detailed note for this topic
                is being prepared.
            </p>

        `;

    }

}



function takeQuiz() {

    window.location.href =
        "phc-quiz.html?course=" +
        encodeURIComponent(course) +
        "&topic=" +
        encodeURIComponent(topic);

}



function goBack() {

    window.location.href =
        "phc-topics.html";

}



function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
